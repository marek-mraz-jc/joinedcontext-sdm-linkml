  protectionIP:
    description: 'Property. IP ''Ingress Protection'' for the Junction Box. This is
      the level classifies and rates the degree of protection provided by mechanical
      casings and electrical enclosures against intrusion, dust, accidental contact,
      and water according to International Electrotechnical Commission standard (EN
      60-529). First digit: Solid particle protection (Single numeral: 06 or ''X'').
      Second digit: Liquid ingress protection (Single numeral: 09 or ''X'' ).Third
      digit: Personal Protection against access to dangerous parts (optional additional
      letter). Fourth digit: Other protections (optional additional letter)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Energy@08c7f4c9c881acd7e20fa61a9a9f38f51f058561
    slot_uri: https://smartdatamodels.org/dataModel.Energy/protectionIP
  protectionIK:
    description: Property. IK '*Mecanic Protection*' level relating to numeric classification
      for the degrees of protection provided by enclosures for electrical equipment
      against external mechanical impacts, according to International Electro technical
      Commission standard (EN 62-262). - IK varies from 0 (minimum resistance) to
      10 (maximum resistance) which represents an Impact Energy (Unit Joule)
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Energy@08c7f4c9c881acd7e20fa61a9a9f38f51f058561
    slot_uri: https://smartdatamodels.org/dataModel.Energy/protectionIK
  maximumSystemVoltage:
    description: Property. Maximum system voltage permitted for the **module**. The
      unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **VLT** represents Volt
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Energy@08c7f4c9c881acd7e20fa61a9a9f38f51f058561
    slot_uri: https://smartdatamodels.org/dataModel.Energy/maximumSystemVoltage
  operatingTemperature:
    description: Property. Ambient operating temperature range. This is the minimum
      and maximum resistance to cold and heat. The format is structured by a sub-property
      of 2 items. The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **CEL** represents Degree Celsius
    range: OperatingTemperature
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Energy@08c7f4c9c881acd7e20fa61a9a9f38f51f058561
    slot_uri: https://smartdatamodels.org/dataModel.Energy/operatingTemperature
