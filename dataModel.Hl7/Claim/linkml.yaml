    "Organization/2"}}, "item": {"type": "Property", "value": [{"careTeamSequence":
    [1], "net": {"currency": "USD", "value": 135.57}, "productOrService": {"coding":
    [{"code": "1200"}]}, "sequence": 1, "servicedDate": "2014-08-16", "unitPrice":
    {"currency": "USD", "value": 135.57}}]}, "meta": {"type": "Property", "value":
    {"tag": [{"code": "HTEST", "display": "test health data", "system": "http://terminology.hl7.org/CodeSystem/v3-ActReason"}]}},
