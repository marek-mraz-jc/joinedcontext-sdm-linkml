id: https://github.com/smart-data-models/dataModel.DataSpace/VocabularyService
name: VocabularyService
title: Smart Data Models - Vocabulary Service
description: A data model for a Vocabulary Service tool. This service manages and
  hosts data models like vocabularies, ontologies, and schemas. It extends the base
  ToolInformation model.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.DataSpace
  spec.source.path: VocabularyService/schema.json
  spec.source.commit: 6b697c43d625441ebd057ef5f88e27fb2d01c2fd
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": "https://smart-data-models.github.io/dataModel.DataSpace/context.jsonld",
    "dataModelDomain": {"type": "Property", "value": ["Healthcare", "Finance"]}, "dataModelSpecificationType":
    {"type": "Property", "value": "Ontology"}, "dataModelVersioning": {"type": "Property",
    "value": "Full History"}, "dataspaceBuildingBlock": {"type": "Property", "value":
    "Semantic Interoperability"}, "dataspaceProductPurpose": {"type": "Property",
    "value": "To provide a centralized, governed repository for data models, ensuring
    semantic interoperability across the data space."}, "dataspaceService": {"type":
    "Property", "value": "Vocabulary Services"}, "dataspaceServiceCategory": {"type":
    "Property", "value": "Federation services"}, "description": {"type": "Property",
    "value": "A professional service for managing and publishing enterprise ontologies
    and data schemas."}, "documentation": {"type": "Property", "value": "https://docs.semanticsol.com/ontomanager"},
    "exportFormats": {"type": "Property", "value": ["application/json", "application/rdf+xml",
    "text/turtle"]}, "governanceFeatures": {"type": "Property", "value": "Role-based
