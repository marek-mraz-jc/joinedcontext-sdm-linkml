    {"type": "Property", "value": "2.5.0"}, "id": "urn:ngsi-ld:VocabularyService:VocabServ-001",
    "importFormats": {"type": "Property", "value": ["application/rdf+xml", "text/turtle",
    "application/vnd.ms-excel"]}, "license": {"type": "Property", "value": "https://example.com/licenses/commercial-eula"},
    "licenseDeclared": {"type": "Property", "value": "UNLICENSED"}, "maintainer":
