classes:
  VocabularyService:
    class_uri: https://smartdatamodels.org/dataModel.DataSpace/VocabularyService
    description: A data model for a Vocabulary Service tool. This service manages
      and hosts data models like vocabularies, ontologies, and schemas. It extends
      the base ToolInformation model.
    is_a: Entity
    slots:
    - dataModelDomain
    - dataModelSpecificationType
    - dataModelVersioning
    - exportFormats
    - governanceFeatures
    - importFormats
    - mappingFunctionalities
    - publicationAccessibility
    - referenceDatasetManagement
    - supportedStandards
    - supportedSyntaxes
    - validationCapabilities
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
slots:
  dataModelDomain:
    description: Property. Describes the subject areas or business domains of the
      data models managed by the service. Corresponds to dcterms:subject.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/dataModelDomain
  dataModelSpecificationType:
    description: Property. The type of data model specification supported (e.g., Ontology,
      Data Schema).
    range: dataModelSpecificationType_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/dataModelSpecificationType
  supportedSyntaxes:
    description: Property. Data model syntaxes the service can process (e.g., OWL,
      JSON Schema). Corresponds to dc:format.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/supportedSyntaxes
  importFormats:
    description: Property. Data formats the service can import for creating a data
      model (list of MIME types). Corresponds to dcat:mediatype.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/importFormats
  exportFormats:
    description: Property. Data formats in which the service can export data models
      (list of MIME types). Corresponds to dcat:mediaType.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/exportFormats
  dataModelVersioning:
    description: Property. The approach used for data model versioning. Corresponds
      to schema:version.
    range: dataModelVersioning_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/dataModelVersioning
  referenceDatasetManagement:
    description: Property. Describes how the service manages reference datasets (codelists).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/referenceDatasetManagement
  governanceFeatures:
    description: Property. Governance functionalities, such as role-based access control
      and workflow management.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/governanceFeatures
  publicationAccessibility:
    description: Property. Methods used to publish and make vocabularies accessible
      (e.g., SPARQL endpoint). Corresponds to dcat:accessService.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/publicationAccessibility
  validationCapabilities:
    description: Property. Specifies if the service offers validation of data instances
      against data models.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/validationCapabilities
  supportedStandards:
    description: Property. List of specific formal or industry standards that the
      service supports. Corresponds to dcterms:conformsTo.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/supportedStandards
  mappingFunctionalities:
    description: Property. Describes if the service provides functionalities for mapping
      between different data models.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    slot_uri: https://smartdatamodels.org/dataModel.DataSpace/mappingFunctionalities
