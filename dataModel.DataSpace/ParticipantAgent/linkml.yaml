classes:
  ParticipantAgent:
    class_uri: https://smartdatamodels.org/dataModel.DataSpace/ParticipantAgent
    description: A data model for a Participant Agent (Connector) tool. This tool
      can implement multiple services like Credential Store, Contract Negotiation,
      Transfer Process, and Data Plane. It extends the base ToolInformation model.
    is_a: Entity
    slots:
    - contractNegotiation
    - credentialStore
    - dataPlane
    - transferProcess
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
  TransferProcess:
    description: Property. Details of the transfer process capabilities.
    attributes:
      protocol:
        description: Property. Details of protocol(s) defining the transfer process.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
      authorization:
        description: Property. Details of authorization mechanisms used behind the
          transfer process.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.DataSpace@6b697c43d625441ebd057ef5f88e27fb2d01c2fd
