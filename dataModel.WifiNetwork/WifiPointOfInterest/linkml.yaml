  wifiStatus:
    description: 'Property. Model:''https://schema.org/Text''. Indicates if there
      is a wireless network available at    this location and the service that it
      is providing. The allowed values are: ''noService'' when the point of interest
      has no access points installed, ''working'' when the point of interest has access
      points installed and all of them are working (up), ''totalFailure'' when the
      point of interest has access points installed and all of them are not working
      (down), and ''workingPartially'' when the point of interest has access points
      installed and some of them are working (up) and some of then are not working
      (down). Enum:''noService, totalFailure, working, workingPartially'''
    range: wifiStatus_options
    annotations:
