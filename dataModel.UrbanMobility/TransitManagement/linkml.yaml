    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/uncertainty
  route_color:
    description: 'Property. If assigned, this field defines a color that corresponds
      to a route. The color must be provided as a six-character hexadecimal number,
      for example, 00FFFF. If no color is specified, the default route color is white
      (FFFFFF). SameAs: ''route_color'' field from GTFS Static Field definitions-routes.txt
      (https://developers.google.com/transit/gtfs/reference#routestxt)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/route_color
  travelDistance:
    description: Property. The distance between the origin bus stop and the destination
      bus stop or the total distance travelled corresponding to this observation
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/travelDistance
  actual_trip_start_time:
    description: 'Property. This field specifies the time at which service actually
      began.  This is SameAs: absolute ''time''(StopTimeEvent) in the ''arrival''
      field of the stop_time_update (StopTimeUpdate) message of the GTFS Realtime
      message-TripUpdate (https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate)'
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/actual_trip_start_time
  bearing:
    description: Property. Gives the vehicle GPS angle measured in a clockwise direction
      from the True North. SameAs 'bearing' field from GTFS Realtime message-Position(https://developers.google.com/transit/gtfs-realtime/reference#message-position)
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/bearing
  stop_sequence:
    description: 'Property. Indicates the stop sequence of the vehicle corresponding
      to this observation, can be referenced from the GTFS static feed stop_times.txt.
      SameAs: ''stop_sequence'' field from GTFS Realtime message-StopTimeUpdate (https://developers.google.com/transit/gtfs-realtime/reference#message-stoptimeupdate)'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/stop_sequence
  start_date:
    description: 'Property. Describes the initial scheduled date of the trip corresponding
      to the vehicle this observation. An example format for this field - YYYYMMDD.
      SameAs: ''start_date'' field from GTFS Realtime message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/start_date
  current_stop_sequence:
    description: Property. Gives the stop sequence index of the current stop. This
      is determined by considering current_status, if current_status is missing IN_TRANSIT_TO
      is assumed. SameAs:'current_stop_sequence' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/current_stop_sequence
  start_time:
    description: 'Property. Describes the initial scheduled start time of the trip
      corresponding to the vehicle this observation. An example format for this field
      - 11:15:35 or 25:15:35. SameAs: ''start_time'' field from GTFS Realtime message-TripDescriptor
      (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
    range: time
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/start_time
  trip_id:
    description: 'Property. Trip ID/Trip name allotted to the bus corresponding to
      this observation, in consideration to the time of the day and the direction
      of the trip on the given routeId. SameAs: ''trip_id'' field from GTFS Realtime
      message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/trip_id
  route_text_color:
    description: 'Property. This field can be used to specify a legible color to use
      for text drawn against a background of route_color. The color must be provided
      as a six-character hexadecimal number, for example, FFD700. If no color is specified,
      the default text color is black (000000). SameAs: ''route_text_color'' field
      from GTFS Static Field definitions-routes.txt (https://developers.google.com/transit/gtfs/reference#routestxt)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/route_text_color
  stop_url:
    description: 'Property. This field contains the URL of a web page about a particular
      stop and is different from the agency_url and the route_url fields. SameAs:
      ''stop_url'' field from GTFS Static Field definitions-stops.txt (https://developers.google.com/transit/gtfs/reference#stopstxt)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/stop_url
  departure:
    description: 'Property. If schedule_relationship is empty or SCHEDULED, either
      arrival or departure must be provided within a StopTimeUpdate. SameAs: ''departure''
      field from GTFS Realtime message-StopTimeUpdate (https://developers.google.com/transit/gtfs-realtime/reference#message-stoptimeupdate)'
    range: TransitManagementDeparture
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/departure
  ac_available:
    description: Property. Describes the presence of air conditioning option in the
      vehicle corresponding to this observation
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/ac_available
  tripDirection:
    description: Property. Gives the direction in which the vehicle is travelling
      in ENUM[UP,DN]
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/tripDirection
  agency_url:
    description: 'Property. The agency_url field contains the URL of the transit agency.
      SameAs: ''agency_url'' field from GTFS Static Field Definition - agency.txt
      (https://developers.google.com/transit/gtfs/reference#agencytxt)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/agency_url
  routeStopSequence:
    description: Property. Gives the stop ids/stop codes or station ids/station codes
      in the right sequence for the route or line or trip corresponding to this observation
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/routeStopSequence
  trip_direction:
    description: 'Property. Gives the direction in which the vehicle is travelling.
      SameAs: ''direction_id'' field from GTFS Realtime message-TripDescriptor but
      is represented in the form of an ENUM[UP,DN] in place of [0,1] as seen in ''direction_id''
      (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/trip_direction
  departure_time:
    description: "Property. Specifies the departure time from a specific stop for\
      \ a specific trip on a route. Times must be eight digits in HH:MM:SS format\
      \ (HH:MM:SS is also accepted, if the hour begins with 0). \nNote: Trips that\
      \ span multiple dates will have stop times greater than 24:00:00. For example,\
      \ if a trip begins at 10:30:00 p.m. and ends at 2:15:00 a.m. on the following\
      \ day, the stop times would be 22:30:00 and 26:15:00. Entering those stop times\
      \ as 22:30:00 and 02:15:00 would not produce the desired results. SameAs: 'departure_time'\
      \ field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)"
    range: time
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    slot_uri: https://smartdatamodels.org/dataModel.UrbanMobility/departure_time
  trip:
    description: Property. Describes the trip the vehicle corresponding to this observation
      is making. SameAs:'trip' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)(https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate)
