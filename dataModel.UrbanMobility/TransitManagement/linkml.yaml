  Trip_details:
    description: Property. A descriptor of realtime update on the schedule of a vehicle
      along a trip
    attributes:
      bearing:
        description: Property. Bearing, in degrees, clockwise from True North, i.e.,
          0 is North and 90 is East. This can be the compass bearing, or the direction
          towards the next stop or intermediate location. This should not be deduced
          from the sequence of previous positions, which clients can compute from
          previous data
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      odometer:
        description: Property. Odometer value, in meters. Units:'meters'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      speed:
        description: Property. Momentary speed measured by the vehicle, in meters
          per second. Units:'meters per second'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  Position:
    description: 'Property. Describes the current position of the vehicle corresponding
      to this observation. SameAs: position field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition).
      Model:''https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition'''
    attributes:
      latitude:
        description: Property. Degrees North, in the WGS-84 coordinate system
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      longitude:
        description: Property. Degrees East, in the WGS-84 coordinate system
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      bearing:
        description: Property. Bearing, in degrees, clockwise from True North, i.e.,
          0 is North and 90 is East. This can be the compass bearing, or the direction
          towards the next stop or intermediate location. This should not be deduced
          from the sequence of previous positions, which clients can compute from
          previous data
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      odometer:
        description: Property. Odometer value, in meters. Units:'meters'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      speed:
        description: Property. Momentary speed measured by the vehicle, in meters
          per second. Units:'meters per second'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  Stop_sequence_detail:
    description: 'Property. Describes the stop sequence for a trip in the designated
      route made by the public transit vehicle.SameAs: ''stop_sequence'' field from
      GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
    attributes:
      stop_sequence:
        description: Property. Must be the same as in stop_times.txt in the corresponding
          GTFS feed. Either stop_sequence or stop_id must be provided within a StopTimeUpdate
          - both fields cannot be empty. stop_sequence is required for trips that
          visit the same stop_id more than once (e.g., a loop) to disambiguate which
          stop the prediction is for
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_id:
        description: Property. Must be the same as in stops.txt in the corresponding
          GTFS feed. Either stop_sequence or stop_id must be provided within a StopTimeUpdate
          - both fields cannot be empty
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  Arrival:
    description: Property. If schedule_relationship is empty or SCHEDULED, either
      arrival or departure must be provided within a StopTimeUpdate - both fields
      cannot be empty. arrival and departure may both be empty when schedule_relationship
      is SKIPPED. If schedule_relationship is NO_DATA, arrival and departure must
      be empty
    attributes:
      uncertainty:
        description: 'Property. If uncertainty is omitted, it is interpreted as unknown.
          To specify a completely certain prediction, set its uncertainty to 0.SameAs:
          ''uncertainty'' field from GTFS Realtime message-StopTimeEvent (https://developers.google.com/transit/gtfs-realtime/reference#message-stoptimeevent)'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  Departure:
    description: Property. If schedule_relationship is empty or SCHEDULED, either
      arrival or departure must be provided within a StopTimeUpdate - both fields
      cannot be empty. arrival and departure may both be empty when schedule_relationship
      is SKIPPED. If schedule_relationship is NO_DATA, arrival and departure must
      be empty
    attributes:
