        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  Stop_time_update:
    description: Property. Additional information on the vehicle that is serving this
      trip
    attributes:
      stop_id:
        description: Property. Must be the same as in stops.txt in the corresponding
          GTFS feed. Either stop_sequence or stop_id must be provided within a StopTimeUpdate
          - both fields cannot be empty
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_sequence:
        description: Property. Must be the same as in stop_times.txt in the corresponding
          GTFS feed. Either stop_sequence or stop_id must be provided within a StopTimeUpdate
          - both fields cannot be empty. stop_sequence is required for trips that
          visit the same stop_id more than once (e.g., a loop) to disambiguate which
          stop the prediction is for
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      schedule_relationship:
        description: Property. Enum:'SCHEDULED, SKIPPED, NO_DATA'. SCHEDULED means
          that the vehicle is proceeding in accordance with its static schedule of
          stops, although not necessarily according to the times of the schedule.
          This is the default behavior. At least one of arrival and departure must
          be provided. SKIPPED means that The stop is skipped, i.e., the vehicle will
          not stop at this stop. The arrival and departure fields are optional. NO_DATA
          means that no data is given for this stop. It indicates that there is no
          realtime information available. When set NO_DATA is propagated through subsequent
          stops so this is the recommended way of specifying from which stop you do
          not have realtime information. When NO_DATA is set neither arrival nor departure
          should be supplied
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      arrival:
        description: Property. If schedule_relationship is empty or SCHEDULED, either
          arrival or departure must be provided within a StopTimeUpdate - both fields
          cannot be empty. arrival and departure may both be empty when schedule_relationship
          is SKIPPED. If schedule_relationship is NO_DATA, arrival and departure must
          be empty
        range: Arrival
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      departure:
        description: Property. If schedule_relationship is empty or SCHEDULED, either
          arrival or departure must be provided within a StopTimeUpdate - both fields
          cannot be empty. arrival and departure may both be empty when schedule_relationship
          is SKIPPED. If schedule_relationship is NO_DATA, arrival and departure must
          be empty
        range: Departure
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
