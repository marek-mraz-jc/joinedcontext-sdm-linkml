          times as 22:30:00 and 02:15:00 would not produce the desired results. SameAs:
          ''departure_time'' field from GTFS Static Field definitions-stop_times.txt
          (https://developers.google.com/transit/gtfs/reference#stop_timestxt).'
        range: time
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
