      stop_headsign:
        description: 'Property. This field contains the text that appears on a sign
          that identifies the trip’s destination to passengers. SameAs: ''stop_headsign''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      pickup_type:
        description: 'Property. Indicates pickup method.SameAs: ''pickup_type'' field
          from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      arrival_time:
        description: 'Property. Specifies the arrival time at a specific stop for
          a specific trip on a route. Times must be eight digits in HH:MM:SS format
          (HH:MM:SS is also accepted, if the hour begins with 0). Note: Trips that
          span multiple dates will have stop times greater than 24:00:00. For example,
          if a trip begins at 10:30:00 p.m. and ends at 2:15:00 a.m. on the following
          day, the stop times would be 22:30:00 and 26:15:00. Entering those stop
          times as 22:30:00 and 02:15:00 would not produce the desired results. SameAs:
          ''arrival_time'' field from GTFS Static Field definitions-stop_times.txt
          (https://developers.google.com/transit/gtfs/reference#stop_timestxt).'
        range: time
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      continuous_drop_off:
        description: 'Property. Indicates whether a rider can alight from the transit
          vehicle at any point along the vehicle’s travel path.SameAs: ''continuous_drop_off''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt).'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_id:
        description: Property. Unique ID assigned to the stop corresponding to this
          observation.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_sequence:
        description: Property. This field identifies the order of the stops for a
          particular trip. The values for stop_sequence must be non-negative integers,
          and they must increase along the trip. For example, the first stop on the
          trip could have a stop_sequence of 1, the second stop on the trip could
          have a stop_sequence of 23, the third stop could have a stop_sequence of
          40, and so on.
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      trip_id:
        description: Property. Trip ID/Trip name allotted to the bus corresponding
          to this observation, in consideration to the time of the day and the direction
          of the trip on the given routeId.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      continuous_pickup:
        description: 'Property. Indicates whether a rider can board the transit vehicle
          at any point along the vehicle’s travel path.SameAs: ''continuous_pickup''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt).'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      departure_time:
        description: 'Property. Specifies the departure time from a specific stop
          for a specific trip on a route. Times must be eight digits in HH:MM:SS format
          (HH:MM:SS is also accepted, if the hour begins with 0). Note: Trips that
          span multiple dates will have stop times greater than 24:00:00. For example,
          if a trip begins at 10:30:00 p.m. and ends at 2:15:00 a.m. on the following
