        description: 'Property. Unique ID assigned to the vehicle corresponding to
          this observation, used in internal system identification. SameAs: ''id''
          field from GTFS Realtime message-VehicleDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-vehicledescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      vehicle_label:
        description: 'Property. User visible label, i.e., something that must be shown
          to the passenger to help identify the correct vehicle. SameAs: ''label''
          field from GTFS Realtime message-VehicleDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-vehicledescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      license_plate:
        description: 'Property. Gives the License Plate number of the vehice. SameAs:
          ''license_plate'' field from GTFS Realtime message-VehicleDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-vehicledescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TripInfo:
    description: Property. Describes the trip the vehicle corresponding to this observation
      is making. SameAs:'trip' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition).
    attributes:
      schedule_relationship:
        description: 'Property. Describes if the Route/Trip has been scheduled. SameAs:
          ''schedule_relationship'' field from GTFS Realtime message-TripDescriptor
          ENUM[SCHEDULED, ADDED, UNSCHEDULED, CANCELED] (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_id:
        description: Property. Route ID assigned to the route on which the bus/vehicle
          corresponding to the bus in this observation is currently plying on.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      start_date:
        description: 'Property. Describes the initial scheduled date of the trip corresponding
          to the vehicle this observation. An example format for this field - YYYYMMDD.
          SameAs: ''start_date'' field from GTFS Realtime message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      trip_id:
        description: Property. Trip ID/Trip name allotted to the bus corresponding
          to this observation, in consideration to the time of the day and the direction
          of the trip on the given routeId.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      start_time:
        description: 'Property. Describes the initial scheduled start time of the
          trip corresponding to the vehicle this observation. An example format for
          this field - 11:15:35 or 25:15:35. SameAs: ''start_time'' field from GTFS
          Realtime message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor).'
        range: time
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      trip_direction:
        description: 'Property. Indicates the direction of travel of the vehicle corresponding
          to this observation, can be referenced from the GTFS static feed trips.txt.
          SameAs: ''direction_id'' field from GTFS Realtime message-TripDescriptor
          (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  PositionInfo:
    description: Property. Describes the current position of the vehicle corresponding
      to this observation. SameAs:'position' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition).
    attributes:
      bearing:
        description: Property. Bearing, in degrees, clockwise from True North, i.e.,
          0 is North and 90 is East. This can be the compass bearing, or the direction
          towards the next stop or intermediate location. This should not be deduced
          from the sequence of previous positions, which clients can compute from
          previous data
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      odometer:
        description: Property. Odometer value.
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      speed:
        description: Property. Momentary speed measured by the vehicle.
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  StopInfo:
    description: Property. Information about the path the vehicle corresponding to
      this observation travels along.
    attributes:
      stop_desc:
        description: 'Property. This field contains a description of a stop. SameAs:
          ''stop_desc'' field from GTFS Static Field definitions-stops.txt (https://developers.google.com/transit/gtfs/reference#stopstxt).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_code:
        description: 'Property. This field contains short text or a number that uniquely
          identifies the stop for passengers. Can be same as stop_id if it is for
          public. SameAs: ''stop_code'' field from GTFS Static Field definitions-stops.txt
          (https://developers.google.com/transit/gtfs/reference#stopstxt).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_id:
        description: Property. Unique ID assigned to the stop corresponding to this
          observation.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_url:
        description: 'Property. This field contains the URL of a web page about a
          particular stop and is different from the agency_url and the route_url fields.
          SameAs: ''stop_url'' field from GTFS Static Field definitions-stops.txt
          (https://developers.google.com/transit/gtfs/reference#stopstxt).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_name:
        description: 'Property. Describes the name of a stop or station. SameAs: ''stop_name''
          field from GTFS Static Field definitions-stops.txt (https://developers.google.com/transit/gtfs/reference#stopstxt).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  VehiclePositionInfo:
    description: Property. Describes the realtime position of the vehicle corresponding
      to this observation. SameAs:'vehicle' field from GTFS Realtime message-FeedEntity(https://developers.google.com/transit/gtfs-realtime/reference#message-feedentity)
    attributes:
      current_status:
        description: 'Property. Describes the status of the vehicle w.r.t the stop
          corresponding to this observation ENUM: [INCOMING_AT, STOPPED_AT, IN_TRANSIT_TO].
          SameAs:''current_status'' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      occupancy_status:
        description: Property. The degree of passenger occupancy for the vehicle.
          ENUM [EMPTY, MANY_SEATS_AVAILABLE, FEW_SEATS_AVAILABLE, STANDING_ROOM_ONLY,
          CRUSHED_STANDING_ROOM_ONLY, FULL, NOT_ACCEPTING_PASSENGERS, NO_DATA_AVAILABLE,
          NOT_BOARDABLE]
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      congestion_level:
        description: Property. Describes the congestion level that is affecting this
          vehicle. ENUM [UNKNOWN_CONGESTION_LEVEL, RUNNING_SMOOTHLY, STOP_AND_GO,
          CONGESTION, SEVERE_CONGESTION]
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_id:
        description: Property. Unique ID assigned to the stop corresponding to this
          observation
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_id:
        description: 'Property. Route ID assigned to the route on which the bus/vehicle
          corresponding to the bus in this observation is currently plying on. SameAs:
          ''route_id'' field from GTFS Realtime message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor).'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stopTimesInfo:
        description: Property. A descriptor of realtime update on the schedule of
          a vehicle along a trip.
        range: StopTimesInfo
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      arrivalUncertainty:
        description: 'Property. If schedule_relationship is empty or SCHEDULED, either
          arrival or departure must be provided within a StopTimeUpdate. SameAs: ''arrival''
          field from GTFS Realtime message-StopTimeUpdate (https://developers.google.com/transit/gtfs-realtime/reference#message-stoptimeupdate).'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      entity_id:
        description: Property. Feed unique ID for the entity corresponding to this
          observation.SameAs:'entity_id' field from GTFS Realtime message-FeedEntity(https://developers.google.com/transit/gtfs-realtime/reference#message-feedentity)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agencyInfo:
        description: Property. Agency information corresponding to this observation.
        range: AgencyInfo
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      departureUncertainty:
        description: 'Property. If schedule_relationship is empty or SCHEDULED, either
          arrival or departure must be provided within a StopTimeUpdate. SameAs: ''departure''
          field from GTFS Realtime message-StopTimeUpdate (https://developers.google.com/transit/gtfs-realtime/reference#message-stoptimeupdate).'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      vehicleInfo:
        description: Property. Describes the additional information of the vehicle
          corresponding to this observation. SameAs:'vehicle' field from GTFS Realtime
          message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)/(https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate)
        range: VehicleInfo
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      travelDistance:
        description: Property. The distance between the origin location and the destination
          location or the total distance travelled corresponding to this observation.
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      actual_trip_start_time:
        description: 'Property. This field specifies the time at which service actually
          began. This is SameAs: absolute ''time''(StopTimeEvent) in the ''arrival''
          field of the stop_time_update (StopTimeUpdate) message of the GTFS Realtime
          message-TripUpdate (https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate).'
        range: datetime
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      tripInfo:
        description: Property. Describes the trip the vehicle corresponding to this
          observation is making. SameAs:'trip' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition).
        range: TripInfo
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      positionInfo:
        description: Property. Describes the current position of the vehicle corresponding
          to this observation. SameAs:'position' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition).
        range: PositionInfo
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      depotName:
        description: Property. Describes the depot name of the bus depot corresponding
          to this observation.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      depotID:
        description: Property. Describes the unique id of the bus depot corresponding
          to this observation.
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stopInfo:
        description: Property. Information about the path the vehicle corresponding
          to this observation travels along.
        range: StopInfo
        annotations:
          ngsi_ld_kind: JsonProperty
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      current_stop_sequence:
        description: Property. Gives the stop sequence index of the current stop.
          This is determined by considering current_status, if current_status is missing
          IN_TRANSIT_TO is assumed. SameAs:'current_stop_sequence' field from GTFS
          Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  ShapeInfo:
    description: Property. Information about the path the vehicle corresponding to
      this observation travels along
    attributes:
      shape_id:
        description: Property. Identifies a shape
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      shape_dist_traveled:
        description: 'Property. Actual distance traveled along the shape from the
          first shape point to the point specified in this record. Used by trip planners
          to show the correct portion of the shape on a map. Values must increase
          along with shape_pt_sequence; they cannot be used to show reverse travel
          along a route. Distance units must be consistent with those used in stop_times.txt.
          Example: If a bus travels along the three points defined above for A_shp,
          the additional shape_dist_traveled values (shown here in kilometers) would
          look like this: shape_id,shape_pt_lat,shape_pt_lon,shape_pt_sequence,shape_dist_traveled
          A_shp,37.61956,-122.48161,0,0 A_shp,37.64430,-122.41070,6,6.8310 A_shp,37.65863,-122.30839,11,15.8765'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      shape_pt_sequence:
        description: 'Property. Sequence in which the shape points connect to form
          the shape. Values must increase along the trip but do not need to be consecutive.
          Example: If the shape ''A_shp'' has three points in its definition, the
          shapes.txt file might contain these records to define the shape: shape_id,shape_pt_lat,shape_pt_lon,shape_pt_sequence
          A_shp,37.61956,-122.48161,0 A_shp,37.64430,-122.41070,6 A_shp,37.65863,-122.30839,11'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TransitManagementStopTimesInfo:
    description: Property. A descriptor of realtime update on the schedule of a vehicle
      along a trip
    attributes:
      drop_off_type:
        description: 'Property. Indicates drop off method. SameAs: ''drop_off_type''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_headsign:
        description: 'Property. This field contains the text that appears on a sign
          that identifies the trip’s destination to passengers. SameAs: ''stop_headsign''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      pickup_type:
        description: 'Property. Indicates pickup method.SameAs: ''pickup_type'' field
          from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      arrival_time:
        description: 'Property. Specifies the arrival time at a specific stop for
          a specific trip on a route. Times must be eight digits in HH:MM:SS format
          (HH:MM:SS is also accepted, if the hour begins with 0). Note: Trips that
          span multiple dates will have stop times greater than 24:00:00. For example,
          if a trip begins at 10:30:00 p.m. and ends at 2:15:00 a.m. on the following
          day, the stop times would be 22:30:00 and 26:15:00. Entering those stop
          times as 22:30:00 and 02:15:00 would not produce the desired results. SameAs:
          ''arrival_time'' field from GTFS Static Field definitions-stop_times.txt
          (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        range: time
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      continuous_drop_off:
        description: 'Property. Indicates whether a rider can alight from the transit
          vehicle at any point along the vehicle’s travel path.SameAs: ''continuous_drop_off''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_id:
        description: Property. Unique ID assigned to the stop corresponding to this
          observation
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_sequence:
        description: Property. This field identifies the order of the stops for a
          particular trip. The values for stop_sequence must be non-negative integers,
          and they must increase along the trip. For example, the first stop on the
          trip could have a stop_sequence of 1, the second stop on the trip could
          have a stop_sequence of 23, the third stop could have a stop_sequence of
          40, and so on
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      trip_id:
        description: Property. Trip ID/Trip name allotted to the bus corresponding
          to this observation, in consideration to the time of the day and the direction
          of the trip on the given routeId
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      continuous_pickup:
        description: 'Property. Indicates whether a rider can board the transit vehicle
          at any point along the vehicle’s travel path.SameAs: ''continuous_pickup''
          field from GTFS Static Field definitions-stop_times.txt (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      departure_time:
        description: 'Property. Specifies the departure time from a specific stop
          for a specific trip on a route. Times must be eight digits in HH:MM:SS format
          (HH:MM:SS is also accepted, if the hour begins with 0). Note: Trips that
          span multiple dates will have stop times greater than 24:00:00. For example,
          if a trip begins at 10:30:00 p.m. and ends at 2:15:00 a.m. on the following
          day, the stop times would be 22:30:00 and 26:15:00. Entering those stop
          times as 22:30:00 and 02:15:00 would not produce the desired results. SameAs:
          ''departure_time'' field from GTFS Static Field definitions-stop_times.txt
          (https://developers.google.com/transit/gtfs/reference#stop_timestxt)'
        range: time
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TransitManagementAgencyInfo:
    description: Property. Agency information corresponding to this observation
    attributes:
      agency_lang:
        description: 'Property. Contains a two-letter ISO 639-1 code for the primary
          language used by this transit agency. The language code is case-insensitive
          (both en and EN are accepted). SameAs: ''agency_lang'' field from GTFS Static
          Field Definition - agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_fare_url:
        description: 'Property. URL of a web page that contains the details of the
          fares and also could allow to purchase tickets for that agency online. SameAs:
          ''agency_fare_url'' field from GTFS Static Field Definition - agency.txt
          (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_id:
        description: 'Property. ID that uniquely identifies a transit agency. A transit
          feed may represent data from more than one agency. The agency_id is dataset
          unique. This field is optional for transit feeds that only contain data
          for a single agency. SameAs: ''agency_id'' field from GTFS Static Field
          Definition - agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_email:
        description: 'Property. Email address actively monitored by the agency’s customer
          service department. SameAs: ''agency_email'' field from GTFS Static Field
          Definition - agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_timezone:
        description: 'Property. Timezone field contains the timezone where the transit
          agency is located. SameAs: ''agency_timezone'' field from GTFS Static Field
          Definition - agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_name:
        description: 'Property. The agency_name field contains the full name of the
          transit agency. SameAs: ''agency_name'' field from GTFS Static Field Definition
          - agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_phone:
        description: 'Property. A voice telephone number for the specified agency.SameAs:
          ''agency_phone'' field from GTFS Static Field Definition - agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      agency_url:
        description: 'Property. The agency_url field contains the URL of the transit
          agency. SameAs: ''agency_url'' field from GTFS Static Field Definition -
          agency.txt (https://developers.google.com/transit/gtfs/reference#agencytxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TransitManagementVehicleInfo:
    description: Property. Describes the additional information of the vehicle corresponding
      to this observation. SameAs:'vehicle' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)/(https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate)
    attributes:
      vehicleID:
        description: 'Property. Unique ID assigned to the vehicle corresponding to
          this observation, used in internal system identification. SameAs: ''id''
          field from GTFS Realtime message-VehicleDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-vehicledescriptor)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      vehicle_label:
        description: 'Property. User visible label, i.e., something that must be shown
          to the passenger to help identify the correct vehicle. SameAs: ''label''
          field from GTFS Realtime message-VehicleDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-vehicledescriptor)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      license_plate:
        description: 'Property. Gives the License Plate number of the vehice. SameAs:
          ''license_plate'' field from GTFS Realtime message-VehicleDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-vehicledescriptor)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TransitManagementTripInfo:
    description: Property. Describes the trip the vehicle corresponding to this observation
      is making. SameAs:'trip' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)
    attributes:
      schedule_relationship:
        description: 'Property. Describes if the Route/Trip has been scheduled. SameAs:
          ''schedule_relationship'' field from GTFS Realtime message-TripDescriptor
          ENUM[SCHEDULED, ADDED, UNSCHEDULED, CANCELED] (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_id:
        description: Property. Route ID assigned to the route on which the bus/vehicle
          corresponding to the bus in this observation is currently plying on
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      start_date:
        description: 'Property. Describes the initial scheduled date of the trip corresponding
          to the vehicle this observation. An example format for this field - YYYYMMDD.
          SameAs: ''start_date'' field from GTFS Realtime message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      trip_id:
        description: Property. Trip ID/Trip name allotted to the bus corresponding
          to this observation, in consideration to the time of the day and the direction
          of the trip on the given routeId
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      start_time:
        description: 'Property. Describes the initial scheduled start time of the
          trip corresponding to the vehicle this observation. An example format for
          this field - 11:15:35 or 25:15:35. SameAs: ''start_time'' field from GTFS
          Realtime message-TripDescriptor (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
        range: time
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      trip_direction:
        description: 'Property. Indicates the direction of travel of the vehicle corresponding
          to this observation, can be referenced from the GTFS static feed trips.txt.
          SameAs: ''direction_id'' field from GTFS Realtime message-TripDescriptor
          (https://developers.google.com/transit/gtfs-realtime/reference#message-tripdescriptor)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TransitManagementPositionInfo:
    description: Property. Describes the current position of the vehicle corresponding
      to this observation. SameAs:'position' field from GTFS Realtime message-VehiclePosition(https://developers.google.com/transit/gtfs-realtime/reference#message-vehicleposition)
    attributes:
      bearing:
        description: Property. Bearing, in degrees, clockwise from True North, i.e.,
          0 is North and 90 is East. This can be the compass bearing, or the direction
          towards the next stop or intermediate location. This should not be deduced
          from the sequence of previous positions, which clients can compute from
          previous data
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      odometer:
        description: Property. Odometer value
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      speed:
        description: Property. Momentary speed measured by the vehicle
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  TransitManagementStopInfo:
    description: Property. Information about the path the vehicle corresponding to
      this observation travels along
    attributes:
      stop_desc:
        description: 'Property. This field contains a description of a stop. SameAs:
          ''stop_desc'' field from GTFS Static Field definitions-stops.txt (https://developers.google.com/transit/gtfs/reference#stopstxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_code:
        description: 'Property. This field contains short text or a number that uniquely
          identifies the stop for passengers. Can be same as stop_id if it is for
          public. SameAs: ''stop_code'' field from GTFS Static Field definitions-stops.txt
          (https://developers.google.com/transit/gtfs/reference#stopstxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_id:
        description: Property. Unique ID assigned to the stop corresponding to this
          observation
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_url:
        description: 'Property. This field contains the URL of a web page about a
          particular stop and is different from the agency_url and the route_url fields.
          SameAs: ''stop_url'' field from GTFS Static Field definitions-stops.txt
          (https://developers.google.com/transit/gtfs/reference#stopstxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_name:
        description: 'Property. Describes the name of a stop or station. SameAs: ''stop_name''
          field from GTFS Static Field definitions-stops.txt (https://developers.google.com/transit/gtfs/reference#stopstxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  StopTimeUpdateInfo:
    description: 'Property. Updated sorted stop sequence for the trip made by the
      vehicle corresponding to this observation, not to be considered if schedule_relationship
      is ''CANCELED''. SameAs: ''stop_time_update'' field from GTFS Realtime message-TripUpdate
      (https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate)'
    attributes:
      stop_id:
        description: Property. Unique ID assigned to the stop corresponding to this
          observation
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stop_sequence:
        description: Property. This field identifies the order of the stops for a
          particular trip. The values for stop_sequence must be non-negative integers,
          and they must increase along the trip. For example, the first stop on the
          trip could have a stop_sequence of 1, the second stop on the trip could
          have a stop_sequence of 23, the third stop could have a stop_sequence of
          40, and so on
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      stopScheduleRelationship:
        description: 'Property. Describes the relationship between the static schedule
          and the stop. SameAs: ''schedule_relationship'' field from GTFS Realtime
          message-StopTimeUpdate ENUM[SCHEDULED, SKIPPED, NO_DATA] (https://developers.google.com/transit/gtfs-realtime/reference#message-stoptimeupdate)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
  RouteInfo:
    description: 'Property. Updated sorted stop sequence for the trip made by the
      vehicle corresponding to this observation, not to be considered if schedule_relationship
      is ''CANCELED''. SameAs: ''stop_time_update'' field from GTFS Realtime message-TripUpdate
      (https://developers.google.com/transit/gtfs-realtime/reference#message-tripupdate)'
    attributes:
      route_url:
        description: 'Property. Contains the URL of a web page about that particular
          route and is different from the agency_url. SameAs: ''route_url'' field
          from GTFS Static Field definitions-routes.txt (https://developers.google.com/transit/gtfs/reference#routestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_type:
        description: 'Property. Number indicating the type of transport- 1 - Subway,
          Metro. Any underground rail system within a metropolitan area. 2 - Rail.
          Used for intercity or long-distance travel. 3 - Bus. Used for short- and
          long-distance bus routes. SameAs: ''route_type'' field from GTFS Static
          Field definitions-routes.txt (https://developers.google.com/transit/gtfs/reference#routestxt)'
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_id:
        description: Property. Route ID assigned to the route on which the bus/vehicle
          corresponding to the bus in this observation is currently plying on
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_long_name:
        description: 'Property. Full name of a route. This name is more descriptive
          than the routeShortName and often includes the route''s destination or stop.
          This mostly includes the to and from destination names of the route. SameAs:
          ''route_long_name'' field from GTFS Static Field definitions-routes.txt
          (https://developers.google.com/transit/gtfs/reference#routestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_desc:
        description: 'Property. Description of the route. This can include the entire
          route details including to and from destination and timing information in
          a text description form. SameAs: ''route_desc'' field from GTFS Static Field
          definitions-routes.txt (https://developers.google.com/transit/gtfs/reference#routestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_color:
        description: 'Property. If assigned, this field defines a color that corresponds
          to a route. The color must be provided as a six-character hexadecimal number,
          for example, 00FFFF. If no color is specified, the default route color is
          white (FFFFFF). SameAs: ''route_color'' field from GTFS Static Field definitions-routes.txt
          (https://developers.google.com/transit/gtfs/reference#routestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_text_color:
        description: 'Property. This field can be used to specify a legible color
          to use for text drawn against a background of route_color. The color must
          be provided as a six-character hexadecimal number, for example, FFD700.
          If no color is specified, the default text color is black (000000). SameAs:
          ''route_text_color'' field from GTFS Static Field definitions-routes.txt
          (https://developers.google.com/transit/gtfs/reference#routestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
      route_short_name:
        description: 'Property. Short name of a route. This will often be the transit
          vehicle''s board name like "402D", or "Green" that riders use to identify
          a route. SameAs: ''route_short_name'' field from GTFS Static Field definitions-routes.txt
          (https://developers.google.com/transit/gtfs/reference#routestxt)'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility@81a052c84d275a71489910c4f93eb3b6c80c4830
