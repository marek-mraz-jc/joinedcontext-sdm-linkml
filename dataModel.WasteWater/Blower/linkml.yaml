id: https://github.com/smart-data-models/dataModel.WasteWater/Blower
name: Blower
title: WasteWaterTreatment - Blower
description: This entity contains an harmonised description of a Blower made for the
  Wastewater treatment domain. The entity represents a Blower that are used for aeration
  purposes in the wastewater treatment process. Important parameters are measured
  to regulate and measure the amount of airflow is being provided to the aeration
  tank in the bioreactor. Energy consumption of a blower is also important information
  for real-time control and optimisation of the wastewater treatment plant.
