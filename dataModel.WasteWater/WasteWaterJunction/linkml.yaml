id: https://github.com/smart-data-models/dataModel.WasteWater/WasteWaterJunction
name: WasteWaterJunction
title: WasteWaterTreatment - Junction
description: This entity contains an harmonised description of a generic Junction
  made for the Wastewater treatment domain. Junctions could be in place in certain
  sections of thetreatment plant. In wastewater treatment purposes, the junction is
  most useful if it is a locationof a sensor that measures a specific variable.
