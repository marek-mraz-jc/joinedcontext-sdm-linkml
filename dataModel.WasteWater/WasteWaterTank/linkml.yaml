id: https://github.com/smart-data-models/dataModel.WasteWater/WasteWaterTank
name: WasteWaterTank
title: WasteWaterTreatment - Waste Water Tank
description: This entity contains an harmonised description of a generic Tank made
  for the Wastewater treatment domain. For a given type of tank, all possible variables
  that can be measures are listed as properties. In the description property, the
  type of tank (anaerobic, pre-dinitrification, nitrification etc.)can be defined.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
  ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
  qudt-unit: http://qudt.org/vocab/unit/
  qudt-quantkind: http://qudt.org/vocab/quantitykind/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.WasteWater
  spec.source.path: WasteWaterTank/schema.json
  spec.source.commit: 6abce4a1290843cd3aa6d95a60913015d7e104a1
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.WasteWater/master/context.jsonld"],
    "description": {"type": "Property", "value": "Aerobic tank in treatment lane 2."},
    "do": {"type": "Property", "value": 1.2}, "endsAt": {"object": "urn:ngsi-ld:WasteWaterTank:secondarySettler2a",
    "type": "Relationship"}, "id": "urn:ngsi-ld:WasteWaterTank:aerobicTank2", "name":
    {"type": "Property", "value": "Aerobic Tank 2"}, "nh4": {"type": "Property", "value":
    1.3}, "no3": {"type": "Property", "value": 5.2}, "pH": {"type": "Property", "value":
    7.8}, "redox": {"type": "Property", "value": 250}, "sludgeLevel": {"type": "Property",
    "value": 0.8}, "startsAt": {"object": "urn:ngsi-ld:WasteWaterTank:facultativeTank2",
    "type": "Relationship"}, "temperature": {"type": "Property", "value": 16}, "tss":
    {"type": "Property", "value": 3500}, "type": "WasteWaterTank"}'
