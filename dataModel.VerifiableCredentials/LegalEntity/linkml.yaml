          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      legalAddress:
        description: Property. Official legal address of Credential Subject
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      VATRegistration:
        description: Property. VAT number  of Credential Subject
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      taxReference:
        description: Property. Official tax reference number of Credential Subject
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      LEI:
        description: Property. Official legal entity identifier (LEI) of Credential
          Subject (referred to in Commission Implementing Regulation (EU) No 1247/2012)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      EORI:
        description: Property. Economic Operator Registration and Identification (EORI)
          of Credential Subject (referred to in Commission Implementing Regulation
          (EU) No 1352/2013)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      SEED:
        description: Property. System for Exchange of Excise Data (SEED) of Credential
          Subject (i.e. excise number provided in Article 2(12) of Council Regulation
          (EC) No 389/2012)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      SIC:
        description: Property. Standard Industrial Classification (SIC) of Credential
          Subject (Article 3(1) of Directive 2009/101/EC of the European Parliament
          and of the Council.)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      domainName:
        description: Property. Domain name  of Credential Subject
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
