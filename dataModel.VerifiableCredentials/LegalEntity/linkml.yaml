- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.VerifiableCredentials
  spec.source.path: LegalEntity/schema.json
  spec.source.commit: 6d7f230e04c68631174483adfc610bb4fab53ab0
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
classes:
  LegalEntity:
    class_uri: https://smartdatamodels.org/dataModel.VerifiableCredentials/LegalEntity
    description: Schema of an EBSI Verifiable ID for a legal entity
    is_a: Entity
    slots:
    - credentialSubject
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
  CredentialSubject:
    description: Property. Defines information about the subject that is described
      by the Verifiable ID
    attributes:
      id:
        description: Property. Defines the DID of the subject that is described by
          the Verifiable Attestation
        range: uriorcurie
        required: true
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      identifier:
        description: Property. Description to be completed
        annotations:
          ngsi_ld_kind: ListProperty
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      legalPersonIdentifier:
        description: Property. National/Legal Identifier of Credential Subject (constructed
          by the sending Member State in accordance with the technical specifications
          for the purposes of cross-border identification and which is as persistent
          as possible in time)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      legalName:
        description: Property. Official legal name of Credential Subject
