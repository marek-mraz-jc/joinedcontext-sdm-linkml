    description: Property. Contains information about how to verify the status of
      the Verifiable Attestation (via the Revocation and Endorsement Registry, RER)
    attributes:
      id:
        description: Property. References record in the Revocation and Endorsement
          Registry (RER) to enable verification of a Verifiable Attestation’s validity
        range: uriorcurie
        required: true
        annotations:
          ngsi_ld_kind: Property
