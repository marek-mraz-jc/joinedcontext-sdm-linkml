          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      statusListIndex:
        description: Property. Integer expressed as a string. The zero based index
          value identifies the bit position of the status
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      statusListCredential:
        description: Property. URL referencing the StatusList2021Credential
        range: uriorcurie
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
  CredentialSchema:
    description: Property. Contains information about the credential schema (template)
      on which the Verifiable Authorisation is based
    attributes:
      id:
        description: Property. References the credential schema (template) stored
          on the (relevant) Trusted Schemas Registry (TSR) on which the Verifiable
          Authorisation is based
        range: uriorcurie
        required: true
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      type:
        description: Property. Defines credential schema type
        required: true
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
  Proof:
