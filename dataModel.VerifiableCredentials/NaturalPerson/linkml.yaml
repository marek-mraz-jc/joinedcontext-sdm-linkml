      personalIdentifier:
        description: Property. Defines the unique national identifier of the credential
          subject (constructed by the sending Member State in accordance with the
          technical specifications for the purposes of cross-border identification
          and which is as persistent as possible in time)
        required: true
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      nameAndFamilyNameAtBirth:
        description: Property. Defines the first and the family name(s) of the credential
          subject at the time of their birth
