          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      placeOfBirth:
        description: Property. Defines the place where the credential subjectis born
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.VerifiableCredentials@6d7f230e04c68631174483adfc610bb4fab53ab0
      currentAddress:
        description: Property. Defines the current address of the credential subject
