        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
  PrefLabel:
    description: Property. Model:'https://www.w3.org/TR/skos-reference/#prefLabel'.
      A preferred label is a string of UNICODE characters, such as 'romantic love'
      or 'れんあい', in a given natural language, such as English or Japanese (written
      here in hiragana). The Simple Knowledge Organization System provides some basic
      vocabulary for associating lexical labels with resources of any type. The preferred
      label is useful when generating or creating human-readable representations of
      a knowledge organization system. These labels provide the strongest clues as
      to the meaning of a SKOS concept. Formally, a preferred label is an RDF plain
      literal [RDF-CONCEPTS, https://www.w3.org/TR/skos-reference/#ref-RDF-CONCEPTS].
      An RDF plain literal is composed of a lexical form, which is a string of UNICODE
      characters, and an optional language tag, which is a string of characters conforming
      to the syntax defined by [BCP47, https://www.w3.org/TR/skos-reference/#ref-BCP47]
    attributes:
      en:
        description: Property. Label in English
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      fr:
        description: Property. Label in French
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      it:
        description: Property. Label in Italian
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      es:
        description: Property. Label in Spanish
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      de:
        description: Property. Label in German language
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      jp:
        description: Property. Label in Japanese
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      zh:
        description: Property. Label in Chinese
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
