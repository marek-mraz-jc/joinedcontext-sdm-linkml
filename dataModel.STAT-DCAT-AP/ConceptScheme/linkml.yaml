id: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP/ConceptScheme
name: ConceptScheme
title: Smart Data models - SKOS ConceptSchema schema
description: A SKOS concept scheme can be viewed as an aggregation of one or more
  SKOS concepts. Semantic relationships (links) between those concepts may also be
  viewed as part of a concept scheme. This definition is, however, meant to be suggestive
  rather than restrictive, and there is some flexibility in the formal data model
  stated below.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP
  spec.source.path: ConceptScheme/schema.json
  spec.source.commit: afab368490bf559379e3743336e7adec0e34f739
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smart-data-models.github.io/dataModel.STAT-DCAT-AP/context.jsonld",
    "https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld"], "hasTopConcept":
    {"type": "Relationship", "value": ["urn:ngsi-ld:Concept:C", "urn:ngsi-ld:Concept:I",
    "urn:ngsi-ld:Concept:K", "urn:ngsi-ld:Concept:M", "urn:ngsi-ld:Concept:N", "urn:ngsi-ld:Concept:R",
    "urn:ngsi-ld:Concept:S", "urn:ngsi-ld:Concept:T", "urn:ngsi-ld:Concept:W", "urn:ngsi-ld:Concept:X",
    "urn:ngsi-ld:Concept:Y", "urn:ngsi-ld:Concept:_Z"]}, "id": "urn:ngsi-ld:ConceptSchema:ajustementsSaisonnier",
    "language": {"type": "Property", "value": ["en", "fr"]}, "prefLabel": {"type":
    "Property", "value": {"en": "Ajustement saisonnier", "fr": "Seasonal ajustments"}},
    "type": "ConceptScheme"}'
classes:
  ConceptScheme:
    class_uri: https://smartdatamodels.org/dataModel.STAT-DCAT-AP/ConceptScheme
    description: A SKOS concept scheme can be viewed as an aggregation of one or more
      SKOS concepts. Semantic relationships (links) between those concepts may also
      be viewed as part of a concept scheme. This definition is, however, meant to
      be suggestive rather than restrictive, and there is some flexibility in the
      formal data model stated below.
    is_a: Entity
    slots:
    - address
    - alternateName
    - areaServed
    - dataProvider
    - dateCreated
    - dateModified
    - description
    - hasTopConcept
    - language
    - name
    - owner
    - prefLabel
    - seeAlso
    - source
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
