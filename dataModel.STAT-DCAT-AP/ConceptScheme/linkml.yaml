    range: PrefLabel
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP@afab368490bf559379e3743336e7adec0e34f739
    slot_uri: https://smartdatamodels.org/dataModel.STAT-DCAT-AP/prefLabel
