  hasTopConcept:
    description: Relationship. Model:'https://www.w3.org/TR/skos-reference/#schemes'.
      The property skos:hasTopConcept is, by convention, used to link a concept scheme
      to the SKOS concept(s) which are topmost in the hierarchical relations for that
      scheme. However, there are no integrity conditions enforcing this convention.
      Therefore, the graph below, whilst not strictly adhering to the usage convention
      for skos:hasTopConcept, is nevertheless consistent with the SKOS data model
    annotations:
