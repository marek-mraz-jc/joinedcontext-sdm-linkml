    "inScheme": {"object": "urn:ngsi-ld:ConceptSchema:ajustementsSaisonnier", "type":
    "Relationship"}, "language": {"type": "Property", "value": ["en", "fr"]}, "notation":
    {"type": "Property", "value": "N"}, "prefLabel": {"type": "Property", "value":
    {"en": "Neither seasonally adjusted nor calendar adjusted data", "fr": "Non ajust\u00e9e"}},
    "type": "Concept"}'
