id: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP/Concept
name: Concept
title: Smart Data models - SKOS Concept schema
description: A SKOS concept can be viewed as an idea or notion; a unit of thought.
  However, what constitutes a unit of thought is subjective, and this definition is
  meant to be suggestive, rather than restrictive. The notion of a SKOS concept is
  useful when describing the conceptual or intellectual structure of a knowledge organization
  system, and when referring to specific ideas or meanings established within a KOS.
  Note that, because SKOS is designed to be a vehicle for representing semi-formal
  KOS, such as thesauri and classification schemes, a certain amount of flexibility
  has been built in to the formal definition of this class.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.STAT-DCAT-AP
  spec.source.path: Concept/schema.json
