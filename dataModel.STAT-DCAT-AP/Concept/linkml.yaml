    slot_uri: https://smartdatamodels.org/dataModel.STAT-DCAT-AP/prefLabel
  notation:
    description: Property. Model:'https://www.w3.org/TR/skos-reference/#notations'.
      A notation is a string of characters such as 'T58.5' or '303.4833' used to uniquely
      identify a concept within the scope of a given concept scheme. A notation is
