id: https://github.com/smart-data-models/dataModel.SDG/Project
name: Project
title: Smart Data Models - Project for sustainable development goals
description: Set of activities that, when executed support the compliance of a strategic
  goal (Provision of Key Services, Management Evolution, Close contact with Territory,
  Enterprises Boosting, Focused Investment, Social/Cultural/Sports Promotion, etc.).
  This goal itself is composed of one or more project,s and address one of the strategic
  axes (Work model, Economic development, Social development, Environmental Development)
  that give a high level shape to the Strategic Plan
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.SDG
  spec.source.path: Project/schema.json
  spec.source.commit: c8b552a4f3dde404ac482db4e5ee5e17736e45e0
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smart-data-models.github.io/dataModel.SDG/context.jsonld"],
    "axis": {"type": "Property", "value": "B. DESARROLLO ECONOMICO"}, "dateCreated":
    {"type": "Property", "value": {"@type": "Date-Time", "@value": "2016-08-08T10:18:16Z"}},
    "dateModified": {"type": "Property", "value": {"@type": "Date-Time", "@value":
    "2016-08-08T10:18:16Z"}}, "delegations": {"type": "Property", "value": ["TRANSFORMATION
    DIGITAL Y TURISMO"]}, "delegationsInvolved": {"type": "Property", "value": ["BIENESTAR
    SOCIAL", "CONCERTACION Y PARTICIPACION TERRITORIAL"]}, "description": {"type":
    "Property", "value": "Realizar un estudio que permita conocer las necesidades
    de nuevos servicios que a futuro deba prestar la DiputaciOn de Badajoz, de modo
    que le permita anticiparte y adaptarse a las nuevas necesidades de todos sus grupos
    de interes. Analizar cmo mejorar el cumplimiento de los ODS por parte de la Diputaci6n
    con nuevas actuaciones y eliminacion de otras obsoletas ejecutadas por rutina
    y sin evaluar."}, "id": "0.E.6.AY1", "interestGroups": {"type": "Property", "value":
    ["AYUNTAMIENTOS"]}, "name": {"type": "Property", "value": "O.E.6.AY1 Plan Smart
    Provincia"}, "plan": {"type": "Property", "value": "EDS"}, "type": "Project"}'
