  primaryKey:
    description: Property. Field name in the primaryKey 'MUST' be unique, and 'MUST'
      match a field name in the associated table. It is acceptable to have an array
      with a single value, indicating that the value of a single field is the primary
      key. A primary key is a field name or an array of field names, whose values
      'MUST' uniquely identify each row in the table
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.FrictionlessData@0fb05ed83f08370f87fd736e44f2b2df41306579
