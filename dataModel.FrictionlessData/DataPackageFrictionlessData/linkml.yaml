  spec.source.commit: 0fb05ed83f08370f87fd736e44f2b2df41306579
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.FrictionlessData/master/context.jsonld"],
    "description": {"type": "Property", "value": "Annual Consumer Price Index (CPI)
    for most countries in the world. Reference year is 2005."}, "id": "uri:ngsi-ld:datapackage:001",
    "keywords": {"type": "Property", "value": ["CPI", "World", "Consumer Price Index",
    "Annual Data", "The World Bank"]}, "licenses": {"type": "Property", "value": [{"name":
    "CC-BY-4.0", "path": "https://creativecommons.org/licenses/by/4.0/", "title":
    "Creative Commons Attribution 4.0"}]}, "name": {"type": "Property", "value": "cpi"},
    "profile": {"type": "Property", "value": "tabular-data-package"}, "resources":
    {"type": "Property", "value": [{"name": "cpi", "path": "data/cpi.csv", "profile":
    "tabular-data-resource", "schema": {"fields": [{"name": "Country Name", "type":
    "string"}, {"name": "Country Code", "type": "string"}, {"name": "Year", "type":
    "year"}, {"description": "CPI (where 2005=100)", "name": "CPI", "type": "number"}]}}]},
    "sources": {"type": "Property", "value": [{"path": "http://data.worldbank.org/indicator/FP.CPI.TOTL",
    "title": "The World Bank"}]}, "title": {"type": "Property", "value": "Annual Consumer
    Price Index (CPI)"}, "type": "DataPackageFrictionlessData"}'
