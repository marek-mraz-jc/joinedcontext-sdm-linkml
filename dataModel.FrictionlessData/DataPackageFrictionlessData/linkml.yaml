title: Smart Data Models - Data Package
description: Data Package is a simple specification for data access and delivery.Converted
  for Smart Data Models initiative from original frictionless data
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
