    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/averageSpotLength
  refParkingSpot:
    description: Relationship. Individual parking spots belonging to this on street
      parking site
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/refParkingSpot
  refParkingGroup:
    description: Relationship. Reference to the parking group(s) (if any) belonging
