  outOfServiceSlotNumber:
    description: Property. Model:'https://schema.org/Number'. The number of bike racks/bike-docking
      slots or parking slots that are out of order and cannot be used to hire or park
      a bike in the bike docking station or parking site corresponding to this observation
    range: float
    annotations:
