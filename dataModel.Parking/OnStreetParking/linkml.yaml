    description: 'Property. The total number of spots offered by this parking site.
      This number can be difficult to be obtained for those parking locations on which
      spots are not clearly marked by lines. Model:''http://schema.org/Number''. Normative
      references: DATEX 2 version 2.3 attribute _parkingNumberOfSpaces_ of the _ParkingRecord_
      class'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/totalSpotNumber
  availableSpotNumber:
    description: Property. The number of spots available globally, including reserved
      spaces, such as those for disabled people, long term parkers and so on. This
      might be harder to estimate at those parking locations on which spots borders
      are not clearly marked by lines. Model:'http://schema.org/Number'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/availableSpotNumber
  extraSpotNumber:
    description: 'Property. The number of extra spots available, i.e. free. Extra    spots
      are those reserved for special purposes and usually require a permit. Permit
      details will be found at parking group level (entity of type `ParkingGroup`).
      This value must aggregate free spots from all groups devoted to special parking
      conditions. Model:''http://schema.org/Number''. Allowed values: A positive integer
      number, including 0. `extraSpotNumber` plus `availableSpotNumber` must be lower
      than or equal to `totalSpotNumber'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/extraSpotNumber
  occupancyDetectionType:
    description: Property. Occupancy detection method(s). Enum:'balancing, manual,
      modelBased, none, singleSpaceDetection'. The following from DATEX II version
      2.3 _OccupancyDetectionTypeEnum_
    range: occupancyDetectionType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/occupancyDetectionType
  parkingMode:
    description: Property. Parking mode(s). Enum:'echelonParking, parallelParking,
      perpendicularParking'
    range: parkingMode_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/parkingMode
  areBordersMarked:
