  totalSpotNumber:
    description: 'Property. Model:''http://schema.org/Number''. The total number of
      spots pertaining to this group. Allowed values: Any positive integer number
      or 0. Normative references: DATEX 2 version 2.3 attribute _parkingNumberOfSpaces_
      of the _ParkingRecord_ class'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/totalSpotNumber
  availableSpotNumber:
    description: Property. Model:'http://schema.org/Number'. The number of spots available
      in this group. It must lower or equal than `totalSpotNumber`
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/availableSpotNumber
  occupancyDetectionType:
    description: 'Property. Model:''http://schema.org/Text''. Allowed values: The
      following from DATEX II version 2.3 _OccupancyDetectionTypeEnum_. Enum:''balancing,
      manual, modelBased, none, singleSpaceDetection''. Or any other application-specific'
    range: occupancyDetectionType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/occupancyDetectionType
  parkingMode:
    description: 'Property. Model:''http://schema.org/Text''. Parking mode(s). Applications
      _SHOULD_ inspect the value of this property at parent''s level if it is not
      defined. Allowed values: Those defined by the DATEX II version 2.3 _ParkingModeEnum_
      enumeration. Enum:''echelonParking, parallelParking, perpendicularParking'''
    range: parkingMode_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/parkingMode
  averageSpotWidth:
    description: Property. Model:'http://schema.org/width'. Units:'meters'. The average
      width of parking spots. Applications _SHOULD_ inspect the value of this property
      at parent's level if it is not defined
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/averageSpotWidth
    unit:
      ucum_code: m
      exact_mappings:
      - ucefact:MTR
      - qudt-unit:M
      has_quantity_kind: qudt-quantkind:ElevationRelativeToNAP
  averageSpotLength:
    description: Property. Model:'http://schema.org/length'. Units:'meters'. The average
