  maximumParkingDuration:
    description: Property. Maximum allowed stay encoded as a ISO8601 duration. When
      non present or equals to the empty string it means indefinite. Applications
      _SHOULD_ inspect the value of this property at parent's level if it is not defined
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/maximumParkingDuration
  chargeType:
    description: Property. Type of charge(s) performed by the parking site. Enum:'additionalIntervalPrice,
      annualPayment, firstIntervalPrice, flat, free, minimum, maximum, monthlyPayment,
      seasonTicket, temporaryFee, temporaryPrice, unknown, other'
    range: chargeType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/chargeType
  requiredPermit:
    description: Property. This attribute captures what permit(s) might be needed
      to park at this site. Semantics is that at least _one of_ these permits is needed
      to park. When a permit is composed by more than one item (and) they can be combined
      with a ','. For instance 'residentPermit,disabledPermit' stays that both, at
      the same time, a resident and a disabled permit are needed to park. If list
      is empty, no permit is needed. Model:'http://schema.org/Text'
    range: requiredPermit_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/requiredPermit
  permitActiveHours:
    description: 'Property. This attribute allows to capture situations when a permit
      is only needed at specific hours or days of week. It is an structured value
      which must contain a subproperty per each required permit, indicating when the
      permit is active. If nothing specified for a permit it will mean that a permit
      is always required. Empty object means always active. The syntax must be conformant
      with schema.org [opening hours specification](https://schema.org/openingHours).
      For instance, a blue zone which is only active on dayweeks will be encoded as
      ''blueZonePermit'': ''Mo,Tu,We,Th,Fr,Sa 09:00-20:00''. Applications _SHOULD_
      inspect the value of this property at parent''s level if it is not defined.
      Model:''https://schema.org/openingHours'''
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/permitActiveHours
  reservationType:
    description: Property. Conditions for reservation. Applications _SHOULD_ inspect
      the value of this property at parent's level if it is not defined. Enum:'mandatory,
      notAvailable, optional, partly'
    range: reservationType_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/reservationType
  areBordersMarked:
    description: Property. Denotes whether parking spots are delimited (with blank
      lines or similar) or not. Applications _SHOULD_ inspect the value of this property
