    slot_uri: https://smartdatamodels.org/dataModel.Parking/category
  refParkingSite:
    description: Relationship. Parking site to which this zone belongs to. A group
      cannot be orphan. A group cannot have subgroups. Reference to an OffStreetParking
      or to an OnStreetParking
    required: true
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
    slot_uri: https://smartdatamodels.org/dataModel.Parking/refParkingSite
  allowedVehicleType:
    description: 'Property. Vehicle type allowed (a parking group only allows one
      vehicle type). Model:''http://schema.org/Text''. Enum:''bicycle, bus, car, caravan,
      motorcycle, motorscooter, truck'' '
    range: allowedVehicleType_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking@5601a5ac5583522dcf376aedb76b193fb0304662
