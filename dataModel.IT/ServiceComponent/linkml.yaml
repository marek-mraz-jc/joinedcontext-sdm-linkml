  spec.source.example: '{"@context": ["https://smartdatamodels.org/context.jsonld"],
    "cliArgs": {"type": "Property", "value": [{"key": "-app-env", "value": "production"},
    {"key": "-db-url", "value": "http://db-svc.default.svc.cluster.local:27017"}]},
    "containerImage": {"type": "Property", "value": "ravaga/webapp-backend:1.5.1"},
    "currentCpuUsage": {"type": "Property", "unit": "Cores", "value": 0.25}, "currentMemoryUsage":
