    "value": [{"key": "APP_ENV", "value": "production"}, {"key": "DB_URL", "value":
    "http://db-svc.default.svc.cluster.local:27017"}]}, "id": "urn:ngsi-ld:Service:WebApp01:Component:Backend",
    "infrastructureElement": {"object": "urn:ngsi-ld:InfrastructureElement:Cloud:00155dc09474",
    "type": "Relationship"}, "infrastructureElementRequirements": {"object": "urn:ngsi-ld:Service:WebApp01:Component:Backend:InfrastructureElementRequirements",
    "type": "Relationship"}, "isJob": {"type": "Property", "value": false}, "networkPorts":
    {"object": ["urn:ngsi-ld:Service:WebApp01:Component:Backend:NetworkPort:01", "urn:ngsi-ld:Service:WebApp01:Component:Backend:NetworkPort:02"],
    "type": "Relationship"}, "overlayNetworkIP": {"type": "Property", "value": "10.0.0.15"},
    "persistentStorage": {"object": ["urn:ngsi-ld:Service:WebApp01:Component:Backend:PersistentStorage:01",
    "urn:ngsi-ld:Service:WebApp01:Component:Backend:PersistentStorage:02"], "type":
