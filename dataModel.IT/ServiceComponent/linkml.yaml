id: https://github.com/smart-data-models/dataModel.IT/ServiceComponent
name: ServiceComponent
title: Smart Data Models - ITinfrastructure / ServiceComponent
description: Component (packaged software, for instance, a container) of a service
  deployed in the Cloud-Edge-IoT continuum, which runs on top of an InfrastructureElement.
