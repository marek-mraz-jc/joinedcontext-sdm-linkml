    "type": "Relationship"}, "etc": {"type": "Property", "value": {"@type": "date-time",
    "@value": "2023-01-01T07:30:00"}}, "ets": {"type": "Property", "value": {"@type":
    "date-time", "@value": "2023-01-01T07:30:00"}}, "id": "urn:mrn:eshuv:portcalls:activity:id:40923",
    "manipulationMeansCode": {"type": "Property", "value": "3"}, "manipulationMeansNumber":
    {"type": "Property", "value": 2}, "maxWeightPerUnit": {"type": "Property", "value":
    23.3}, "measureUnit": {"type": "Property", "value": "TEU"}, "operationRank": {"type":
    "Property", "value": 1}, "operationTypeCode": {"type": "Property", "value": "ZE"},
    "portCallNumber": {"type": "Property", "value": "ESHUV202300123"}, "portCallRef":
    {"object": "urn:mrn:eshuv:portcalls:activity:id:941", "type": "Relationship"},
    "portCode": {"type": "Property", "value": "ESHUV"}, "position": {"type": "Property",
    "value": "Segunda linea granel"}, "productCode": {"type": "Property", "value":
    "Z41"}, "remarks": {"type": "Property", "value": "Delayed 1h"}, "stevedoreRef":
    {"type": "Property", "value": "1234"}, "stopRank": {"type": "Property", "value":
    2}, "terminal": {"type": "Property", "value": "Muelle Sur"}, "type": "Operation",
    "year": {"type": "Property", "value": 2023}}'
