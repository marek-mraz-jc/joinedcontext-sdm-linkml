id: https://github.com/smart-data-models/dataModel.MarineTransport/Operation
name: Operation
title: Smart Data models operation schema
description: This data model is intended to provide information about commercial operations
  made in a stop of a ship during a PortCall (Berth entity). An Operation is defined
  as the activities related to commercial operations that take in place during the
  berth. Each Operation has an entity and some operations can be made in the same
  berth (docked or anchorage), and are distinguished by its sequence number on time
  (operationRank)
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
