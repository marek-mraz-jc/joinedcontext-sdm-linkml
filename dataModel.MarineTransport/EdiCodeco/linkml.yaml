description: A message by which a terminal, depot, etc. confirms that the containers
  specified have been delivered or picked up by the inland carrier (road, rail or
  barge). This message can also be used to report internal terminal container movements
  (excluding loading and discharging the vessel) and to report the change in status
  of container(s) without those containers having physically been moved. See [UN/EDIFACT
  - CODECO](https://service.unece.org/trade/untdid/d19a/trmd/codeco_c.htm)
