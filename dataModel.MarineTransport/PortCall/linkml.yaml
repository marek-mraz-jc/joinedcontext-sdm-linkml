id: https://github.com/smart-data-models/dataModel.MarineTransport/PortCall
name: PortCall
title: Smart Data models PortCall schema
description: This data model is intended to provide information about PortCalls (the
  visit of a ship to a port). It allows to represent the properties of each PortCall,
  including the visiting Vessel (partially loaded and referenced to Vessel entity
  for more info). On each attribute references related to elements of other well known
  standards are included. The data model is intended to provide the basic information
  about a PortCall, that is, the data relative to the arrival and the departure of
  the ship from the port, but not intermediate activities (berthing, operations, ...)
  that are defined in other linked entities (Berth, Operation, ...)
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
