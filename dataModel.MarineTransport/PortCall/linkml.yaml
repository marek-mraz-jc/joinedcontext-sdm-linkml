  status:
    description: 'Property. Model:''https://schema.org/Text''. Current status of the
      PortCall in its lifetime, from request to authorization by port and civil authorities
      and completion. [EMSWe: DE-019-07] [EDIFACT:BGM-1225] [IALA_S211:serviceState:
      timeSequence:VESSEL]. Enum:''ACCEPTED, AUTHORIZED, CANCELLED, COMPLETED, DENIED,
      ESTIMATED, INITIATED, REQUESTED, REJECTED, INVOICING, INVOICED, OPERATIONAL'''
    range: status_options
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.MarineTransport@4ffb0d8d8c29470e169df9d8c329135ec0806f72
    slot_uri: https://uri.etsi.org/ngsi-ld/status
  mrn:
    description: Property. MRN coded identifier. It has to be related to the entity
      in a way that is well-known by different organisms the meaning and the initiator
      of the entity, and all next parties will maintain on its original value. This
      identifier must be an UNIQUE identifier of the PortCall entity assigned by the
      system who created on first the entity. This URN should Conforms MRN & IETF
      specifically RFC 2141, RFC 5234, and RFC 8141. The proposed format is id::='urn:mrn:<OID>:<ONSS>:portcalls:portcall:id:[0-9]+'
      where OID:= Organisation UN/LOCODE, OONSS:=Organization Name of Service, 9999999
      an increasing, unique identifier that the issuer of the PortCall entity will
      identify on his systems (i.e. a SQL row-id), i.e. urn:mrn:eshuv:portcalls:portcall:id:19002.
      See [Unlocode](https://unece.org/trade/cefact/unlocode-code-list-country-and-territory)In
      international standards is also known as [Ship's Visit]
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.MarineTransport@4ffb0d8d8c29470e169df9d8c329135ec0806f72
    slot_uri: https://smartdatamodels.org/dataModel.MarineTransport/mrn
  portCode:
    description: 'Property. Model:''https://schema.org/Text''. United Nations Code
      for Trade and Transport Locations. See [Unlocode](https://unece.org/trade/cefact/unlocode-code-list-country-and-territory)
      [EMSWe: DE-004-04] [EDIFACT:LOC-3227-153] [IALA_S211:portCode] [IMO:IMO0108]'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.MarineTransport@4ffb0d8d8c29470e169df9d8c329135ec0806f72
    slot_uri: https://smartdatamodels.org/dataModel.MarineTransport/portCode
  UNLOCODE:
    description: Property. United Nations Code for Trade and Transport Locations,
      [UN/LOCODE](https://unece.org/trade/cefact/unlocode-code-list-country-and-territory),
      of the port. to be deprecated. Use portCode instead
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.MarineTransport@4ffb0d8d8c29470e169df9d8c329135ec0806f72
    slot_uri: https://smartdatamodels.org/dataModel.MarineTransport/UNLOCODE
  portCallNumber:
    description: 'Property. Model:''https://schema.org/Text''. Port call identifier
      in MRN format. First element of the NSS should be the 5 character UN/Locode
      of the port, later the YEAR and finishing with a sequential number in this port
      [LLLLLYYYY99999] where LLLLL is the UN/LOCODE of the visited port, YYYY is the
      year, and 99999 is a unique sequential number assigned by port authority unique
      on each year (i.e. ESHUV202310323). An abbreviation can be used for UN/LOCODE
      (i.e. H202310323).  The portCallNumber is assigned during the initial steps
      of the visit, but could be null at the beginning. In international standards
      is also known as [Port Call ID], [Visit ID] or [Port Call Coded]. See [Unlocode](https://unece.org/trade/cefact/unlocode-code-list-country-and-territory)
      [EMSWe: DG-004/DG-004-01] [EDIFACT:BGM-1004] [IALA_S211:portCallId] [IMO:IMO108+IMO0153]'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.MarineTransport@4ffb0d8d8c29470e169df9d8c329135ec0806f72
    slot_uri: https://smartdatamodels.org/dataModel.MarineTransport/portCallNumber
  regularLine:
