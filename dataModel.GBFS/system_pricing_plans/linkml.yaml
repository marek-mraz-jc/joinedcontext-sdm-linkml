id: https://github.com/smart-data-models/dataModel.GBFS/system_pricing_plans
name: system_pricing_plans
title: Smart Data Models adaptation of GBFS standard data model system_pricing_plans
description: Describes the pricing schemes of the system. According to the Standard
  GBFS 2.2
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.GBFS
  spec.source.path: system_pricing_plans/schema.json
  spec.source.commit: ce81f1f4250d60ce8908fc371e5eea22b010074e
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smartdatamodels.org/context.jsonld",
    "https://raw.githubusercontent.com/smart-data-models/dataModel.GBFS/master/context.jsonld"],
    "data": {"type": "Property", "value": {"plans": [{"currency": "CAD", "description":
