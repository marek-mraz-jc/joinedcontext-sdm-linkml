id: https://github.com/smart-data-models/dataModel.GBFS/station_information
name: station_information
title: Smart Data Models adaptation of GBFS standard data model station_information
description: Details including system operator, system location, year implemented,
  URL, contact info, time zone. According to the Standard GBFS 2.2
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.GBFS
  spec.source.path: station_information/schema.json
  spec.source.commit: ce81f1f4250d60ce8908fc371e5eea22b010074e
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smartdatamodels.org/context.jsonld",
    "https://raw.githubusercontent.com/smart-data-models/dataModel.GBFS/master/context.jsonld"],
    "data": {"type": "Property", "value": {"stations": [{"capacity": 16, "is_valet_station":
    false, "is_virtual_station": true, "lat": -82.655775, "lon": 45.516445, "name":
    "SE Belmont & SE 10 th", "station_area": {"coordinates": [[[[-122.655775, 45.516445],
    [-122.655705, 45.516445], [-122.655705, 45.516495], [-122.655775, 45.516495],
    [-122.655775, 45.516445]]]], "type": "Multipolygon"}, "station_id": "station12",
    "vehicle_capacity": {"abc123": 8, "def456": 8, "ghi789": 16}}]}}, "id": "urn:ngsi-ld:station_information:id:FNNO:60592292",
    "last_updated": {"type": "Property", "value": 1609866247}, "ttl": {"type": "Property",
    "value": 0}, "type": "station_information", "version": {"type": "Property", "value":
    "3.0"}}'
classes:
  station_information:
    class_uri: https://smartdatamodels.org/dataModel.GBFS/station_information
    description: Details including system operator, system location, year implemented,
      URL, contact info, time zone. According to the Standard GBFS 2.2
    is_a: Entity
    slots:
    - data
    - last_updated
    - ttl
    - version
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
  Data:
    description: Property. Array that contains one object per station as defined below.
    attributes:
      stations:
        required: true
        annotations:
          ngsi_ld_kind: ListProperty
          upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
slots:
  last_updated:
    description: Property. Last time the data in the feed was updated in POSIX time.
    range: integer
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://smartdatamodels.org/dataModel.GBFS/last_updated
  ttl:
    description: Property. Number of seconds before the data in the feed will be updated
      again (0 if the data should always be refreshed).
    range: integer
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://smartdatamodels.org/dataModel.GBFS/ttl
  version:
    description: Property. GBFS version number to which the feed conforms, according
      to the versioning framework (added in v1.1).
    range: version_options
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://smartdatamodels.org/dataModel.GBFS/version
  data:
    description: Property. Array that contains one object per station as defined below.
    range: Data
    required: true
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://uri.etsi.org/ngsi-ld/data
enums:
  version_options:
    name: version_options
    permissible_values:
      2.1-RC2:
        text: 2.1-RC2
      '2.1':
        text: '2.1'
      '2.2':
        text: '2.2'
      '3.0':
        text: '3.0'
