id: https://github.com/smart-data-models/dataModel.GBFS/gbfs
name: gbfs
title: Smart Data Models adaptation of GBFS standard data model gbfs
description: Auto-discovery file that links to all of the other files published by
  the system. According to the Standard GBFS 2.2
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.GBFS
  spec.source.path: gbfs/schema.json
  spec.source.commit: ce81f1f4250d60ce8908fc371e5eea22b010074e
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smartdatamodels.org/context.jsonld",
    "https://raw.githubusercontent.com/smart-data-models/dataModel.GBFS/master/context.jsonld"],
    "data": {"type": "Property", "value": {"feeds": [{"name": "station_information",
    "url": "urn:ngsi-ld:gbfs:url:EPHA:59077032"}, {"name": "system_hours", "url":
    "urn:ngsi-ld:gbfs:url:GDPS:83970346"}]}}, "id": "urn:ngsi-ld:gbfs:id:UKBQ:60920452",
    "last_updated": {"type": "Property", "value": 1450156395}, "ttl": {"type": "Property",
    "value": 566}, "type": "gbfs", "version": {"type": "Property", "value": "2.1"}}'
classes:
  gbfs:
    class_uri: https://smartdatamodels.org/dataModel.GBFS/gbfs
    description: Auto-discovery file that links to all of the other files published
      by the system. According to the Standard GBFS 2.2
    is_a: Entity
    slots:
    - data
    - last_updated
    - ttl
    - version
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
slots:
  last_updated:
    description: Property. Last time the data in the feed was updated in POSIX time.
    range: integer
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://smartdatamodels.org/dataModel.GBFS/last_updated
  ttl:
    description: Property. Number of seconds before the data in the feed will be updated
      again (0 if the data should always be refreshed).
    range: integer
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://smartdatamodels.org/dataModel.GBFS/ttl
  version:
    description: Property. GBFS version number to which the feed conforms, according
      to the versioning framework (added in v1.1).
    range: version_options
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://smartdatamodels.org/dataModel.GBFS/version
  data:
    description: Property. Response data in the form of name:value pairs.
    required: true
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.GBFS@ce81f1f4250d60ce8908fc371e5eea22b010074e
    slot_uri: https://uri.etsi.org/ngsi-ld/data
enums:
  version_options:
    name: version_options
    permissible_values:
      2.1-RC:
        text: 2.1-RC
      2.1-RC2:
        text: 2.1-RC2
      '2.1':
        text: '2.1'
      '2.2':
        text: '2.2'
      3.0-RC:
        text: 3.0-RC
      '3.0':
        text: '3.0'
