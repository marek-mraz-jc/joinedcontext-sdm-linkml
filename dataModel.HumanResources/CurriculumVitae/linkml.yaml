  spec.source.example: '{"aboutMe": {"type": "Property", "value": {"interestingFacts":
    {"type": "Property", "value": [{"fact": {"type": "Property", "value": "Amstrad
    CPC 464"}, "topic": {"type": "Property", "value": "First computer"}}, {"fact":
    {"type": "Property", "value": "Formar parte del equipo que implement\u00f3 la
    **pasarela de pago** online del BBVA Definir, dise\u00f1ar, desarrollar y lanzar
    un **ERP** y un **WMS** completos, desde cero, en s\u00f3lo siete a\u00f1os."}},
    {"fact": {"type": "Property", "value": "Trabajar como **evangelista t\u00e9cnico**
    en una prometedora startup australiana y dejarla cuando estaba a punto de empezar
    a cotizar en el NASDAQ, triplicando las ventas en los territorios a mi cargo para
    contribuir al \u00e9xito colectivo."}}, {"fact": {"type": "Property", "value":
    "Lanzar una campa\u00f1a de **captaci\u00f3n de talento t\u00e9cnico** y conseguir
    atraer a cientos de personas a Madrid para las pruebas de selecci\u00f3n y cobertura
    en TV."}}, {"fact": {"type": "Property", "value": "Fundar una **startup** y cerrar
    una ronda de 330.000\u20ac de inversi\u00f3n de capital-riesgo."}}, {"fact": {"type":
    "Property", "value": "Concebir, desarrollar y lanzar dos productos web que llegaron
    a transaccionar \u20ac1M anuales en **ventas afiliadas**. Vender ambos y gestionar
    todo el proceso legal previo y posterior."}}, {"fact": {"type": "Property", "value":
    "Enviar una **newsletter** sobre tecnolog\u00eda, todos los domingos desde hace
    m\u00e1s de seis a\u00f1os, que m\u00e1s de 15.000 personas quieren recibir."}},
    {"fact": {"type": "Property", "value": "Organizar un evento anual sobre tecnolog\u00eda
    que vende todas sus entradas en unos pocos segundos."}}, {"fact": {"type": "Property",
    "value": "Ser **CEO** de una compa\u00f1\u00eda fundada por otros."}}, {"fact":
    {"type": "Property", "value": "Gestionar la implementaci\u00f3n y cumplimiento
    de la **LOPD** y el **RGPD**."}}, {"fact": {"type": "Property", "value": "Completar
    todos los tr\u00e1mites legales, operativos y fiscales necesarios para abrir la
    filial de una compa\u00f1\u00eda multinacional en Bilbao."}}, {"fact": {"type":
    "Property", "value": "Organizo mi tareas personales con **Passion Planner** (un
    sistema offline) y las profesionales con **Jira** y **Trello**.Tengo tableros
    compartidos con distintos equipos de trabajo. Uso labels y fechas de entrega para
    priorizar mi trabajo.\n\nProgramo HTML/CSS/JavaScript con **Visual Studio Code**.
    Uso algunas extensiones como \u2018GitHistory\u2019, \u2018Paste JSON as Code\u2019,
    o \u2018Bookmarks\u2019, pero tanto el trabajo con **Git** como la construcci\u00f3n
    y la construcci\u00f3n con **Gulp** me gusta hacerlo por l\u00ednea de comandos.\n\nTambi\u00e9n
    uso bastante **Postman**, adem\u00e1s de para hacer pruebas, directamente como
    interfaz para APIs REST que tengo en producci\u00f3n."}, "topic": {"type": "Property",
    "value": "\u00bfCu\u00e1les son tus principales herramientas de trabajo (IDEs,
    editores de texto, clientes de correo, Excel...) y c\u00f3mo las utilizas (plugins,
    configuraciones, trucos)?"}}, {"fact": {"type": "Property", "value": "Para informarme
    de lo m\u00e1s relevante del sector, uso bastante **Twitter** y tengo varias listas
    espec\u00edficas por temas. Tambi\u00e9n leo regularmente [Hacker News](https://news.ycombinator.com/)
    y [Increment](https://increment.com/) y escucho podcasts como[M\u00e1s que Startups](https://masquestartups.com/).\n\nSi
    me atasco con algo de c\u00f3digo suelo googlear bastante, no tengo un sitio de
    referencia al que ir, pero muchas veces acabo -supongo que como todos- en [StackOverflow](https://stackoverflow.com/).\n\nPertenezco
    a un canal de Slack llamado **\u2018Camaradas del Metal\u2019** donde unas pocas
    decenas de personas con bastante experiencia suelen comentar y dar contexto a
    las noticias relacionadas con el emprendimiento tecnol\u00f3gico."}, "topic":
    {"type": "Property", "value": "\u00bfQu\u00e9 recursos online (webs, blogs, apps,
    foros, etc) usas para ayudarte a desempe\u00f1ar tu trabajo?"}}, {"fact": {"type":
    "Property", "value": "Soy muy fan de **Git**, no s\u00f3lo aplicado al c\u00f3digo
    sino pr\u00e1cticamente a cualquier trabajo colaborativo como documentaci\u00f3n
    o contratos.\n\nMe gusta mucho todo el Ecosistema JavaScript que va m\u00e1s all\u00e1
    del navegador (**React**, **Node**) porque me permite trabajar desde el interfaz
    a la base de datos (con MongoDB) con la misma sintaxis.\n\nTambi\u00e9n me interesa
    mucho las posibilidades que puede aportar **Blockchain** para cambiar por completo
    y democratizar el acceso a seg\u00fan qu\u00e9 sectores y nichos, antes vetados
    a unos pocos."}, "topic": {"type": "Property", "value": "\u00bfQu\u00e9 nuevas
    tecnolog\u00edas y/o herramientas te llaman especialmente la atenci\u00f3n y por
    qu\u00e9?"}}, {"fact": {"type": "Property", "value": "Creo que [Microsoft](https://www.microsoft.com/es-es/)
    est\u00e1 dando los pasos correctos para crear todo un sistema de tooling y despliegue
    que puede atraer a los programadores.\n\nTambi\u00e9n me gusta todo lo que est\u00e1
    construyendo [GitLab](https://about.gitlab.com/) y como lo est\u00e1 vendiendo,
    con una gran documentaci\u00f3n y much\u00edsima transparencia."}, "topic": {"type":
    "Property", "value": "\u00bfHay alguna empresa tecnol\u00f3gica que te llame la
    atenci\u00f3n por lo bien que lo est\u00e1 haciendo?"}}, {"fact": {"type": "Property",
    "value": "Leo todo lo que puedo, pero sobre todo intento hacer peque\u00f1os *side
    projects* que me ayuden a automatizar tareas repetitivas o especialmente pesadas."},
    "topic": {"type": "Property", "value": "\u00bfC\u00f3mo intentas mantener actualizados
    tus conocimientos y habilidades profesionales?"}}, {"fact": {"type": "Property",
    "value": "Tengo una lista de correo llamada la [Bonilista](https://www.bonilista.com/)
    en la que escribo un art\u00edculo semanal sobre mis experiencias o temas que
    me interesan. Tambi\u00e9n organizo \u2014junto a m\u00e1s voluntarios\u2014 un
    evento anual sobre construcci\u00f3n de productos/proyectos digitales llamado
    [Tarugoconf](https://www.tarugoconf.com/) y suelo participar en distintas conferencias
    y grupos de usuarios."}, "topic": {"type": "Property", "value": "\u00bfSueles
    compartir tu conocimiento por alg\u00fan canal (posts, foros, contribuci\u00f3n
    a open source, charlas p\u00fablicas etc)?"}}]}, "profile": {"type": "Property",
    "value": {"avatar": {"type": "Property", "value": {"alt": {"type": "Property",
    "value": "foto de David Bonilla"}, "link": {"type": "Property", "value": "https://pbs.twimg.com/profile_images/1387692137664458758/-Z8bTzmY_400x400.jpg"}}},
    "birthday": {"type": "Property", "value": {"@type": "date-time", "@value": "1977-07-26"}},
    "description": {"type": "Property", "value": "Llevo casi dos d\u00e9cadas desarrollando
    software, ocupando puestos a lo largo de toda la cadena de valor -programacion,
    dise\u00f1o de producto, marketing, ventas y gesti\u00f3n de equipos, departamentos
    y empresas- pero creo que el rol donde se cruzan mi vocaci\u00f3n, mis habilidades
    y las necesidades de la mayor\u00eda de las empresas es en la gesti\u00f3n de
    equipos y proyectos de construcci\u00f3n de activos digitales.\n\nMe apasiona
    contribuir en todo el ciclo de vida de un producto o servicio inform\u00e1tico,
    desde la definici\u00f3n hasta el mantenimiento o soporte a clientes, y tambi\u00e9n
    involucrarme en la comercializaci\u00f3n del mismo.\n\nMe gusta trabajar con gente
    y para la gente. Como responsable de equipos, mi principal prioridad siempre es
    eliminar cualquier problema que les impida alcanzar todo su potencial. Tambi\u00e9n
    procuro devolver a la Comunidad inform\u00e1tica parte del valor y el conocimiento
    que me han aportado a lo largo de mi carrera profesional, dando charlas o colaborando
    con grupos de usuarios y conferencias t\u00e9cnicas; y, a veces, organiz\u00e1ndolos.\n"},
