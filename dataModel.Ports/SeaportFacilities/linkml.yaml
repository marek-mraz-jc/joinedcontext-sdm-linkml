      length allowed to access the harbor. The unit code (text) is given using the
      [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . For instance, **MTR** represents Meter
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/maxLength
  maxWidth:
    description: Property. Model:'http://schema.org/Number'. Units:'MTR'. A Maximum
      width allowed to access the harbor. The unit code (text) is given using the
      [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . For instance, **MTR** represents Meter
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/maxWidth
  maxDraft:
    description: Property. Model:'http://schema.org/Number'. Units:'MTR'. A Maximum
      draft allowed to access the harbor. The unit code (text) is given using the
      [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . For instance, **MTR** represents Meter
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/maxDraft
  portServicesProvided:
    description: 'Property. Model:''http://schema.org/Text''. Description of the services
      provided directly by the harbor. A combination of : harborOffice, weather, customsServices,
      porters, boatRingRental, mooringAssistance, handlingAssistance, publicWifi,
      privateWifi, other'
    range: portServicesProvided_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/portServicesProvided
  boatSupplyingServices:
    description: Property. Model:'http://schema.org/DateTime'. Description of the
      complementary supplying services for the boat offered by professionals working
      on or near the harbor. A combination of guarding, fuelStation, fuelTankerTruck
      , drinkingWaterTankerTruck, provisioning, dryFairing, waterFairing, repair,
      expertise, gangways, liftingCranes, towing, wasteWaterPumping, boatConveying,
      boatTransfer, other
    range: boatSupplyingServices_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/boatSupplyingServices
  facilities:
    description: 'Property. Model:''http://schema.org/Text''. Description of the proposed
      facilities on the harbor. A combination of : toilets, showers, laundry, telephone,
      dustbins, dumpsters, container, selectiveSortingWaste, electricTerminal, waterTerminal,
      indoorRoomReservation, wifi, other'
    range: facilities_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/facilities
  nearbyServices:
    description: Property. Model:'http://schema.org/DateTime'. Description of the
      additional services on the geographical area on or near the harbor. A combination
      of :touristOffice, fittingsStores, travelAgency, exchangeOffice, medicalOffice,
      pharmacy, groceryStores, restaurants, presses, bar, shops, seaExcursions, cityTour,
      touristicExcursions, others
    range: nearbyServices_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/nearbyServices
  rentalSaleServices:
    description: 'Property. Model:''http://schema.org/DateTime''. ADescription of
      services provided by professional sales or rental agencies on the geographical
      area on or near the harbor. A combination of : boatRental, boatSale, jetSkiRental,
      jetSkiSale, carRental, luxuryCarRental, vanRental, bikeRental, scooterRental,
      Caddie, palletTransport, other'
    range: rentalSaleServices_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/rentalSaleServices
  transportServices:
    description: 'Property. Model:''http://schema.org/DateTime''. Description of the
      services provided for dedicated transport and shuttle services. A combination
      of : parking, shuttlesToAirport, shuttlesToRailway, internalShuttles, taxis,
      heliport, other'
    range: transportServices_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/transportServices
  routeType:
    description: Property. Model:'http://schema.org/Text'. List of the different types
      of urban transport Mode (Metro, Bus, Tram, ...) from the urban transport Mode
      GFTS standard [STOP](https://developers.google.com/transit/gtfs/reference/#stopstxt).
      A combination of values composed only of the attribute 'description' tram(0),
      metro(1), train(2), bus(3), ferry(4), cableTram(5), cableCar(6), funicular(7),
      trolleybus(11), monorail(12)
    range: routeType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/routeType
  electricTransport:
    description: 'Property. Model:''http://schema.org/Text''.  List of the different
      types of electric transport proposed by the city. A combination of electricCar,
      electricBycicle, electricMotorBike, electricScooter '
    range: electricTransport_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/electricTransport
  paymentAccepted:
    description: 'Property. Model:''http://schema.org/DateTime''. Accepted payment.
      A combination of a list of active codes defined in the model : Cash, CreditCard,
      CryptoCurrency, other'
    range: paymentAccepted_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/paymentAccepted
  currencyAccepted:
    description: Property. Model:'https://schema.org/currenciesAccepted, '.Currency
      accepted for payment. A combination of a list of active codes defined in the
      model [Norme ISO 4217](http://en.wikipedia.org/wiki/ISO_4217), [Crypto Currencies](https://en.wikipedia.org/wiki/List_of_cryptocurrencies)
      , [Exchange Trading System](https://en.wikipedia.org/wiki/Local_exchange_trading_system
    range: currencyAccepted_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Ports@fce7cfbcb516984c04041312e4d7fb94bd11fa2c
    slot_uri: https://smartdatamodels.org/dataModel.Ports/currencyAccepted
