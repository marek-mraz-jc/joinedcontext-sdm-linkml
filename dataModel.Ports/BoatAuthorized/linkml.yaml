name: BoatAuthorized
title: Boat Authorized schema
description: The data model is intended to provide information on the boats authorized
  to operate within the port according to the ISO 8666 standard for Boat Category.
  This repository is created by type of category of boat (pleasure craft, trade, passengers,
  ...). For each type of category, a list of optional subtypes of category can be
  associated.
