    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/deviceState
  motorDirection:
    description: Property. Model:'https://schema.org/Text'. Enum:'-1','1'. Defines
      the physical mounting orientation of the motor, which determines the polarity
      of the rotation (Eastward-facing = 1; Westward-facing = -1)
    range: motorDirection_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/motorDirection
  boardDirection:
    description: Property. Model:'https://schema.org/Text'. Enum:'-1','1'. Specifies
      the physical orientation of the control board based on the position of the emergency
      stop button (Eastward-facing = 1; Westward-facing = -1)
    range: boardDirection_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/boardDirection
  targetAngle:
    description: Property. Model:'https://schema.org/Number'. Units:'Degree Angle
      (DD)'. The target angular setpoint for the panel's orientation. A value of 0
      indicates the panel is horizontal (facing directly upward). Minimum values represent
      an Eastward orientation, while maximum values represent a Westward orientation
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/targetAngle
  movementInterval:
    description: 'Property. Model:''https://schema.org/Text''. Enum:''5'',''10'',''15''.
      Defines the time frequency at which the panel adjusts its position. The value
      must be one of the predefined intervals: 5, 10, or 15 minutes'
    range: movementInterval_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/movementInterval
  panelLength:
    description: Property. Model:'https://schema.org/Number'. Units:'meter (MTR)'.
      The dimension of the panel measured along the axis perpendicular to the axis
      of rotation. This value is critical for calculating the shadow cast by the panel
      and determining the appropriate backtracking movement
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/panelLength
  maxPowerThreshold:
    description: Property. Model:'https://schema.org/Number'. Units:'Watt (WTT)'.
      The safety limit for power consumption during motor operation. If the electrical
      power exceeds this threshold, the panel movement is immediately interrupted
      to prevent mechanical damage or motor overload
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/maxPowerThreshold
  maxAngleLimit:
    description: Property. Model:'https://schema.org/Number'. Units:'Degree Angle
      (DD)'. The maximum allowable angular position towards the West. This software
      limit acts as a hard ceiling; the panel will not rotate beyond this value even
      if the calculated target angle is greater
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/maxAngleLimit
  minAngleLimit:
    description: Property. Model:'https://schema.org/Number'. Units:'Degree Angle
      (DD)'. The minimum allowable angular position towards the East. This parameter
      defines a mandatory operational boundary; the panel will not rotate further
      East than this value, regardless of the requested target position
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/minAngleLimit
  snowSafetyAngle:
    description: Property. Model:'https://schema.org/Number'. Units:'Degree Angle
      (DD)'. The specific angular position the panel must adopt during a snow event.
      This angle is designed to facilitate snow shedding and prevent excessive structural
      loading on the tracker
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/snowSafetyAngle
  windSafetyAngle:
    description: Property. Model:'https://schema.org/Number'. Units:'Degree Angle
      (DD)'. The safety setpoint angle the panel assumes when wind speeds exceed the
      operational threshold. This position minimize the sail effect and reduce structural
      stress caused by wind uplift or pressure
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/windSafetyAngle
  restingAngle:
    description: Property. Model:'https://schema.org/Number'. Units:'Degree Angle
      (DD)'. The specific angular position the panel assumes during the night or when
      the sun is below the horizon. This position is used to park the tracker until
      the next sunrise
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/restingAngle
  operatingMode:
    description: Property. Model:'https://schema.org/Text'. Enum:'automatic','manual','safesnow','safesnowsensor','safewind','safewindsensor','maintenance'.
      Defines the current functional state of the panel. This mode dictates whether
      the tracker follows the solar algorithm or responds to external overrides/safety
      events
    range: operatingMode_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/operatingMode
  ipAddress:
    description: Property. Model:'https://schema.org/Text'. List of IP address of
      the device. It can be a comma separated list of values if the device has more
      than one IP address
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.GreenEnergy@c6d53698a521b415318a5b67905a91c6e70c307e
    slot_uri: https://smartdatamodels.org/dataModel.GreenEnergy/ipAddress
