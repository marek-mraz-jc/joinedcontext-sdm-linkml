id: https://github.com/smart-data-models/dataModel.S4SYST/System
name: System
title: Smart data models - System schema
description: The class of systems, i.e., systems virtually isolated from the environment,
  whose behaviour and interactions with the environment are modeled. Systems can be
  connected to other systems. Connected systems interact in some ways. Systems can
  also have subsystems. Properties of subsystems somehow contribute to the properties
  of the supersystem.
