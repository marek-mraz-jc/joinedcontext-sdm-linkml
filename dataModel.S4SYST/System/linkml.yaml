    {"@type": "date-time", "@value": "2023-01-26T03:10:57Z"}}, "description": {"type":
    "Property", "value": "System of limited System types"}, "id": "urn:ngsi-ld:System:dc9a83cc-5749-427b-be1b-409748987f3d",
    "name": {"type": "Property", "value": "System"}, "purpose": {"type": "Property",
