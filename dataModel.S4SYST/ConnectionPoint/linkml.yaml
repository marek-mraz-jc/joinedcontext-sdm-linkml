id: https://github.com/smart-data-models/dataModel.S4SYST/ConnectionPoint
name: ConnectionPoint
title: Smart data models - ConnectionPoint schema
description: The class of connection points of systems, at which they may be connected
  to other systems. This class qualifies properties s4syst:connectsSystem and s4syst:connectedThrough.
  A connection point belongs to exactly one system. Any system connected through a
  connection is connected at one of its connection points to the connection. The system
  of a connection point that is connected through a connection is itself connected
  through the connection.
