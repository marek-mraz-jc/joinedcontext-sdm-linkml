  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
slots:
  dateCreated:
    description: Property. Entity creation timestamp. This will usually be allocated
      by the storage platform
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dateCreated
  dateModified:
    description: Property. Timestamp of the last modification of the entity. This
      will usually be allocated by the storage platform
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dateModified
  source:
    description: Property. A sequence of characters giving the original source of
      the entity data as a URL. Recommended to be the fully qualified domain name
      of the source provider, or the URL to the source object
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/source
  name:
    description: Property. The name of this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/name
  alternateName:
    description: Property. An alternative name for this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/alternateName
  description:
    description: Property. A description of this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: http://purl.org/dc/terms/description
  dataProvider:
    description: Property. A sequence of characters identifying the provider of the
      harmonised data entity
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataProvider
  owner:
    description: Property. A List containing a JSON encoded sequence of characters
      referencing the unique Ids of the owner(s)
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/owner
  seeAlso:
    description: Property. list of uri pointing to additional resources about the
      item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/seeAlso
  address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    range: Address
    required: true
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/areaServed
  category:
    description: Property. Category of the building. Enum:'apartments, bakehouse,
      barn, bridge, bungalow, bunker, cathedral, cabin, carport, chapel, church, civic,
      commercial, conservatory, construction, cowshed, detached, digester, dormitory,
      farm, farm_auxiliary, garage, garages, garbage_shed, grandstand, greenhouse,
      hangar, hospital, hotel, house, houseboat, hut, industrial, kindergarten, kiosk,
      mosque, office, parking, pavilion, public, residential, retail, riding_hall,
      roof, ruins, school, service, shed, shrine, stable, stadium, static_caravan,
      sty, synagogue, temple, terrace, train_station, transformer_tower, transportation,
      university, warehouse, water_tower'
    range: category_options
    required: true
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/category
  containedInPlace:
    description: GeoProperty. Geojson reference to the item. It can be Point, LineString,
      Polygon, MultiPoint, MultiLineString or MultiPolygon
    annotations:
      ngsi_ld_kind: GeoProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/containedInPlace
  occupier:
    description: Relationship. Person or entity using the building. Model:'https://schema.org/URL'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/occupier
  floorsAboveGround:
    description: Property. Floors above the ground level. Model:'https://schema.org/Number'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/floorsAboveGround
  floorsBelowGround:
    description: Property. Floors below the ground level. Model:'https://schema.org/Number'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/floorsBelowGround
  mapUrl:
    description: Relationship. Reference to the map containing the building
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/mapUrl
  openingHours:
    description: Property. Model:'https://schema.org/openingHours'. Opening hours
      of this building
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/openingHours
  collapseRisk:
    description: Property. Model:'https://schema.org/Number'. Probability of total
      collapse of the building
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/collapseRisk
  peopleCapacity:
    description: Property. Model:'https://schema.org/Number'. Allowed people present
      at the building
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/peopleCapacity
  peopleOccupancy:
    description: Property. Model:'https://schema.org/Number'. People present at the
