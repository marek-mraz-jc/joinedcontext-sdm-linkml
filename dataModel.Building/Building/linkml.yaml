    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Building@92aca4467cd5b9196c390335c9bb742236c278b2
    slot_uri: https://smartdatamodels.org/dataModel.Building/peopleOccupancy
