id: https://github.com/smart-data-models/dataModel.Building/Building
name: Building
title: Smart Data Models- Building schema
description: Information on a given Building
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
