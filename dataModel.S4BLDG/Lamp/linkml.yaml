  colorAppearance:
    description: Property. In both the DIN and CIE standards, artificial light sources
      are classified in terms of their color appearance. To the human eye they all
      appear to be white the difference can only be detected by direct comparison.
      Visual performance is not directly affected by differences in color appearance
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/colorAppearance
  colorRenderingIndex:
    description: Property. The CRI indicates how well a light source renders eight
      standard colors compared to perfect reference lamp with the same color temperature.
      The CRI scale ranges from 1 to 100, with 100 representing perfect rendering
      properties
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/colorRenderingIndex
  colorTemperature:
    description: Property. The color temperature of any source of radiation is defined
      as the temperature (in Kelvin) of a black-body or Planckian radiator whose radiation
      has the same chromaticity as the source of radiation. Often the values are only
      approximate color temperatures as the black-body radiator cannot emit radiation
      of every chromaticity value. The color temperatures of the commonest artificial
      light sources range from less than 3000K (warm white) to 4000K (intermediate)
      and over 5000K (daylight). Usually measured in degrees Kelvin (K)
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/colorTemperature
  contributedLuminousFlux:
    description: Property. Luminous flux is a photometric measure of radiant flux,
      i.e. the volume of light emitted from a light source. Luminous flux is measured
      either for the interior as a whole or for a part of the interior (partial luminous
      flux for a solid angle). All other photometric parameters are derivatives of
      luminous flux. Luminous flux is measured in lumens (lm). The luminous flux is
      given as a nominal value for each lamp. Usually measured in Lumen (lm, Candela
      Steradian)
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/contributedLuminousFlux
  lampBallastType:
    description: Property. The type of ballast used to stabilise gas discharge by
      limiting the current during operation and to deliver the necessary striking
      voltage for starting. Ballasts are needed to operate Discharge Lamps such as
      Fluorescent, Compact Fluorescent, High-pressure Mercury, Metal Halide and High-pressure
      Sodium Lamps. Magnetic ballasts are chokes which limit the current passing through
      a lamp connected in series on the principle of self-induction. The resultant
      current and power are decisive for the efficient operation of the lamp. A specially
      designed ballast is required for every type of lamp to comply with lamp rating
      in terms of Luminous Flux, Color Appearance and service life. The two types
      of magnetic ballasts for fluorescent lamps are KVG Conventional (EC-A series)
      and VVG Low-loss ballasts (EC-B series). Low-loss ballasts have a higher efficiency,
      which means reduced ballast losses and a lower thermal load. Electronic ballasts
      are used to run fluorescent lamps at high frequencies (approx. 35 - 40 kHz)
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/lampBallastType
  lampCompensationType:
    description: Property. Identifies the form of compensation used for power factor
      correction and radio suppression
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/lampCompensationType
