  spectrumMax:
    description: Property. The spectrum of radiation describes its composition with
      regard to wavelength. Light, for example, as the portion of electromagnetic
      radiation that is visible to the human eye, is radiation with wavelengths in
      the range of approx. 380 to 780 nm (1 nm = 10 m). The corresponding range of
      colours varies from violet to indigo, blue, green, yellow, orange, and red.
      These colours form a continuous spectrum, in which the various spectral sectors
      merge into each other
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.S4BLDG@06b177d32ce7f9e1e02b2fcaeeae22b8636f2987
    slot_uri: https://smartdatamodels.org/dataModel.S4BLDG/spectrumMax
