name: AudioVisualAppliance
title: Smart data models - AudioVisualAppliance schema
description: An audio-visual appliance is a device that displays, captures, transmits,
  or receives audio or video.  Audio-visual appliances may be fixed in place or may
  be able to be moved from one space to another. They may require an electrical supply
  that may be supplied either by an electrical circuit or provided from a local battery
  source. Audio-visual appliances may be connected to data circuits including specialist
  circuits for audio visual purposes only.
