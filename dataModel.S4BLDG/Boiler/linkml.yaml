name: Boiler
title: Smart data models - Boiler schema
description: A boiler is a closed, pressure-rated vessel in which water or other fluid
  is heated using an energy source such as natural gas, heating oil, or electricity.
  The fluid in the vessel is then circulated out of the boiler for use in various
  processes or heating applications.
