      in decimal degrees, where 0 <= `heading` < 360, counting clockwise relative
      to the true north. If the vehicle is stationary (i.e. the value of the `speed`
      attribute is `0`), then the value of the heading attribute must be equal to
      `-1`. Model:'https://schema.org/Number'. Units:'Degree'
