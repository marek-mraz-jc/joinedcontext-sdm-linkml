  stationType:
    description: Property. Type of transport station. Enum:'aerialLift, bus, cableTram,
      ferry, funicular, monorail, rail, subway, trolleybus, tram'
    range: stationType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/stationType
  locationType:
    description: Property. Link to the GTFS standard repository describing the different
      location [Location Type]. 0 Stop or platform (place where users get on or off
      in a public transport vehicle). 1 Station (area or physical structure comprising
      one or more platforms). 2 Entrance or Exit (place where users can enter / exit
      a station from the street). 3 Generic intersection (location in a station that
      doesn't correspond to any other `location_type` value). 4 Boarding area of a
      specific location on a platform where users can get on / off in a vehicle
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/locationType
  parentStation:
    description: Relationship. Link to the GTFS standard repository describing the
      different link between Station and Platform [Parent STATION]. Case '1' location_type
      = 0 (Stop / platform ), the parent_station field contains the ID of a station.
      Case '2' location_type = 1  (Station), this field must be empty. Case '3' location_type
      = 2 (Input / output) or location_type = 3 (generic intersection), the parent_station
      field contains the ID of a station location_type = 1. Case '4' location_type
      = 4 (boarding area), the parent_station field contains the ID of a platform
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/parentStation
  levelId:
    description: Property. Floor on which the location is located. Numerical index
      associated with the floor. Indicates the relative position of this stage in
      relation to the others. The index 0 indicates the ground floor. The floors above
      ground level are indicated by positive indices, and the underground stages by
      negative indices
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/levelId
  platformCode:
    description: Property. Platform identifier for a platform type stop `location_type`
      = 0 when the stop is in a station
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/platformCode
  zoneId:
    description: Property. Pricing zone of the station
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/zoneId
  wheelChairAccessible:
    description: Property. Access possible for Person with Reduced Mobility. For stops
      without parents 0 no information is available regarding the accessibility of
      the stop. 1 some vehicles at this stop can board a PMR user. 2 PRM user cannot
      board  at this stop. For a stop that is part of a station 0 the stop inherits
      the wheelchair_boarding behavior of the parent station, if it is filled in.
      1 lanes provide wheelchair access to the stop / platform  from outside the station.
      2 no lane provides wheelchair access to the stop / platform from outside the
      station. For station inputs / outputs 0 the station entry inherits the wheelchair_boarding
      behavior of the main station, if specified. 1 the station entrance is wheelchair
      accessible. 2 no wheelchair accessible route connects the station entrance to
      the stops / platforms
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/wheelChairAccessible
  openingHoursSpecification:
    description: Property. A structured value providing information about the opening
      hours of a place or a certain service inside a place. Model:'https://schema.org/openingHoursSpecification'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/openingHoursSpecification
  contractingAuthority:
