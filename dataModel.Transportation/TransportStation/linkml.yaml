    slot_uri: https://smartdatamodels.org/dataModel.Transportation/inventory
  stationConnected:
    description: 'Property. Connections possible from this station. A structured value
      from 0 to N occurrences where each items is a string in the format `stationType`
      : [List of Lines connected, separated by a comma]. Enum:''aerialLift, bus, cableTram,
