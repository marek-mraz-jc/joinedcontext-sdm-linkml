classes:
  TransportStation:
    class_uri: https://smartdatamodels.org/dataModel.Transportation/TransportStation
    description: The data model is a general description of urban stations (Metro,
      Bus, Tram, Heliport, ...) according to the GFTS standard https://developers.google.com/transit/gtfs/reference/#stopstxt,
      as well the detailed description of these (means of access, platform, assistance,
      ...).
    is_a: Entity
    slots:
    - address
    - alternateName
    - architect
    - areaServed
    - commissioningDate
    - constructionDate
    - contactPoint
    - contractingAuthority
    - contractingCompany
    - currencyAccepted
    - dataProvider
    - dateCreated
    - dateLastReported
    - dateModified
    - description
    - dimension
    - featuredArtist
    - installationMode
    - inventory
    - levelId
    - locationType
    - name
    - openingHoursSpecification
    - owner
    - parentStation
    - paymentAccepted
    - platformCode
    - refPointOfInterest
    - seeAlso
    - services
    - source
    - stationConnected
    - stationType
    - webSite
    - wheelChairAccessible
    - zoneId
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
  ContactPoint:
    description: Property. Model:'https://schema.org/ContactPoint'. The details to
      contact with the item
    attributes:
      contactType:
        description: Property. Contact type of this item
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      email:
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      telephone:
        description: Property. Telephone of this contact
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      name:
        description: Property. The name of this item
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      url:
        description: Property. URL which provides a description or further information
          about this item
        range: uriorcurie
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      areaServed:
        description: Property. The geographic area where a service or offered item
          is provided. Supersedes serviceArea
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      availableLanguage:
        description: Property. Model:'http://schema.org/availableLanguage'. A language
          someone may use with or at the item, service or place. Please use one of
          the language codes from the IETF BCP 47 standard. It is implemented the
          Text option but it could be also Language
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      contactOption:
        description: Property. Model:'http://schema.org/contactOption'. An option
          available on this contact point (e.g. a toll-free number or support for
          hearing-impaired callers)
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      faxNumber:
        description: Property. Model:'https://schema.org/Text'. The fax number of
          the item
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      productSupported:
        description: Property. Model:'https://schema.org/Text'. The product or service
          this support contact point is related to (such as product support for a
          particular product line). This can be a specific product or product line
          (e.g. 'iPhone') or a general category of products or services (e.g. 'smartphones')
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      availabilityRestriction:
        description: Relationship. Model:'https://schema.org/hoursAvailable'. This
          property links a contact point to information about when the contact point
          is not available. The details are provided using the Opening Hours Specification
          class
        annotations:
          ngsi_ld_kind: Relationship
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
  Dimension:
    description: Property. Global dimension. The format is structured by a sub-property
      of 3 items. The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **MTR** represents Meters. Units:'meters'
    attributes:
      height:
        description: Property. Height of the Station
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      width:
        description: Property. Width of the Station
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      depth:
        description: Property. Depth of the Station
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
  Inventory:
    description: Property. General data mapping only for `locationType` = 0, 1, 3,
      4. The format is structured by a sub-property of 4 items
    attributes:
      nbOfIOPoint:
        description: Property. Number of input output points
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      nbOfLane:
        description: Property. Number of Lane in the station
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      nbOfPlatform:
        description: Property. Number of platform
        range: float
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      PlatformType:
        description: Property. Type of platforms available
        annotations:
          ngsi_ld_kind: ListProperty
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
  Services:
    description: Property. Object containing information bout the services included
    attributes:
      purchaseDevice:
        description: Property. Attribute to indicate if there are machines for ticket
          purchase
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      interactiveDevice:
        description: Property. Attribute to indicate if there are interactive devices
          (i.e. kiosks) for users
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      timetableDevice:
        description: Property. Attribute to indicate if there are boards or devices
          showing the time table of the station
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      voiceDevice:
        description: 'Property. Attribute to indicate if there are PA systems or other
          voice devices '
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      informationBoardDevice:
        description: Property. Attribute to indicate if there are information boards
          for users
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      messageDevice:
        description: Property. Attribute to indicate if there are devices for sharing
          messages with the users
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      shelters:
        description: Property. Attribute to indicate if there are shelter for users
          (i.e. rain)
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      restBench:
        description: Property. Attribute to indicate if the station has benches to
          sit on for resting
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      emergencyPhone:
        description: Property. Attribute to indicate if there are emergency phones
          available
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      defibrillator:
        description: Property. Attribute to indicate if there are defibrillators
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
      wheelChairAccessible:
        description: Property. Attribute to indicate if there are facilities for wheelchair
          users
        range: boolean
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
