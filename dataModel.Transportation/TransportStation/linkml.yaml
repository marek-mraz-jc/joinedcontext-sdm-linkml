id: https://github.com/smart-data-models/dataModel.Transportation/TransportStation
name: TransportStation
title: Station schema data model
description: The data model is a general description of urban stations (Metro, Bus,
  Tram, Heliport, ...) according to the GFTS standard https://developers.google.com/transit/gtfs/reference/#stopstxt,
  as well the detailed description of these (means of access, platform, assistance,
  ...).
