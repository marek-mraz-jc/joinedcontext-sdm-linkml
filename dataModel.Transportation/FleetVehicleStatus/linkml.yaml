name: FleetVehicleStatus
title: Smart Data models - Fleet Vehicle Status schema
description: This entity contains a harmonised description of the status of a generic
  fleet vehicle. This entity is primarily associated with the vertical segment of
  the transport and logistics but may also be used many other related IoT applications.
