      <lane_maximumAllowedWeight>. <lane_direction> is a text string with the following
      allowed values: `forward`. The lane is currently used in the `forwards` direction.
      `backward`. The lane is currently used in the `backwards` direction. The only
      mandatory parameter is `lane_direction`. If not specified, the rest of parameters
      can be assumed to be equal to those specified at entity level'
    range: laneUsage_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/laneUsage
  category:
    description: 'Property. Allows to convey extra characteristics of a road segment.
      Model:''https://schema.org/Text''. Enum:''oneway, toll, link''.  `oneway`: Flags
      whether the road segment can only be used in one direction. If not present it
      means road segment can be used in both directions (forwards and backwards).
      See also [http://wiki.openstreetmap.org/wiki/Key:oneway](http://wiki.openstreetmap.org/wiki/Key:oneway).
      `toll` : Flags whether the road segment is under toll fees. `link` : Flags whether
      this road segment is an auxiliary link segment for exiting or entering a road.
      See [https://wiki.openstreetmap.org/wiki/Tag:highway%3Dmotorway_link](https://wiki.openstreetmap.org/wiki/Tag:highway%3Dmotorway_link).
