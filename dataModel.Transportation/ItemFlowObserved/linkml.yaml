    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/laneDirection
  reverseLane:
    description: Property. Flags whether traffic in the lane was reversed during the
      observation period. The absence of this attribute means no lane reversion
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/reverseLane
