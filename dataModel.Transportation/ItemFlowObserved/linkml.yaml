    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/intensity
  occupancy:
    description: Property. Fraction of the observation time where a item has been
      occupying the observed lane
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/occupancy
  congested:
    description: Property. Flags whether there was a crowd congestion during the observation
      period in the referred walkway. The absence of this attribute means no crowd
