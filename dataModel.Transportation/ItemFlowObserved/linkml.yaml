    slot_uri: https://smartdatamodels.org/dataModel.Transportation/congested
  averageSpeed:
    description: Property. Average speed of detected items transiting during the observation
      period. The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . Depending the type of Flow, the value can be **KMH** f(vehicule, pedestrian,
      etc.) represents Kilometer per hour (km/h) or **KNT** represents Knot (Boat)
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/averageSpeed
  averageLength:
    description: Property. Average length of detected items transiting during the
      observation period. The unit code (text) is given using the [UN/CEFACT Common
      Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . For instance, **MTR** represents Meter
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/averageLength
  averageHeadwayTime:
    description: Property. Average headway time. Head away time is the time elapsed
      between two consecutive items. The unit code (text) is given using the [UN/CEFACT
      Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **SEC** represents Second
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/averageHeadwayTime
  averageGapDistance:
    description: Property. Average gap distance between consecutive 2 detected items.
      The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **MTR** represents Meter
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/averageGapDistance
  minSpeed:
    description: Property. Minimum speed detected during the observation period. The
      unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . Depending the type of Flow, the value can be **KMH** (vehicule, pedestrian,
      ...) represents Kilometer per hour (km/h) or **KNT** represents Knot (Boat)
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/minSpeed
  maxSpeed:
    description: Property. Maximum speed detected during the observation period. The
      unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      . Depending the type of Flow, the value can be **KMH** (vehicule, pedestrian,
      ...) represents Kilometer per hour (km/h) or **KNT** represents Knot (Boat)
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/maxSpeed
