    "address": {"type": "Property", "value": {"addressCountry": "FR", "addressLocality":
    "Nice", "streetAddress": "Port Lympia"}}, "areaServed": {"type": "Property", "value":
    "Nice Harbor"}, "averageGapDistance": {"type": "Property", "unitCode": "MTR",
    "value": 35.28}, "averageHeadwayTime": {"type": "Property", "unitCode": "SEC",
    "value": 156}, "averageLength": {"type": "Property", "unitCode": "MTR", "value":
    7.44}, "averageSpeed": {"type": "Property", "unitCode": "KNT", "value": 2.7},
    "congested": {"type": "Property", "value": false}, "dateObserved": {"type": "Property",
    "value": {"@type": "DateTime", "@value": "2020-03-20T16:30:00Z"}}, "dateObservedFrom":
    {"type": "Property", "value": {"@type": "DateTime", "@value": "2020-03-20T16:30:00Z"}},
    "dateObservedTo": {"type": "Property", "value": {"@type": "DateTime", "@value":
    "2020-03-20T22:30:00Z"}}, "description": {"type": "Property", "value": "Boat Flow
    Observed from Nice Harbor."}, "id": "FlowObserved:BFO-NCE-MNCA-SP-001", "intensity":
    {"type": "Property", "value": 12}, "itemSubType": {"type": "Property", "value":
    "monoHull"}, "itemType": {"type": "Property", "value": "yatching"}, "laneDirection":
    {"type": "Property", "value": "outbound"}, "laneId": {"type": "Property", "value":
    1}, "location": {"type": "GeoProperty", "value": {"coordinates": [7.196545, 43.664809],
    "type": "Point"}}, "maxSpeed": {"type": "Property", "unitCode": "KNT", "value":
    3.8}, "minSpeed": {"type": "Property", "unitCode": "KNT", "value": 2.6}, "name":
    {"type": "Property", "value": "BFO-NCE-MNCA-SP-001"}, "occupancy": {"type": "Property",
    "value": 0.1562}, "refDevice": {"object": "urn:ngsi-ld:Device:BFO-NCE-MNCA-SP-001-Dev-02",
    "type": "Relationship"}, "reverseLane": {"type": "Property", "value": false},
    "type": "ItemFlowObserved"}'
