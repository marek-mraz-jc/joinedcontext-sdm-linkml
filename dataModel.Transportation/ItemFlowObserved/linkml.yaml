id: https://github.com/smart-data-models/dataModel.Transportation/ItemFlowObserved
name: ItemFlowObserved
title: Flow Observed schema
description: The data model intended to measure an observation linked to the movement
  of an item at a certain location and over a given period. This Data Model proposes
  an evolution of two Data Model by merging them and integrating all the attributes
  of the initial version of [TrafficFlowObserved] and [CrowFlowObserved] and by extension
  any type of item that we want to analyze the movements. Attributes `vehicleType`
  and `vehicleSubType` are removed from the initial data Model in order to become
  generic `itemType` and `itemSubType` of possible values. (people, Type of vehicle,
  Type of boat, Type of plane, ...).
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.Transportation
  spec.source.path: ItemFlowObserved/schema.json
  spec.source.commit: 48e0e7ebaaee430f04a47efb27fc38825f79b725
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld",
