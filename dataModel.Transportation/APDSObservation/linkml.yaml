  observedCredentialId:
    description: Property. Specific identifier to the referenced observed credential.
      The credential is specified by observedCredentialType and may be an RFID tag,
      ticket number from a paystation, license plate number, etc. In case of a licensePlate
      only alpha numerical values (no spaces or hyphens) are allowed. Optionally an
      ':' can be used to indicate the position of e.g. the German City Seal (https://www.europeanplates.com/information/german-city-codes.html).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observedCredentialId
  observedCredentialCountry:
    description: Property. Country Code following the 2 character ISO3166 standard
      (https://www.iban.com/country-codes). Note that the International vehicle registration
      code should not be used to avoid ambiguity (https://en.wikipedia.org/wiki/International_vehicle_registration_code).
      If the country-code could not be determined, set 'XX' as for this attribute.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observedCredentialCountry
  observedCredentialConfidence:
    description: 'Property. The overall confidence of the measurement. This can be
      vendor specific, but should always be rescaled to value between 0 en 1. Use
      the metadata to indicate how this number should be interpreted. Arvoo: range[0.0,
      1.0](higher is better).'
    range: float
    annotations:
