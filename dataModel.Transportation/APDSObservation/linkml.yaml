    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observationDateTime
  observationStartDateTime:
    description: 'Property. The date and time of the observation(in UTC)event started.(e.g.a
      car was observed to enter a delivery zone at 8: 01am). Mandatory if creationDateTime
      is not used.'
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observationStartDateTime
  observationEndDateTime:
    description: 'Property. The date and time of the observation event ended(in UTC).(e.g.a
      car was observed to exit a delivery zone at 9: 33am). Mandatory if creationDateTime
      is not used.'
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observationEndDateTime
  observerLocation:
    description: GeoProperty. GPS position of the person or car equipped with the
      Camera/s that produce the observation.
    range: ObserverLocation
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observerLocation
  observerLocationPDOP:
    description: 'Property. Accuracy of the GPS position of the observer, expressed
      as ''Position Dilution Of Precision''(https: //en.wikipedia.org/wiki/Dilution_of_precision_(navigation)).
      Units:''meters''.'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observerLocationPDOP
    unit:
      ucum_code: m
      exact_mappings:
      - ucefact:MTR
      - qudt-unit:M
      has_quantity_kind: qudt-quantkind:ElevationRelativeToNAP
  towardsObserver:
    description: 'Property. 1: Observed vehicle moves in direction of camera, 0: Observed
      vehicle moves away direction of camera, -1: Observed vehicle direction not detected.'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/towardsObserver
  observerHeading:
    description: Property. Denotes the direction of travel of the observer and is
      specified in decimal degrees, where 0 <= 'heading' < 360, counting clockwise
      relative to the true north. If the vehicle is stationary(i.e. the value of the
      'speed' attribute is '0'), then the value of the heading attribute must be equal
      to '-1'. Model:'https://schema.org/Number'. Units:'Degree'.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observerHeading
  observedLocation:
    description: GeoProperty. GPS position of the middle position of the scanned vehicle.
    range: ObservedLocation
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observedLocation
  observedLocationPDOP:
    description: 'Property. Accuracy of GPS position of the observed vehicle. This
      is expressed as ''Position Dilution Of Precision''(https: //en.wikipedia.org/wiki/Dilution_of_precision_(navigation)).
      Units:''meters''. (UN code ''MTR''). '
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observedLocationPDOP
    unit:
      ucum_code: m
      exact_mappings:
      - ucefact:MTR
      - qudt-unit:M
      has_quantity_kind: qudt-quantkind:ElevationRelativeToNAP
  observedHeading:
    description: Property. Denotes the direction of travel of the observer and is
      specified in decimal degrees, where 0 <= 'heading' < 360, counting clockwise
      relative to the true north.If the vehicle is stationary(i.e. the value of the
      'speed' attribute is '0'), then the value of the heading attribute must be equal
      to '-1'. Model:'https://schema.org/Number'. Units:'Degrees'. (UN code DD)
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observedHeading
  observerSpeed:
    description: 'Property. Denotes the magnitude of the horizontal component of the
      observer current velocity and is specified in kilometers per hour. If provided,
      the value of the speed attribute must be a non - negative real number. ''-1''
      MAY be used if speed is transiently unknown for some reason. Model:''https://schema.org/Number''.
      Units:''KMH'' '
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observerSpeed
  observedSpeed:
    description: Property. Denotes the magnitude of the horizontal component of the
      observed vehicles current velocity and is specified in kilometers per hour.
      If provided, the value of the speed attribute must be a non - negative real
      number.'-1' MAY be used if speed is transiently unknown for some reason. Model:'https://schema.org/Number'.
      Units:'km/h'. (UN Code KMH).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation@48e0e7ebaaee430f04a47efb27fc38825f79b725
    slot_uri: https://smartdatamodels.org/dataModel.Transportation/observedSpeed
    unit:
      ucum_code: km.h-1
      exact_mappings:
      - ucefact:KMH
      - qudt-unit:KiloM-PER-HR
      has_quantity_kind: qudt-quantkind:LinearVelocity
  images:
    description: Property. Array of links to images. The array element contain the
      URLs of the images and additional info. As an alternative to the images URL,
