  temperature:
    description: Property. Main Temperature recorded at the time of Observation compared
      to the  nominal reference temperature of the device. The unit code (text) is
      given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **CEL** represents Degree Celsius. Model:'https://schema.org/Number'.
      Units:'celsius degrees '
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/temperature
    unit:
      ucum_code: Cel
      exact_mappings:
      - ucefact:CEL
      - qudt-unit:DEG_C
      has_quantity_kind: qudt-quantkind:Temperature
  stateOfCharge:
    description: Property. The State of Charge (Code SoC) expressed in % is defined
      as the ratio between the remaining and the current capacities. The current capacity
      is the maximum capacity that can be withdrawn from the fully charged battery
      under specific discharge conditions. Rule [SOC] + [DOD] = 100 %. The unit code
      (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percent. Model:'https://schema.org/Number'
    range: float
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/stateOfCharge
  deepOfDischarge:
    description: Property. The Deep of Discharge (Code DoD) expressed in % is the
      ratio between the capacity already discharged and the nominal capacity of the
      accumulator. That is to say the energy consumed in the battery. Rule  [DOD]
      = 100 % - [SOC]. The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percent. Model:'https://schema.org/Number'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/deepOfDischarge
  stateOfHealth:
    description: Property. The State of Health  (Code SoH) expressed in % is defined
      as the ratio between the maximum amount of charge that a fully charged battery
      can provide under its nominal discharge regime, and its nominal capacity. The
      unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percent. Model:'https://schema.org/Number'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/stateOfHealth
  activePower:
    description: Property. Active Power, where 'phi' is the phase shift of the current
      compared to the voltage. The unit code (text) is given using the [UN/CEFACT
      Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **KWT** represents Kilowatt. Model:'https://schema.org/Number'.
      Units:'Kilowatt'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/activePower
  reactivePower:
    description: Property. Reactive Power used by circuits. The unit code (text) is
      given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **K5** represents kilovolt-ampere-reactive. Model:'https://schema.org/Number'.
      Units:'kilovolt-ampere-reactive'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/reactivePower
  current:
    description: 'Property. Current. The unit code (text) is given using the [UN/CEFACT
      Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **AMP** represents Ampere. Model:''https://schema.org/Number''.
      Units:''Ampere''. '
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/current
  openCircuitVoltage:
    description: Property. The Open Circuit Voltage (Code OCV) expressed in Volt is
      the difference of electrical potential between two terminals of a device when
      disconnected from any circuit. There is no external load connected and No external
      electric current flows between the terminals. The unit code (text) is given
      using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **VLT** represents Volt. Model:'https://schema.org/Number'. Units:'Volt'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/openCircuitVoltage
  inverterStatus:
    description: Property. Status of the inverter. A combination of values. Enum:'00-Onsector,
      01-PowerFailure/OnBattery, 02-LossCommunication, 03-BatteryFault, 04-SystemShutDown,
      05-TensionDip, 06-OverVoltage, 07-VoltageDrop, 08-VoltageIncrease, 09-LineNoise,
      10-FrequencyVariation, 11-TransientDistortion, 12-HarmonicDistortion'
    range: inverterStatus_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/inverterStatus
