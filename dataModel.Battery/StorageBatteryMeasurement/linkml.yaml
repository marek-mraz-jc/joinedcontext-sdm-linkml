id: https://github.com/smart-data-models/dataModel.Battery/StorageBatteryMeasurement
name: StorageBatteryMeasurement
title: Smart Data Models. Storage Battery Measurement schema
description: Storage Battery Observed Data Model is intended to measure the remaining
  energy capacity in a battery, which can be redistributed in the form of electrical
  energy. These functions apply from a source which depends on the type of battery
  (reference to the attribute 'batteryType' of the Data Model `StorageBatteryDevice`).
