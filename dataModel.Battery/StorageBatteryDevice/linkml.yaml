      after exceeding the threshold.(`true` for yes)
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/overloadAccepted
  overloadAcceptedTime:
    description: Property. Model:'https://schema.org/DateTime'. Accepted overcharge
      time without damage to the battery
    range: time
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/overloadAcceptedTime
  selfDischargeRate:
    description: Property. Model:'https://schema.org/Number'. Battery discharge rate
      without any use on a baseline of 1 month according the [temperature of reference].
      The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percentage
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/selfDischargeRate
  capacityCnnn:
    description: Property. Model:'https://schema.org/Number'. Remaining energy as
      a function of the discharge time for 6 keys according the temperature of reference.
      Each Key is a structured value with the format {`Cnnn`:[`value1`,`value2`]}
      describing the different measurement of [CapacityCnnn]
    range: CapacityCnnn
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/capacityCnnn
  roundTripEfficiency:
    description: Property. Model:'https://schema.org/Number'. Round-Trip Efficiency.
      Efficiency, defined as the ratio between stored energy and returned energy.
      The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percent
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/roundTripEfficiency
  chargeDischargeReactivity:
    description: Property. Model:'https://schema.org/Number'.  Charge and Discharge
      Reactivity which characterizes the reactive behavior of the system. The unit
      code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **SEC** represents Second. Units:'seconds'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/chargeDischargeReactivity
    unit:
      ucum_code: s
      exact_mappings:
      - ucefact:SEC
      - qudt-unit:SEC
      has_quantity_kind: qudt-quantkind:Time
  chargePower:
    description: Property. Model:'https://schema.org/Number'. Load Power. The unit
      code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **VLT** represents Volt. Units:'volts'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/chargePower
  chargeEfficiency:
    description: Property. Model:'https://schema.org/Number'. Charge Efficiency *(code
      PV-BAT)*. The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percent
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/chargeEfficiency
  maximumVoltageEOC:
    description: Property. Model:'https://schema.org/Number'. Maximum authorized voltage
      after end of charge and Battery still connected to to a charge generator. The
      unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **VLT** represents Volt. Units:'volts'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/maximumVoltageEOC
  dischargePower:
    description: Property. Model:'https://schema.org/Number'. Discharge Power. The
      unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **VLT** represents Volt. Units:'volts'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/dischargePower
  dischargeEfficiency:
    description: Property. Model:'https://schema.org/Number'. Discharge Efficiency
      *(code PV-OND)*. The unit code (text) is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **P1** represents Percent
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/dischargeEfficiency
  minimumVoltageEOD:
    description: Property. Model:'https://schema.org/Number'. Minimum voltage after
      end of discharge and not connected to to a charge generator. The unit code (text)
      is given using the [UN/CEFACT Common Codes](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes).
      For instance, **VLT** represents Volt. Units:'volts'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Battery@bbb912274121dd67b2d439e5f82ad1e4dad6718f
    slot_uri: https://smartdatamodels.org/dataModel.Battery/minimumVoltageEOD
