id: https://github.com/smart-data-models/dataModel.EnergyCIM/SynchronousMachineEquivalentCircuit
name: SynchronousMachineEquivalentCircuit
title: ' Smart Data Models - SynchronousMachineEquivalentCircuit'
description: 'Adapted from CIM data models. The electrical equations for all variations
  of the synchronous models are based on the SynchronousEquivalentCircuit diagram
  for the direct and quadrature axes.    =  +   =  +  *  / ( + )  =  +  * *  / ( *  +  *  +  *
  )  =  +   =  +  *  / (+ )  =  +  **  / ( *  +  *  +  * )  = ( + ) / ( * )  = ( *  +  *  +  *
  ) / ( *  * ( + )  = ( + ) / ( * )  = ( *  +  *  +  * )/ ( *  * ( + ) Same equations
  using CIM attributes from SynchronousMachineTimeConstantReactance class on left
  of = sign and SynchronousMachineEquivalentCircuit class on right (except as noted):
  xDirectSync = xad + RotatingMachineDynamics.statorLeakageReactance xDirectTrans
  = RotatingMachineDynamics.statorLeakageReactance + xad * xfd / (xad + xfd) xDirectSubtrans
  = RotatingMachineDynamics.statorLeakageReactance + xad * xfd * x1d / (xad * xfd
  + xad * x1d + xfd * x1d) xQuadSync = xaq + RotatingMachineDynamics.statorLeakageReactance
  xQuadTrans = RotatingMachineDynamics.statorLeakageReactance + xaq * x1q / (xaq+
  x1q) xQuadSubtrans = RotatingMachineDynamics.statorLeakageReactance + xaq * x1q*
  x2q / (xaq * x1q + xaq * x2q + x1q * x2q)  tpdo = (xad + xfd) / (2*pi*nominal frequency
  * rfd) tppdo = (xad * xfd + xad * x1d + xfd * x1d) / (2*pi*nominal frequency * r1d
  * (xad + xfd) tpqo = (xaq + x1q) / (2*pi*nominal frequency * r1q) tppqo = (xaq *
  x1q + xaq * x2q + x1q * x2q)/ (2*pi*nominal frequency * r2q * (xaq + x1q).  Are
  only valid for a simplified model where ''Canay'' reactance is zero.'
