id: https://github.com/smart-data-models/dataModel.EnergyCIM/PositionPoint
name: PositionPoint
title: ' Smart Data Models - PositionPoint'
description: Adapted from CIM data models. Set of spatial coordinates that determine
  a point, defined in the coordinate system specified in 'Location.CoordinateSystem'.
  Use a single position point instance to desribe a point-oriented location. Use a
  sequence of position points to describe a line-oriented object (physical location
  of non-point oriented objects like cables or lines), or area of an object (like
  a substation or a geographical zone - in this case, have first and last position
  point with the same values).
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
