  highSideMinOperatingU:
    description: 'Property. Model:''https://schema.org/Number''. The minimum operating
      voltage (uQmin in the IEC 60909-0) at the high voltage side (Q side) of the
      unit transformer of the power station unit. A value well established from long-term
      operating experience of the system. It is used for calculation of the impedance
      correction factor KG defined in IEC 60909-0 Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
