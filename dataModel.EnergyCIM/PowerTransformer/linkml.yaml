      voltage (Ub in the IEC 60909-0) before short circuit. It is used for calculation
      of the impedance correction factor KT defined in IEC 60909-0. This is worst
      case voltage on the low side winding (Section 3.7.1 in the standard). Used to
      define operating conditions. Default: 0.0'
    range: float
    annotations:
