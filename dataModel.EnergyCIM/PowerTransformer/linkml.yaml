      factor before short circuit (phib in the IEC 60909-0). It is used for calculation
      of the impedance correction factor KT defined in IEC 60909-0. This is the worst
      case power factor. Used to define operating conditions. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
