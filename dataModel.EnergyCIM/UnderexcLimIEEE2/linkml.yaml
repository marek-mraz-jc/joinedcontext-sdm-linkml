  has either a straight-line or multi-segment characteristic when plotted in terms
  of machine reactive power output vs. real power output.  Reference: IEEE UEL2 421.5-2005
  Section 10.2.  (Limit characteristic lookup table shown in Figure 10.4 (p 32) of
  the standard).'
