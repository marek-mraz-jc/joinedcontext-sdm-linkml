id: https://github.com/smart-data-models/dataModel.EnergyCIM/DiagramObject
name: DiagramObject
title: ' Smart Data Models - DiagramObject'
description: Adapted from CIM data models. An object that defines one or more points
  in a given space. This object can be associated with anything that specializes IdentifiedObject.
  For single line diagrams such objects typically include such items as analog values,
  breakers, disconnectors, power transformers, and transmission lines.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
