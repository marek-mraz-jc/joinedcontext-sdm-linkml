          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
      streetNr:
