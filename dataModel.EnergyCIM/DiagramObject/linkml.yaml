      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/areaServed
  Diagram:
    description: 'Property. Model:''https://schema.org/Number''. A diagram object
      is part of a diagram. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/Diagram
  DiagramObjectPoints:
    description: 'Property. Model:''https://schema.org/Number''. A diagram object
      can have 0 or more points to reflect its layout position, routing (for polylines)
      or boundary (for polygons). Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/DiagramObjectPoints
  DiagramObjectStyle:
    description: 'Property. Model:''https://schema.org/Number''. A diagram object
      has a style associated that provides a reference for the style used in the originating
      system. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/DiagramObjectStyle
  IdentifiedObject:
    description: 'Property. Model:''https://schema.org/Number''. The diagram objects
      that are associated with the domain object. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/IdentifiedObject
  VisibilityLayers:
    description: 'Property. Model:''https://schema.org/Number''. A diagram object
      can be part of multiple visibility layers. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/VisibilityLayers
  drawingOrder:
    description: 'Property. Model:''https://schema.org/Number''. The drawing order
      of this element. The higher the number, the later the element is drawn in sequence.
      This is used to ensure that elements that overlap are rendered in the correct
      order. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/drawingOrder
  isPolygon:
    description: 'Property. Model:''https://schema.org/Number''. Defines whether or
      not the diagram objects points define the boundaries of a polygon or the routing
      of a polyline. If this value is true then a receiving application should consider
      the first and last points to be connected. Default: False'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/isPolygon
  offsetX:
    description: 'Property. Model:''https://schema.org/Number''. The offset in the
      X direction. This is used for defining the offset from centre for rendering
      an icon (the default is that a single point specifies the centre of the icon).  The
      offset is in per-unit with 0 indicating there is no offset from the horizontal
      centre of the icon.  -0.5 indicates it is offset by 50% to the left and 0.5
      indicates an offset of 50% to the right. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/offsetX
  offsetY:
    description: 'Property. Model:''https://schema.org/Number''. The offset in the
      Y direction. This is used for defining the offset from centre for rendering
      an icon (the default is that a single point specifies the centre of the icon).  The
      offset is in per-unit with 0 indicating there is no offset from the vertical
      centre of the icon.  The offset direction is dependent on the orientation of
      the diagram, with -0.5 and 0.5 indicating an offset of +/- 50% on the vertical
      axis. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/offsetY
  rotation:
    description: 'Property. Model:''https://schema.org/Number''. Sets the angle of
      rotation of the diagram object.  Zero degrees is pointing to the top of the
      diagram.  Rotation is clockwise. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/rotation
