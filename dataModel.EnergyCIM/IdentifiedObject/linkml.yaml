      in RFC 4122, for the mRID.  The use of UUID is strongly recommended. For CIMXML
      data files in RDF syntax conforming to IEC 61970-552 Edition 1, the mRID is
      mapped to rdf:ID or rdf:about attributes that identify CIM object elements.
      Default: '''''
