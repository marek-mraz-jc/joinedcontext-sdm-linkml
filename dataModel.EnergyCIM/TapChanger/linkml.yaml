      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/highStep
  lowStep:
    description: 'Property. Model:''https://schema.org/Number''. Lowest possible tap
      step position, retard from neutral Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/lowStep
  ltcFlag:
    description: 'Property. Model:''https://schema.org/Number''. Specifies whether
      or not a TapChanger has load tap changing capabilities. Default: False'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/ltcFlag
  neutralStep:
    description: 'Property. Model:''https://schema.org/Number''. The neutral tap step
      position for this winding. The attribute shall be equal or greater than lowStep
      and equal or less than highStep. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/neutralStep
  neutralU:
    description: 'Property. Model:''https://schema.org/Number''. Voltage at which
      the winding operates at the neutral tap setting. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/neutralU
  normalStep:
    description: 'Property. Model:''https://schema.org/Number''. The tap step position
      used in `normal` network operation for this winding. For a `Fixed` tap changer
      indicates the current physical tap setting. The attribute shall be equal or
      greater than lowStep and equal or less than highStep. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/normalStep
  step:
    description: 'Property. Model:''https://schema.org/Number''. Tap changer position.
      Starting step for a steady state solution. Non integer values are allowed to
      support continuous tap variables. The reasons for continuous value are to support
      study cases where no discrete tap changers has yet been designed, a solutions
      where a narrow voltage band force the tap step to oscillate or accommodate for
      a continuous solution as input. The attribute shall be equal or greater than
      lowStep and equal or less than highStep. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/step
