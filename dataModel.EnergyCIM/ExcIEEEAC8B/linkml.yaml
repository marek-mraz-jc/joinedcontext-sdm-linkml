id: https://github.com/smart-data-models/dataModel.EnergyCIM/ExcIEEEAC8B
name: ExcIEEEAC8B
title: ' Smart Data Models - ExcIEEEAC8B'
description: 'Adapted from CIM data models. The class represents IEEE Std 421.5-2005
  type AC8B model. This model represents a PID voltage regulator with either a brushless
  exciter or dc exciter. The AVR in this model consists of PID control, with separate
  constants for the proportional (), integral (), and derivative () gains. The representation
  of the brushless exciter (, , , , ) is similar to the model Type AC2A. The Type
  AC8B model can be used to represent static voltage regulators applied to brushless
  excitation systems. Digitally based voltage regulators feeding dc rotating main
  exciters can be represented with the AC Type AC8B model with the parameters  and  set
  to 0.  For thyristor power stages fed from the generator terminals, the limits  and  should
  be a function of terminal voltage:  * and  * .     Reference: IEEE Standard 421.5-2005
  Section 6.8.'
