name: SynchronousMachineDetailed
title: ' Smart Data Models - SynchronousMachineDetailed'
description: 'Adapted from CIM data models. All synchronous machine detailed types
  use a subset of the same data parameters and input/output variables.   The several
  variations differ in the following ways:   It is not necessary for each simulation
  tool to have separate models for each of the model types.  The same model can often
  be used for several types by alternative logic within the model.  Also, differences
  in saturation representation may not result in significant model performance differences
  so model substitutions are often acceptable.'
