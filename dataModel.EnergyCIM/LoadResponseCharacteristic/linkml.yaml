id: https://github.com/smart-data-models/dataModel.EnergyCIM/LoadResponseCharacteristic
name: LoadResponseCharacteristic
title: ' Smart Data Models - LoadResponseCharacteristic'
description: 'Adapted from CIM data models. Models the characteristic response of
  the load demand due to changes in system conditions such as voltage and frequency.
  This is not related to demand response.  If LoadResponseCharacteristic.exponentModel
  is True, the voltage exponents are specified and used as to calculate:  Active power
  component = Pnominal * (Voltage/cim:BaseVoltage.nominalVoltage) ** cim:LoadResponseCharacteristic.pVoltageExponent  Reactive
  power component = Qnominal * (Voltage/cim:BaseVoltage.nominalVoltage)** cim:LoadResponseCharacteristic.qVoltageExponent  Where  *
  means ''multiply'' and ** is ''raised to power of''.'
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
