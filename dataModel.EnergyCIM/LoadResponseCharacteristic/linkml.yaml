  exponentModel:
    description: 'Property. Model:''https://schema.org/Number''. Indicates the exponential
      voltage dependency model is to be used.   If false, the coefficient model is
      to be used. The exponential voltage dependency model consist of the attributes
      - pVoltageExponent - qVoltageExponent. The coefficient model consist of the
      attributes - pConstantImpedance - pConstantCurrent - pConstantPower - qConstantImpedance
      - qConstantCurrent - qConstantPower. The sum of pConstantImpedance, pConstantCurrent
      and pConstantPower shall equal 1. The sum of qConstantImpedance, qConstantCurrent
      and qConstantPower shall equal 1. Default: False'
    range: float
    annotations:
