      information in Measurement, along with `measurementType` and `phases` uniquely
      defines a Measurement for a device, based on normal network phase. Their meaning
      will not change when the computed energizing phasing is changed due to jumpers
      or other reasons. If the attribute is missing three phases (ABC) shall be assumed.
      Default: None'
