id: https://github.com/smart-data-models/dataModel.EnergyCIM/VisibilityLayer
name: VisibilityLayer
title: ' Smart Data Models - VisibilityLayer'
description: Adapted from CIM data models. Layers are typically used for grouping
  diagram objects according to themes and scales. Themes are used to display or hide
  certain information (e.g., lakes, borders), while scales are used for hiding or
  displaying information depending on the current zoom level (hide text when it is
  too small to be read, or when it exceeds the screen size). This is also called de-cluttering.  CIM
  based graphics exchange will support an m:n relationship between diagram objects
  and layers. It will be the task of the importing system to convert an m:n case into
  an appropriate 1:n representation if the importing system does not support m:n.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
