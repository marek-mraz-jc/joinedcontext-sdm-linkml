  kr:
    description: 'Property. Model:''https://schema.org/Number''. Death band (Kr).  If
      Kr is not zero, the voltage regulator input changes at a constant rate if Verr
      > Kr or Verr < -Kr as per the IEEE (1968) Type 4 model. If Kr is zero, the error
      signal drives the voltage regulator continuously as per the IEEE (1980) DC3
      and IEEE (1992, 2005) DC3A models.  Typical Value = 0. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
