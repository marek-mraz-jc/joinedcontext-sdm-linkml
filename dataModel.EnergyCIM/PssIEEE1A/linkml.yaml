name: PssIEEE1A
title: ' Smart Data Models - PssIEEE1A'
description: 'Adapted from CIM data models. The class represents IEEE Std 421.5-2005
  type PSS1A power system stabilizer model. PSS1A is the generalized form of a PSS
  with a single input. Some common stabilizer input signals are speed, frequency,
  and power.  Reference: IEEE 1A 421.5-2005 Section 8.1.'
