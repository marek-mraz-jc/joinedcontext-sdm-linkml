    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/InitialReactiveCapabilityCurve
  SynchronousMachineDynamics:
    description: 'Property. Model:''https://schema.org/Number''. Synchronous machine
      dynamics model used to describe dynamic behavior of this synchronous machine.
      Default: None'
