  fromEndIsoCode:
    description: 'Property. Model:''https://schema.org/Number''. The attribute is
      used for an exchange of the ISO code of the region to which the `From` side
      of the Boundary point belongs to or it is connected to. The ISO code is two
      characters country code as defined by ISO 3166 (). The length of the string
      is 2 characters maximum. The attribute is a required for the Boundary Model
      Authority Set where this attribute is used only for the TopologicalNode in the
      Boundary Topology profile and ConnectivityNode in the Boundary Equipment profile.
      Default: '''''
    range: float
    annotations:
