id: https://github.com/smart-data-models/dataModel.EnergyCIM/AsynchronousMachineEquivalentCircuit
name: AsynchronousMachineEquivalentCircuit
title: ' Smart Data Models - AsynchronousMachineEquivalentCircuit'
description: 'Adapted from CIM data models. The electrical equations of all variations
  of the asynchronous model are based on the AsynchronousEquivalentCircuit diagram
  for the direct and quadrature axes, with two equivalent rotor windings in each axis.      =  +   =  +  *  /
  ( + )  =  +  * *  / ( *  +  *  +  * )  = ( + ) / ( * )  = ( *  +  *  +  * ) / (
  *  * (+ ) Same equations using CIM attributes from AsynchronousMachineTimeConstantReactance
  class on left of = sign and AsynchronousMachineEquivalentCircuit class on right
  (except as noted): xs = xm + RotatingMachineDynamics.statorLeakageReactance xp =
  RotatingMachineDynamics.statorLeakageReactance + xm * xlr1 / (xm + xlr1) xpp = RotatingMachineDynamics.statorLeakageReactance
  + xm * xlr1* xlr2 / (xm * xlr1 + xm * xlr2 + xlr1 * xlr2) tpo = (xm + xlr1) / (2*pi*nominal
  frequency * rr1) tppo = (xm * xlr1 + xm * xlr2 + xlr1 * xlr2) / (2*pi*nominal frequency
  * rr2 * (xm + xlr1).'
