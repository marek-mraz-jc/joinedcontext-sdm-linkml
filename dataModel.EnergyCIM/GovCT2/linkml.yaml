  dm:
    description: 'Property. Model:''https://schema.org/Number''. Speed sensitivity
      coefficient (Dm).  Dm can represent either the variation of the engine power
      with the shaft speed or the variation of maximum power capability with shaft
      speed.  If it is positive it describes the falling slope of the engine speed
      verses power characteristic as speed increases. A slightly falling characteristic
      is typical for reciprocating engines and some aero-derivative turbines.  If
      it is negative the engine power is assumed to be unaffected by the shaft speed,
      but the maximum permissible fuel flow is taken to fall with falling shaft speed.
      This is characteristic of single-shaft industrial turbines due to exhaust temperature
      limits.  Typical Value = 0. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/dm
