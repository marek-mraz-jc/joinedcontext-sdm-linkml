name: ExcIEEEST2A
title: ' Smart Data Models - ExcIEEEST2A'
description: 'Adapted from CIM data models. The class represents IEEE Std 421.5-2005
  type ST2A model. Some static systems utilize both current and voltage sources (generator
  terminal quantities) to comprise the power source.  The regulator controls the exciter
  output through controlled saturation of the power transformer components.  These
  compound-source rectifier excitation systems are designated Type ST2A and are represented
  by ExcIEEEST2A.  Reference: IEEE Standard 421.5-2005 Section 7.2.'
