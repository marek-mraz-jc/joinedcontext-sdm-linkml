  BusNameMarker:
    description: 'Property. Model:''https://schema.org/Number''. The bus name marker
      used to name the bus (topological node). Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/BusNameMarker
  Measurements:
    description: 'Property. Model:''https://schema.org/Number''. Measurements associated
      with this terminal defining  where the measurement is placed in the network
      topology.  It may be used, for instance, to capture the sensor position, such
      as a voltage transformer (PT) at a busbar or a current transformer (CT) at the
      bar between a breaker and an isolator. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/Measurements
  OperationalLimitSet:
    description: 'Property. Model:''https://schema.org/Number''.  Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/OperationalLimitSet
  connected:
    description: 'Property. Model:''https://schema.org/Number''. The connected status
      is related to a bus-branch model and the topological node to terminal relation.  True
      implies the terminal is connected to the related topological node and false
      implies it is not.  In a bus-branch model, the connected status is used to tell
      if equipment is disconnected without having to change the connectivity described
      by the topological node to terminal relation. A valid case is that conducting
      equipment can be connected in one end and open in the other. In particular for
      an AC line segment, where the reactive line charging can be significant, this
      is a relevant case. Default: False'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/connected
  sequenceNumber:
    description: 'Property. Model:''https://schema.org/Number''. The orientation of
      the terminal connections for a multiple terminal conducting equipment.  The
      sequence numbering starts with 1 and additional terminals should follow in increasing
      order.   The first terminal is the `starting point` for a two terminal branch.
      Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/sequenceNumber
