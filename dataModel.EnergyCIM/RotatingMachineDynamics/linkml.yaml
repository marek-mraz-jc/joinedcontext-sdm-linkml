  damping:
    description: 'Property. Model:''https://schema.org/Number''. Damping torque coefficient
      (D).  A proportionality constant that, when multiplied by the angular velocity
      of the rotor poles with respect to the magnetic field (frequency), results in
      the damping torque.  This value is often zero when the sources of damping torques
      (generator damper windings, load damping effects, etc.) are modelled in detail.  Typical
      Value = 0. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/damping
  inertia:
    description: 'Property. Model:''https://schema.org/Number''. Inertia constant
      of generator or motor and mechanical load (H) (>0).  This is the specification
      for the stored energy in the rotating mass when operating at rated speed.  For
      a generator, this includes the generator plus all other elements (turbine, exciter)
      on the same shaft and has units of MW*sec.  For a motor, it includes the motor
      plus its mechanical load. Conventional units are per unit on the generator MVA
      base, usually expressed as MW*second/MVA or just second.   This value is used
      in the accelerating power reference frame for operator training simulator solutions.  Typical
      Value = 3. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/inertia
  saturationFactor:
    description: 'Property. Model:''https://schema.org/Number''. Saturation factor
      at rated terminal voltage (S1) (> or =0).  Not used by simplified model.  Defined
      by defined by S(E1) in the SynchronousMachineSaturationParameters diagram.  Typical
      Value = 0.02. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/saturationFactor
  saturationFactor120:
    description: 'Property. Model:''https://schema.org/Number''. Saturation factor
      at 120% of rated terminal voltage (S12) (> or =S1). Not used by the simplified
      model, defined by S(E2) in the SynchronousMachineSaturationParameters diagram.  Typical
      Value = 0.12. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/saturationFactor120
  statorLeakageReactance:
    description: 'Property. Model:''https://schema.org/Number''. Stator leakage reactance
      (Xl) (> or =0). Typical Value = 0.15. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/statorLeakageReactance
  statorResistance:
