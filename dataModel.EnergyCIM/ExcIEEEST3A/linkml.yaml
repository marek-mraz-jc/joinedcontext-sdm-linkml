id: https://github.com/smart-data-models/dataModel.EnergyCIM/ExcIEEEST3A
name: ExcIEEEST3A
title: ' Smart Data Models - ExcIEEEST3A'
description: 'Adapted from CIM data models. The class represents IEEE Std 421.5-2005
  type ST3A model.  Some static systems utilize a field voltage control loop to linearize
  the exciter control characteristic. This also makes the output independent of supply
  source variations until supply limitations are reached.  These systems utilize a
  variety of controlled-rectifier designs: full thyristor complements or hybrid bridges
  in either series or shunt configurations. The power source may consist of only a
  potential source, either fed from the machine terminals or from internal windings.
  Some designs may have compound power sources utilizing both machine potential and
  current. These power sources are represented as phasor combinations of machine terminal
  current and voltage and are accommodated by suitable parameters in model Type ST3A
  which is represented by ExcIEEEST3A.   Reference: IEEE Standard 421.5-2005 Section
  7.3.'
