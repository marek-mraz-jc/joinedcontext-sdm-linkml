id: https://github.com/smart-data-models/dataModel.EnergyCIM/StaticVarCompensator
name: StaticVarCompensator
title: ' Smart Data Models - StaticVarCompensator'
description: Adapted from CIM data models. A facility for providing variable and controllable
  shunt reactive power. The SVC typically consists of a stepdown transformer, filter,
  thyristor-controlled reactor, and thyristor-switched capacitor arms.  The SVC may
  operate in fixed MVar output mode or in voltage control mode. When in voltage control
  mode, the output of the SVC will be proportional to the deviation of voltage at
  the controlled bus from the voltage setpoint.  The SVC characteristic slope defines
  the proportion.  If the voltage at the controlled bus is equal to the voltage setpoint,
  the SVC MVar output is zero.
