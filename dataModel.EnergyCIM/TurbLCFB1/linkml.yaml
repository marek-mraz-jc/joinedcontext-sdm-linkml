id: https://github.com/smart-data-models/dataModel.EnergyCIM/TurbLCFB1
name: TurbLCFB1
title: ' Smart Data Models - TurbLCFB1'
description: Adapted from CIM data models. Turbine Load Controller model developed
  in the WECC.  This model represents a supervisory turbine load controller that acts
  to maintain turbine power at a set value by continuous adjustment of the turbine
  governor speed-load reference. This model is intended to represent slow reset 'outer
  loop' controllers managing the action of the turbine governor.
