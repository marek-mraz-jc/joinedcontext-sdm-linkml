id: https://github.com/smart-data-models/dataModel.EnergyCIM/ExcIEEEAC5A
name: ExcIEEEAC5A
title: ' Smart Data Models - ExcIEEEAC5A'
description: 'Adapted from CIM data models. The class represents IEEE Std 421.5-2005
  type AC5A model. The model represents a simplified model for brushless excitation
  systems. The regulator is supplied from a source, such as a permanent magnet generator,
  which is not affected by system disturbances.  Unlike other ac models, this model
  uses loaded rather than open circuit exciter saturation data in the same way as
  it is used for the dc models.  Because the model has been widely implemented by
  the industry, it is sometimes used to represent other types of systems when either
  detailed data for them are not available or simplified models are required.   Reference:
  IEEE Standard 421.5-2005 Section 6.5.'
