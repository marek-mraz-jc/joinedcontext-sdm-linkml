  t1:
    description: 'Property. Model:''https://schema.org/Number''. Governor mechanism
      time constant (T1).  T1 represents the natural valve positioning time constant
      of the governor for small disturbances, as seen when rate limiting is not in
      effect.  Typical Value = 0.5. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/t1
  t2:
    description: 'Property. Model:''https://schema.org/Number''. Turbine power time
      constant (T2).  T2 represents delay due to internal energy storage of the gas
      turbine engine. T2 can be used to give a rough approximation to the delay associated
      with acceleration of the compressor spool of a multi-shaft engine, or with the
      compressibility of gas in the plenum of a the free power turbine of an aero-derivative
      unit, for example.  Typical Value = 0.5. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/t2
  t3:
