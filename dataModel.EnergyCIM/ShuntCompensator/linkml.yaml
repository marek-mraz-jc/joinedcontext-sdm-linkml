id: https://github.com/smart-data-models/dataModel.EnergyCIM/ShuntCompensator
name: ShuntCompensator
title: ' Smart Data Models - ShuntCompensator'
description: Adapted from CIM data models. A shunt capacitor or reactor or switchable
  bank of shunt capacitors or reactors. A section of a shunt compensator is an individual
  capacitor or reactor.  A negative value for reactivePerSection indicates that the
  compensator is a reactor. ShuntCompensator is a single terminal device.  Ground
  is implied.
