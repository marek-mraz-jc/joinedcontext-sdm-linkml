  sections:
    description: 'Property. Model:''https://schema.org/Number''. Shunt compensator
      sections in use. Starting value for steady state solution. Non integer values
      are allowed to support continuous variables. The reasons for continuous value
      are to support study cases where no discrete shunt compensators has yet been
      designed, a solutions where a narrow voltage band force the sections to oscillate
      or accommodate for a continuous solution as input. Default: 0.0'
    range: float
    annotations:
