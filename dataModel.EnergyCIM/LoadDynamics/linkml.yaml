id: https://github.com/smart-data-models/dataModel.EnergyCIM/LoadDynamics
name: LoadDynamics
title: ' Smart Data Models - LoadDynamics'
description: Adapted from CIM data models. Load whose behaviour is described by reference
  to a standard model   A standard feature of dynamic load behaviour modelling is
  the ability to associate the same behaviour to multiple energy consumers by means
  of a single aggregate load definition.  Aggregate loads are used to represent all
  or part of the real and reactive load from one or more loads in the static (power
  flow) data. This load is usually the aggregation of many individual load devices
  and the load model is approximate representation of the aggregate response of the
  load devices to system disturbances. The load model is always applied to individual
  bus loads (energy consumers) but a single set of load model parameters can used
  for all loads in the grouping.
