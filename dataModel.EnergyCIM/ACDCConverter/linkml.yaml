      on the DC side at which the converter should operate. Converter configuration
      data used in power flow. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/maxUdc
  minUdc:
