      DC voltage. Converter configuration data used in power flow. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/minUdc
  numberOfValves:
    description: 'Property. Model:''https://schema.org/Number''. Number of valves
      in the converter. Used in loss calculations. Default: 0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/numberOfValves
  p:
    description: 'Property. Model:''https://schema.org/Number''. Active power at the
      point of common coupling. Load sign convention is used, i.e. positive sign means
      flow out from a node. Starting value for a steady state solution in the case
      a simplified power flow model is used. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/p
  poleLossP:
    description: 'Property. Model:''https://schema.org/Number''. The active power
      loss at a DC Pole  = idleLoss + switchingLoss*|Idc| + resitiveLoss*Idc^2 For
      lossless operation Pdc=Pac For rectifier operation with losses Pdc=Pac-lossP
      For inverter operation with losses Pdc=Pac+lossP Converter state variable used
      in power flow. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/poleLossP
  q:
    description: 'Property. Model:''https://schema.org/Number''. Reactive power at
      the point of common coupling. Load sign convention is used, i.e. positive sign
      means flow out from a node. Starting value for a steady state solution in the
      case a simplified power flow model is used. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://uri.etsi.org/ngsi-ld/q
  ratedUdc:
    description: 'Property. Model:''https://schema.org/Number''. Rated converter DC
      voltage, also called UdN. Converter configuration data used in power flow. Default:
      0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/ratedUdc
  resistiveLoss:
    description: 'Property. Model:''https://schema.org/Number''. Converter configuration
      data used in power flow. Refer to poleLossP. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/resistiveLoss
  switchingLoss:
    description: 'Property. Model:''https://schema.org/Number''. Switching losses,
      relative to the base apparent power `baseS`. Refer to poleLossP. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/switchingLoss
  targetPpcc:
    description: 'Property. Model:''https://schema.org/Number''. Real power injection
      target in AC grid, at point of common coupling. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/targetPpcc
  targetUdc:
    description: 'Property. Model:''https://schema.org/Number''. Target value for
      DC voltage magnitude. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/targetUdc
  uc:
    description: 'Property. Model:''https://schema.org/Number''. Converter voltage,
      the voltage at the AC side of the bridge. Converter state variable, result from
      power flow. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/uc
  udc:
    description: 'Property. Model:''https://schema.org/Number''. Converter voltage
      at the DC side, also called Ud. Converter state variable, result from power
      flow. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/udc
  valveU0:
    description: 'Property. Model:''https://schema.org/Number''. Valve threshold voltage.
      Forward voltage drop when the valve is conducting. Used in loss calculations,
      i.e. the switchLoss depend on numberOfValves * valveU0. Default: 0.0'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/valveU0
