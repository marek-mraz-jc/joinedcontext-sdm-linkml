id: https://github.com/smart-data-models/dataModel.EnergyCIM/RegulatingControl
name: RegulatingControl
title: ' Smart Data Models - RegulatingControl'
description: Adapted from CIM data models. Specifies a set of equipment that works
  together to control a power system quantity such as voltage or flow.  Remote bus
  voltage control is possible by specifying the controlled terminal located at some
  place remote from the controlling equipment. In case multiple equipment, possibly
  of different types, control same terminal there must be only one RegulatingControl
  at that terminal. The most specific subtype of RegulatingControl shall be used in
  case such equipment participate in the control, e.g. TapChangerControl for tap changers.
  For flow control  load sign convention is used, i.e. positive sign means flow out
  from a TopologicalNode (bus) into the conducting equipment.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
