  stepPhaseShiftIncrement:
    description: 'Property. Model:''https://schema.org/Number''. Phase shift per step
      position. A positive value indicates a positive phase shift from the winding
      where the tap is located to the other winding (for a two-winding transformer).
      The actual phase shift increment might be more accurately computed from the
      symmetrical or asymmetrical models or a tap step table lookup if those are available.
      Default: 0.0'
    range: float
    annotations:
