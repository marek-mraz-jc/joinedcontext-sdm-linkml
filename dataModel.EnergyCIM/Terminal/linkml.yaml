    slot_uri: https://smartdatamodels.org/dateModified
  source:
    description: Property. A sequence of characters giving the original source of
      the entity data as a URL. Recommended to be the fully qualified domain name
      of the source provider, or the URL to the source object
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/source
  name:
    description: Property. The name of this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/name
  alternateName:
    description: Property. An alternative name for this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/alternateName
  description:
    description: Property. A description of this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: http://purl.org/dc/terms/description
  dataProvider:
    description: Property. A sequence of characters identifying the provider of the
      harmonised data entity
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataProvider
  owner:
    description: Property. A List containing a JSON encoded sequence of characters
      referencing the unique Ids of the owner(s)
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/owner
  seeAlso:
    description: Property. list of uri pointing to additional resources about the
      item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/seeAlso
  address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    range: Address
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/areaServed
  ConductingEquipment:
    description: 'Property. Model:''https://schema.org/Number''. The conducting equipment
      of the terminal.  Conducting equipment have  terminals that may be connected
      to other conducting equipment terminals via connectivity nodes or topological
      nodes. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/ConductingEquipment
  ConnectivityNode:
    description: 'Property. Model:''https://schema.org/Number''. Terminals interconnected
      with zero impedance at a this connectivity node. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/ConnectivityNode
  ConverterDCSides:
    description: 'Property. Model:''https://schema.org/Number''. Point of common coupling
      terminal for this converter DC side. It is typically the terminal on the power
      transformer (or switch) closest to the AC network. The power flow measurement
      must be the sum of all flows into the transformer. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/ConverterDCSides
  HasFirstMutualCoupling:
    description: 'Property. Model:''https://schema.org/Number''. Mutual couplings
      associated with the branch as the first branch. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/HasFirstMutualCoupling
  HasSecondMutualCoupling:
    description: 'Property. Model:''https://schema.org/Number''. Mutual couplings
      with the branch associated as the first branch. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/HasSecondMutualCoupling
  RegulatingControl:
    description: 'Property. Model:''https://schema.org/Number''. The terminal associated
      with this regulating control.  The terminal is associated instead of a node,
      since the terminal could connect into either a topological node (bus in bus-branch
      model) or a connectivity node (detailed switch model).  Sometimes it is useful
      to model regulation at a terminal of a bus bar object since the bus bar can
      be present in both a bus-branch model or a model with switch detail. Default:
      None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/RegulatingControl
  RemoteInputSignal:
    description: 'Property. Model:''https://schema.org/Number''. Input signal coming
      from this terminal. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/RemoteInputSignal
  SvPowerFlow:
    description: 'Property. Model:''https://schema.org/Number''. The power flow state
      variable associated with the terminal. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/SvPowerFlow
  TieFlow:
    description: 'Property. Model:''https://schema.org/Number''. The control area
      tie flows to which this terminal associates. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/TieFlow
  TopologicalNode:
    description: 'Property. Model:''https://schema.org/Number''. The terminals associated
      with the topological node.   This can be used as an alternative to the connectivity
      node path to terminal, thus making it unneccesary to model connectivity nodes
      in some cases.   Note that if connectivity nodes are in the model, this association
      would probably not be used as an input specification. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/TopologicalNode
  TransformerEnd:
    description: 'Property. Model:''https://schema.org/Number''. All transformer ends
      connected at this terminal. Default: ''list'''
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/TransformerEnd
  phases:
    description: 'Property. Model:''https://schema.org/Number''. Represents the normal
      network phasing condition. If the attribute is missing three phases (ABC or
      ABCN) shall be assumed. Default: None'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.EnergyCIM@a133118adea199b471b89c0908e7275312ef7a4c
    slot_uri: https://smartdatamodels.org/dataModel.EnergyCIM/phases
