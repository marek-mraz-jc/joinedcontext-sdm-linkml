name: OverexcLimIEEE
title: ' Smart Data Models - OverexcLimIEEE'
description: 'Adapted from CIM data models. The over excitation limiter model is intended
  to represent the significant features of OELs necessary for some large-scale system
  studies. It is the result of a pragmatic approach to obtain a model that can be
  widely applied with attainable data from generator owners. An attempt to include
  all variations in the functionality of OELs and duplicate how they interact with
  the rest of the excitation systems would likely result in a level of application
  insufficient for the studies for which they are intended.  Reference: IEEE OEL 421.5-2005
  Section 9.'
