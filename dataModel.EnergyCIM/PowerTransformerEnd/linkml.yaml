  phaseAngleClock:
    description: 'Property. Model:''https://schema.org/Number''. Terminal voltage
      phase angle displacement where 360 degrees are represented with clock hours.
      The valid values are 0 to 11. For example, for the secondary side end of a transformer
      with vector group code of `Dyn11`, specify the connection kind as wye with neutral
      and specify the phase angle of the clock as 11.  The clock value of the transformer
      end number specified as 1, is assumed to be zero.  Note the transformer end
      number is not assumed to be the same as the terminal sequence number. Default:
      0'
    range: float
    annotations:
