id: https://github.com/smart-data-models/dataModel.EnergyCIM/PowerTransformerEnd
name: PowerTransformerEnd
title: ' Smart Data Models - PowerTransformerEnd'
description: Adapted from CIM data models. A PowerTransformerEnd is associated with
  each Terminal of a PowerTransformer. The impedance values r, r0, x, and x0 of a
  PowerTransformerEnd represents a star equivalent as follows 1) for a two Terminal
  PowerTransformer the high voltage PowerTransformerEnd has non zero values on r,
  r0, x, and x0 while the low voltage PowerTransformerEnd has zero values for r, r0,
  x, and x0. 2) for a three Terminal PowerTransformer the three PowerTransformerEnds
  represents a star equivalent with each leg in the star represented by r, r0, x,
  and x0 values. 3) for a PowerTransformer with more than three Terminals the PowerTransformerEnd
  impedance values cannot be used. Instead use the TransformerMeshImpedance or split
  the transformer into multiple PowerTransformers.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
