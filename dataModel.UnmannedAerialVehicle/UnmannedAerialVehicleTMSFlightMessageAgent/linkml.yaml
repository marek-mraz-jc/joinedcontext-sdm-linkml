    "observedAt": {"type": "Property", "value": "2016-08-23T10:18:16Z"}, "originatedByUnmannedAutonomousVehicle":
    {"type": "Property", "value": false}, "originator": {"object": "urn:ngsi-ld:UAV:29935bbe-5922-11e8-9742-93bfb84686ec",
    "type": "Relationship"}, "source": {"type": "Property", "value": "https://source.example.com"},
    "type": "UnmannedAerialVehicleTMSFlightMessageAgent", "unmannedAerialVehicle":
    {"object": "urn:ngsi-ld:UAV:23821045-33d4-46ec-b777-98f461bf4856", "type": "Relationship"},
    "validationResult": {"type": "Property", "value": true}}'
