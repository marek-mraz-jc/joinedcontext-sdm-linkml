name: UnmannedAerialVehicleTMS
title: Smart Data models - UAV-Traffic Management Software schema
description: This entity contains a harmonized description of a specific Unmanned
  Aerial Vehicle (UAV) Traffic Management Software Application that is designed to
  listen to and monitor the information transmitted by UAV’s, typically this software
  application would be operated at a ground station. This entity is primarily associated
  with UAV command and control applications.
