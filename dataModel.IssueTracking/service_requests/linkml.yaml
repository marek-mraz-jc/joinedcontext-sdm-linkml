    "address_string": {"type": "Property", "value": "Calle San Juan Bautista, 2"},
    "agency_responsible": {"type": "Property", "value": "Ayuntamiento de Ciudad"},
    "attributes": {"type": "Property", "value": [{"code": "ISSUE_TYPE", "values":
    [{"key": 1, "name": "Bordillo"}]}]}, "description": {"type": "Property", "value":
    "Acera en mal estado con bordillo partido en dos"}, "expected_datetime": {"type":
    "Property", "value": {"@type": "DateTime", "@value": "2010-04-15T06:37:38-08:00Z"}},
    "id": "urn:ngsi-ld:Open311ServiceRequest:service-request:638344", "location":
