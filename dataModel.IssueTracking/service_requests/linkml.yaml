id: https://github.com/smart-data-models/dataModel.IssueTracking/service_requests
name: service_requests
title: FIWARE - Open311 Service Requests
description: An entity of type ServiceRequest is an acceptable Open 311 service request.
  Such entity encompasses all the properties defined by Open 311 at POST Service Request
  and GET Service Request.
