id: https://github.com/smart-data-models/dataModel.ERA/InfrastructureObject
name: InfrastructureObject
title: InfrastructureObject + mapped from ERA ontology by Smart Data Models
description: 'This class encompasses all those classes that represent features that
  are  implemented in the European railway infrastructure. It is a subclass of the
  ERA Feature that has a spatial representation. It covers tracks, platforms, signals,
  tunnels, operational points, and sections of line.

  A feature that belongs to the infrastructure can be abstracted (hasAbstraction)
  as a topological object. It also is related to the infrastructure manager through
  the property infrastructureMgr.'
