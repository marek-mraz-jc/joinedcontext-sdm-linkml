name: nightly
# Regenerates the mirror from upstream. A run with nothing new commits nothing.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # The converter's commit: move it by hand, so a change to the converter is one reviewed commit.
  PLATFORM_COMMIT: "190d6c6eaa08b56ade63ebf7534744426717c2fd"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: marek-mraz-jc/joinedcontext-platform
          ref: ${{ env.PLATFORM_COMMIT }}
          path: .platform
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the converter
        run: python -m pip install ./.platform/tools/model-tools
      - name: Convert the catalogue
        working-directory: .platform/tools/model-tools/src
        run: python sdm_mirror.py --out "$GITHUB_WORKSPACE"
      - name: Commit what changed
        run: |
          rm -rf .platform
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new upstream"
            exit 0
          fi
          git -c user.name=joinedcontext-mirror -c user.email=mirror@users.noreply.github.com \
            commit -m "Convert the catalogue of $(date -u +%F)"
          git push origin HEAD:main
