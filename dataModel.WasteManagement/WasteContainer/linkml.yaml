      is where it must be and stands properly. `lidOpen`. Container's lid has been
      opened and not closed after a certain amount of time. `dropped`. Container has
      been dropped for some reason. `moved`. Container has been moved from its regular
      position and has not come back. `vandalized`. Container has been damaged or
      destroyed due to vandalism. `burning`. Container is burning and an immediate
      action has to be taken. `unknown`. The status of the container is not known
