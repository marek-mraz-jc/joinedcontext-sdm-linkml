id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMPublicTransportStop
name: OSMPublicTransportStop
title: Smart Data Models - OpenStreetMap / OSMPublicTransportStop
description: A public transport stop, station, platform or boarding point from OpenStreetMap.
  Represents nodes and areas where passengers board or alight from public transport
  services, tagged with public_transport=* or specific mode tags.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
