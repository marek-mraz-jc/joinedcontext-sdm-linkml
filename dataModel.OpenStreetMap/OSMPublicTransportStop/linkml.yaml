  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "bench": {"type": "Property", "value": true}, "id": "urn:ngsi-ld:OSMPublicTransportStop:node:441728803",
    "location": {"type": "GeoProperty", "value": {"coordinates": [-3.7037, 40.4167],
    "type": "Point"}}, "name": {"type": "Property", "value": "Sol - Puerta del Sol"},
    "network": {"type": "Property", "value": "Metro de Madrid"}, "operator": {"type":
    "Property", "value": "Metro de Madrid"}, "osmId": {"type": "Property", "value":
    441728803}, "osmLastModified": {"type": "Property", "value": {"@type": "DateTime",
    "@value": "2023-09-21T08:30:00Z"}}, "osmType": {"type": "Property", "value": "node"},
    "publicTransportType": {"type": "Property", "value": "station"}, "ref": {"type":
    "Property", "value": "SOL"}, "seeAlso": {"type": "Property", "value": ["https://www.openstreetmap.org/node/441728803"]},
    "shelter": {"type": "Property", "value": true}, "source": {"type": "Property",
    "value": "https://www.openstreetmap.org"}, "tactilePaving": {"type": "Property",
    "value": true}, "transportMode": {"type": "Property", "value": ["subway", "bus"]},
    "type": "OSMPublicTransportStop", "wheelchair": {"type": "Property", "value":
    "yes"}}'
