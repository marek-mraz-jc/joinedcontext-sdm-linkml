      Model:'https://wiki.openstreetmap.org/wiki/Key:tunnel'
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/tunnel
  layer:
    description: Property. Vertical layer relative to other features at the same location,
      used to indicate overlapping ways. Model:'https://wiki.openstreetmap.org/wiki/Key:layer'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/layer
  lit:
    description: Property. Indicates whether the road is illuminated by street lighting.
      Model:'https://wiki.openstreetmap.org/wiki/Key:lit'
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/lit
  operator:
    description: Property. Name of the entity responsible for the operation or maintenance
      of this road. Model:'https://wiki.openstreetmap.org/wiki/Key:operator'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/operator
  widthMeters:
    description: Property. Physical width of the road in metres. Units:'m'. Model:'https://wiki.openstreetmap.org/wiki/Key:width'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/widthMeters
    unit:
      ucum_code: m
      exact_mappings:
      - ucefact:MTR
      - qudt-unit:M
      has_quantity_kind: qudt-quantkind:ElevationRelativeToNAP
  cyclewayPresent:
    description: Property. Indicates whether a dedicated cycle lane is present alongside
      this road. Model:'https://wiki.openstreetmap.org/wiki/Key:cycleway'
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/cyclewayPresent
  sidewalk:
    description: Property. Indicates the presence and side of a sidewalk alongside
      the road. Model:'https://wiki.openstreetmap.org/wiki/Key:sidewalk'
    range: sidewalk_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/sidewalk
  inclinePercent:
    description: Property. Slope of the road expressed as a percentage. Positive values
      indicate uphill. Units:'%'. Model:'https://wiki.openstreetmap.org/wiki/Key:incline'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/inclinePercent
    unit:
      ucum_code: '%'
      exact_mappings:
      - ucefact:P1
      - qudt-unit:PERCENT
      has_quantity_kind: qudt-quantkind:DimensionlessRatio
