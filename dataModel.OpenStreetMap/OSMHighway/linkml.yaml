id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMHighway
name: OSMHighway
title: Smart Data Models - OpenStreetMap / OSMHighway
description: A road or path element from OpenStreetMap tagged with the highway key.
  Represents all types of roads, from motorways to footpaths, as defined by the OSM
  highway taxonomy.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
  ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
  qudt-unit: http://qudt.org/vocab/unit/
  qudt-quantkind: http://qudt.org/vocab/quantitykind/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
