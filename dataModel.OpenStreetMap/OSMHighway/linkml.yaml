  spec.source.path: OSMHighway/schema.json
  spec.source.commit: 5188df53c66d3c9f2441b6cffea0b604364ace68
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "cyclewayPresent": {"type": "Property", "value": true}, "highwayType": {"type":
    "Property", "value": "primary"}, "id": "urn:ngsi-ld:OSMHighway:way:5837156", "lanes":
    {"type": "Property", "value": 4}, "lit": {"type": "Property", "value": true},
    "location": {"type": "GeoProperty", "value": {"coordinates": [[-3.7024, 40.4192],
    [-3.701, 40.4196], [-3.699, 40.42]], "type": "LineString"}}, "maxSpeed": {"type":
    "Property", "unitCode": "KMH", "value": 50}, "name": {"type": "Property", "value":
    "Gran V\u00eda"}, "oneway": {"type": "Property", "value": false}, "osmId": {"type":
    "Property", "value": 5837156}, "osmLastModified": {"type": "Property", "value":
    {"@type": "DateTime", "@value": "2023-06-14T10:22:00Z"}}, "osmType": {"type":
    "Property", "value": "way"}, "ref": {"type": "Property", "value": "M-30"}, "seeAlso":
    {"type": "Property", "value": ["https://www.openstreetmap.org/way/5837156"]},
    "sidewalk": {"type": "Property", "value": "both"}, "source": {"type": "Property",
    "value": "https://www.openstreetmap.org"}, "surface": {"type": "Property", "value":
    "asphalt"}, "type": "OSMHighway", "widthMeters": {"type": "Property", "unitCode":
    "MTR", "value": 30}}'
