    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/surface
  access:
    description: Property. General access restriction for the road. Model:'https://wiki.openstreetmap.org/wiki/Key:access'
    range: access_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/access
  bridge:
    description: Property. Indicates whether this road segment runs over a bridge.
      Model:'https://wiki.openstreetmap.org/wiki/Key:bridge'
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/bridge
  tunnel:
