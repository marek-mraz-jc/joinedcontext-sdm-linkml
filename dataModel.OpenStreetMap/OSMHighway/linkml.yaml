    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/osmLastModified
  highwayType:
    description: Property. The OSM highway tag value that classifies the type of road
      or path. Enum:'motorway, trunk, primary, secondary, tertiary, unclassified,
      residential, service, living_street, pedestrian, track, footway, cycleway, path,
      motorway_link, trunk_link, primary_link, secondary_link, tertiary_link, road,
      busway, bus_guideway, construction, proposed'. Model:'https://wiki.openstreetmap.org/wiki/Key:highway'
    range: highwayType_options
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/highwayType
  ref:
