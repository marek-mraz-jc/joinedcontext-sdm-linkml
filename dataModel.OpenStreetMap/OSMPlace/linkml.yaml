    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/areaServed
  osmId:
    description: Property. The original OpenStreetMap element integer identifier.
      Model:'https://wiki.openstreetmap.org/wiki/Elements'
    range: integer
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/osmId
  osmType:
    description: Property. The type of the original OpenStreetMap element.
    range: osmType_options
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/osmType
  osmLastModified:
    description: Property. Timestamp of the last modification of the OSM element.
      Model:'https://wiki.openstreetmap.org/wiki/Elements'
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/osmLastModified
  placeType:
    description: Property. The OSM place tag classifying the territory or populated
      area. Model:'https://wiki.openstreetmap.org/wiki/Key:place'
    range: placeType_options
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/placeType
  population:
    description: Property. Total population of the place. Model:'https://wiki.openstreetmap.org/wiki/Key:population'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/population
  capital:
    description: Property. Indicates if the place is a capital (4=territory/region,
      2=country). Model:'https://wiki.openstreetmap.org/wiki/Key:capital'
    range: capital_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/capital
  rank:
    description: Property. Administrative or prominence rank. Model:'https://wiki.openstreetmap.org/wiki/Key:rank'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/rank
