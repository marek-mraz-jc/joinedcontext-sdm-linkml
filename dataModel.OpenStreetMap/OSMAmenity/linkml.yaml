id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMAmenity
name: OSMAmenity
title: Smart Data Models - OpenStreetMap / OSMAmenity
description: A facility or amenity from OpenStreetMap tagged with amenity=*. Represents
  places of public or private use such as restaurants, schools, hospitals, banks,
  etc
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.OpenStreetMap
  spec.source.path: OSMAmenity/schema.json
  spec.source.commit: 5188df53c66d3c9f2441b6cffea0b604364ace68
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "address": {"type": "Property", "value": {"addressCity": "Madrid", "addressCountry":
    "ES", "houseNumber": "17", "postalCode": "28005", "streetAddress": "Calle de los
    Cuchilleros"}}, "amenityType": {"type": "Property", "value": "restaurant"}, "cuisine":
    {"type": "Property", "value": "regional"}, "id": "urn:ngsi-ld:OSMAmenity:node:1234567890",
    "location": {"type": "GeoProperty", "value": {"coordinates": [-3.7077, 40.4137],
    "type": "Point"}}, "name": {"type": "Property", "value": "Casa Bot\u00edn"}, "openingHours":
    {"type": "Property", "value": "Mo-Su 13:00-16:00, 20:00-23:30"}, "osmId": {"type":
    "Property", "value": 1234567890}, "osmLastModified": {"type": "Property", "value":
    {"@type": "DateTime", "@value": "2023-10-15T09:30:00Z"}}, "osmType": {"type":
    "Property", "value": "node"}, "outdoorSeating": {"type": "Property", "value":
    false}, "phone": {"type": "Property", "value": "+34 913 66 42 17"}, "seeAlso":
    {"type": "Property", "value": ["https://www.openstreetmap.org/node/1234567890"]},
    "source": {"type": "Property", "value": "https://www.openstreetmap.org"}, "type":
    "OSMAmenity", "website": {"type": "Property", "value": "https://www.botin.es/"},
    "wheelchair": {"type": "Property", "value": "no"}}'
