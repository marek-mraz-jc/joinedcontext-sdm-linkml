    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/buildingPartType
  buildingLevels:
