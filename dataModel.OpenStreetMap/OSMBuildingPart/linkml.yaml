id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMBuildingPart
name: OSMBuildingPart
title: Smart Data Models - OpenStreetMap / OSMBuildingPart
description: A part or section of a building from OpenStreetMap tagged with building:part=*.
  Used to represent buildings with varying heights, roof shapes, or materials across
  different sections, enabling 3D building visualisation (Simple 3D Buildings standard).
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
  ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
  qudt-unit: http://qudt.org/vocab/unit/
  qudt-quantkind: http://qudt.org/vocab/quantitykind/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.OpenStreetMap
  spec.source.path: OSMBuildingPart/schema.json
  spec.source.commit: 5188df53c66d3c9f2441b6cffea0b604364ace68
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "buildingColour": {"type": "Property", "value": "#D0D0D0"}, "buildingHeight":
    {"type": "Property", "unitCode": "MTR", "value": 72.0}, "buildingLevels": {"type":
    "Property", "value": 18}, "buildingMaterial": {"type": "Property", "value": "concrete"},
    "buildingPartType": {"type": "Property", "value": "yes"}, "id": "urn:ngsi-ld:OSMBuildingPart:way:305981241",
    "location": {"type": "GeoProperty", "value": {"coordinates": [[[-3.6887, 40.4781],
    [-3.6875, 40.4781], [-3.6875, 40.4773], [-3.6887, 40.4773], [-3.6887, 40.4781]]],
    "type": "Polygon"}}, "minHeight": {"type": "Property", "unitCode": "MTR", "value":
    0.0}, "name": {"type": "Property", "value": "Torre Norte - Hospital La Paz"},
    "osmId": {"type": "Property", "value": 305981241}, "osmLastModified": {"type":
    "Property", "value": {"@type": "DateTime", "@value": "2023-07-04T16:20:00Z"}},
    "osmType": {"type": "Property", "value": "way"}, "refBuilding": {"object": "urn:ngsi-ld:OSMBuilding:way:22234584",
    "type": "Relationship"}, "roofShape": {"type": "Property", "value": "flat"}, "seeAlso":
    {"type": "Property", "value": ["https://www.openstreetmap.org/way/305981241"]},
    "source": {"type": "Property", "value": "https://www.openstreetmap.org"}, "type":
    "OSMBuildingPart"}'
classes:
  OSMBuildingPart:
    class_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/OSMBuildingPart
    description: A part or section of a building from OpenStreetMap tagged with building:part=*.
      Used to represent buildings with varying heights, roof shapes, or materials
      across different sections, enabling 3D building visualisation (Simple 3D Buildings
      standard).
    is_a: Entity
    slots:
    - address
    - alternateName
    - areaServed
    - buildingColour
    - buildingHeight
    - buildingLevels
    - buildingMaterial
    - buildingPartType
    - dataProvider
    - dateCreated
    - dateModified
    - description
    - minHeight
    - minLevel
    - name
    - osmId
    - osmLastModified
    - osmType
    - owner
    - refBuilding
    - roofColour
    - roofMaterial
    - roofShape
    - seeAlso
    - source
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
