    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/buildingLevels
  buildingHeight:
    description: Property. Total height of this building part in metres. Units:'m'.
      Model:'https://wiki.openstreetmap.org/wiki/Key:height'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/buildingHeight
    unit:
      ucum_code: m
      exact_mappings:
      - ucefact:MTR
      - qudt-unit:M
      has_quantity_kind: qudt-quantkind:ElevationRelativeToNAP
  minHeight:
    description: Property. Height above ground at which this building part starts,
      in metres. Used for overhangs and elevated sections. Units:'m'. Model:'https://wiki.openstreetmap.org/wiki/Key:min_height'
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/minHeight
    unit:
      ucum_code: m
      exact_mappings:
      - ucefact:MTR
      - qudt-unit:M
      has_quantity_kind: qudt-quantkind:ElevationRelativeToNAP
  minLevel:
    description: Property. Floor level at which this building part starts. Used for
      indoor mapping. Model:'https://wiki.openstreetmap.org/wiki/Key:min_level'
    range: integer
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/minLevel
  roofShape:
    description: Property. Shape of the roof on this building part. Enum:'flat, gabled,
      hipped, half-hipped, pyramidal, gambrel, mansard, dome, skillion, round, saltbox,
      onion, cone'. Model:'https://wiki.openstreetmap.org/wiki/Key:roof:shape'
    range: roofShape_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/roofShape
  roofMaterial:
    description: Property. Primary material of the roof surface on this part. Model:'https://wiki.openstreetmap.org/wiki/Key:roof:material'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/roofMaterial
  roofColour:
    description: Property. Colour of the roof on this part, expressed as a CSS colour
      name or hex code. Model:'https://wiki.openstreetmap.org/wiki/Key:roof:colour'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/roofColour
  buildingColour:
    description: Property. Colour of the facade of this building part, expressed as
      a CSS colour name or hex code. Model:'https://wiki.openstreetmap.org/wiki/Key:building:colour'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/buildingColour
  buildingMaterial:
    description: Property. Primary facade or structural material of this building
      part. Model:'https://wiki.openstreetmap.org/wiki/Key:building:material'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/buildingMaterial
  refBuilding:
    description: Relationship. URI reference to the parent OSMBuilding entity this
      part belongs to.
    range: uriorcurie
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    slot_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/refBuilding
