id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMRailway
name: OSMRailway
title: Smart Data Models - OpenStreetMap / OSMRailway
description: A railway track or infrastructure element from OpenStreetMap tagged with
  the railway key. Covers all types of rail infrastructure, from mainline heavy rail
  to trams, subways and funiculars.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
  ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
  qudt-unit: http://qudt.org/vocab/unit/
  qudt-quantkind: http://qudt.org/vocab/quantitykind/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.OpenStreetMap
  spec.source.path: OSMRailway/schema.json
  spec.source.commit: 5188df53c66d3c9f2441b6cffea0b604364ace68
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "electrified": {"type": "Property", "value": "contact_line"}, "frequency": {"type":
    "Property", "unitCode": "HTZ", "value": 0}, "gauge": {"type": "Property", "unitCode":
    "MMT", "value": 1445}, "id": "urn:ngsi-ld:OSMRailway:way:2903182", "location":
    {"type": "GeoProperty", "value": {"coordinates": [[-3.6931, 40.4189], [-3.6955,
    40.4185], [-3.698, 40.418]], "type": "LineString"}}, "maxSpeed": {"type": "Property",
    "unitCode": "KMH", "value": 70}, "name": {"type": "Property", "value": "Madrid
    Metro Line 1"}, "operator": {"type": "Property", "value": "Metro de Madrid"},
    "osmId": {"type": "Property", "value": 2903182}, "osmLastModified": {"type": "Property",
    "value": {"@type": "DateTime", "@value": "2024-01-08T15:45:00Z"}}, "osmType":
    {"type": "Property", "value": "way"}, "railwayType": {"type": "Property", "value":
    "subway"}, "ref": {"type": "Property", "value": "1"}, "seeAlso": {"type": "Property",
    "value": ["https://www.openstreetmap.org/way/2903182"]}, "source": {"type": "Property",
    "value": "https://www.openstreetmap.org"}, "tracks": {"type": "Property", "value":
    2}, "tunnel": {"type": "Property", "value": true}, "type": "OSMRailway", "usage":
    {"type": "Property", "value": "main"}, "voltage": {"type": "Property", "unitCode":
    "VLT", "value": 600}}'
