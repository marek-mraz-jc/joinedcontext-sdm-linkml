  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "address": {"type": "Property", "value": {"addressCity": "Madrid", "addressCountry":
    "ES", "postalCode": "28014", "streetAddress": "Paseo del Prado"}}, "fee": {"type":
    "Property", "value": true}, "id": "urn:ngsi-ld:OSMTourism:way:1122334455", "location":
    {"type": "GeoProperty", "value": {"coordinates": [[[-3.6926, 40.4137], [-3.6915,
    40.4137], [-3.6915, 40.413], [-3.6926, 40.413], [-3.6926, 40.4137]]], "type":
    "Polygon"}}, "name": {"type": "Property", "value": "Museo del Prado"}, "osmId":
    {"type": "Property", "value": 1122334455}, "osmLastModified": {"type": "Property",
    "value": {"@type": "DateTime", "@value": "2023-08-10T14:20:00Z"}}, "osmType":
    {"type": "Property", "value": "way"}, "seeAlso": {"type": "Property", "value":
    ["https://www.openstreetmap.org/way/1122334455"]}, "source": {"type": "Property",
    "value": "https://www.openstreetmap.org"}, "tourismType": {"type": "Property",
    "value": "museum"}, "type": "OSMTourism", "wheelchair": {"type": "Property", "value":
    "yes"}}'
