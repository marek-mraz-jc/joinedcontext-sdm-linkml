id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMTourism
name: OSMTourism
title: Smart Data Models - OpenStreetMap / OSMTourism
description: A tourist attraction or tourism-related facility from OpenStreetMap tagged
  with tourism=*. Includes hotels, museums, viewpoints, artworks, etc
prefixes:
