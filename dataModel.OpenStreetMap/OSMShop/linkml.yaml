id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMShop
name: OSMShop
title: Smart Data Models - OpenStreetMap / OSMShop
description: A shop or retail store from OpenStreetMap tagged with shop=*. Represents
  establishments selling retail products directly to end customers
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.OpenStreetMap
  spec.source.path: OSMShop/schema.json
  spec.source.commit: 5188df53c66d3c9f2441b6cffea0b604364ace68
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "address": {"type": "Property", "value": {"addressCity": "Madrid", "addressCountry":
    "ES", "postalCode": "28001", "streetAddress": "Calle Ayala"}}, "brand": {"type":
    "Property", "value": "Mercadona"}, "id": "urn:ngsi-ld:OSMShop:node:9876543210",
    "location": {"type": "GeoProperty", "value": {"coordinates": [-3.6816, 40.4287],
    "type": "Point"}}, "name": {"type": "Property", "value": "Mercadona"}, "openingHours":
    {"type": "Property", "value": "Mo-Sa 09:00-21:30"}, "organic": {"type": "Property",
    "value": "no"}, "osmId": {"type": "Property", "value": 9876543210}, "osmLastModified":
    {"type": "Property", "value": {"@type": "DateTime", "@value": "2024-01-22T10:15:00Z"}},
    "osmType": {"type": "Property", "value": "node"}, "seeAlso": {"type": "Property",
    "value": ["https://www.openstreetmap.org/node/9876543210"]}, "shopType": {"type":
    "Property", "value": "supermarket"}, "source": {"type": "Property", "value": "https://www.openstreetmap.org"},
    "type": "OSMShop", "wheelchair": {"type": "Property", "value": "yes"}}'
classes:
