id: https://github.com/smart-data-models/dataModel.OpenStreetMap/OSMHistoric
name: OSMHistoric
title: Smart Data Models - OpenStreetMap / OSMHistoric
description: A historic site or monument from OpenStreetMap tagged with historic=*.
  This data model is a derivative work based on the OpenStreetMap Wiki, licensed under
  CC BY-SA 2.0 by OpenStreetMap contributors.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.OpenStreetMap
  spec.source.path: OSMHistoric/schema.json
  spec.source.commit: 5188df53c66d3c9f2441b6cffea0b604364ace68
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.OpenStreetMap/refs/heads/master/context.jsonld"],
    "fee": {"type": "Property", "value": true}, "heritage": {"type": "Property", "value":
    "yes"}, "historicType": {"type": "Property", "value": "castle"}, "id": "urn:ngsi-ld:OSMHistoric:relation:456654",
    "location": {"type": "GeoProperty", "value": {"coordinates": [[[-3.7145, 40.418],
    [-3.7135, 40.418], [-3.7135, 40.417], [-3.7145, 40.417], [-3.7145, 40.418]]],
    "type": "Polygon"}}, "name": {"type": "Property", "value": "Palacio Real de Madrid"},
    "osmId": {"type": "Property", "value": 456654}, "osmLastModified": {"type": "Property",
    "value": "2023-11-20T10:45:00Z"}, "osmType": {"type": "Property", "value": "relation"},
    "ruins": {"type": "Property", "value": false}, "seeAlso": {"type": "Property",
    "value": ["https://www.openstreetmap.org/relation/456654", "https://es.wikipedia.org/wiki/Palacio_Real_de_Madrid"]},
    "source": {"type": "Property", "value": "https://www.openstreetmap.org"}, "startDate":
    {"type": "Property", "value": "1738"}, "type": "OSMHistoric"}'
classes:
  OSMHistoric:
    class_uri: https://smartdatamodels.org/dataModel.OpenStreetMap/OSMHistoric
    description: A historic site or monument from OpenStreetMap tagged with historic=*.
      This data model is a derivative work based on the OpenStreetMap Wiki, licensed
      under CC BY-SA 2.0 by OpenStreetMap contributors.
    is_a: Entity
    slots:
    - address
    - alternateName
    - areaServed
    - dataProvider
    - dateCreated
    - dateModified
    - description
    - fee
    - heritage
    - heritageLevel
    - historicType
    - name
    - osmId
    - osmLastModified
    - osmType
    - owner
    - ruins
    - seeAlso
    - source
    - startDate
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.OpenStreetMap@5188df53c66d3c9f2441b6cffea0b604364ace68
