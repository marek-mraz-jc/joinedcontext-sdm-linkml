name: OpenChannelJunction
title: Open Channel Management - OpenChannelJunction
description: This entity contains a harmonised description of a generic Junction made
  for Raw-Water (Open Channels) System Management domain. A Junction defines a location
  where the characteristics of the channel changes, two or more channels come together
  or split apart, amounts of water are abstracted or inserted to the system etc.
