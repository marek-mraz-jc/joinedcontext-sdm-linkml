  curveType:
    description: 'Property. Type of curve for spillways and regulation structures.
      It can be a curve representing: 1) the discharge coefficient (C) as a function
      of relative weir opening (a/H, a: sluice-gate opening, H: upstream head), 2)
      the discharge (Q) as a function of the water elevation (H), 3) the design discharge
      coefficient (Co) as a function of P/Ho, where P is the apron elevation of the
      OGEE spillway and Ho the design upstrean head, 4) discharge coefficient (C)
      as a function of H/L, where H is the upstream head and L the legnth of a BROAD-CRESTED
      spillway, 5) the function C/Co - H/Ho. Enum:''C-a/H, H-Q, Co-P/Ho, C-H/L, C/Co-H/Ho'''
