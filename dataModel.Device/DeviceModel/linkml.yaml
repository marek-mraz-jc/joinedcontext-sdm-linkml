id: https://github.com/smart-data-models/dataModel.Device/DeviceModel
name: DeviceModel
title: ' Smart Data Models - Device Model schema'
description: 'This entity captures the static properties of a Device. '
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.Device
  spec.source.path: DeviceModel/schema.json
  spec.source.commit: eb22fd87a9d89cf68099b0eef1c796969eae5bbf
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.Device/master/context.jsonld"],
    "brandName": {"type": "Property", "value": "myDevice"}, "category": {"type": "Property",
    "value": ["sensor"]}, "controlledProperty": {"type": "Property", "value": ["fillingLevel",
