    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/owner
  seeAlso:
    description: Property. list of uri pointing to additional resources about the
      item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/seeAlso
  color:
    description: Property. The color of the product. Model:'https://schema.org/color'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/color
  image:
    description: Property. An image of the item. Model:'https://schema.org/URL'
    range: uriorcurie
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/image
  annotations:
    description: Property. Annotations about the item. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/annotations
  deviceClass:
    description: 'Property. Model:''https://schema.org/Text''. Class of constrained
      device as specified by RFC 7228. If the device is not a constrained device this
      property shall not be present. Normative References: [RFC7228](https://tools.ietf.org/html/rfc7228#section-3).
      Enum:''C0, C1, C2'''
    range: deviceClass_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/deviceClass
  function:
    description: Property. Model:'https://schema.org/Text'. The functionality necessary
      to accomplish the task for which a Device is designed. A device can be designed
      to perform more than one function. Defined by [SAREF](https://w3id.org/saref#Function).
      Enum:'levelControl, sensing, onOff, openClose, metering, eventNotification
    range: function_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/function
  supportedUnits:
    description: Property. Model:'https://schema.org/Text'. Units of measurement supported
      by the device. The unit code (text) of measurement given using the [UN/CEFACT
      Common Code](http://wiki.goodrelations-vocabulary.org/Documentation/UN/CEFACT_Common_Codes)
      (max. 3 characters)
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/supportedUnits
  energyLimitationClass:
    description: 'Property. Model:''https://schema.org/Text''. Device''s class of
      energy limitation as per RFC 7228. Normative References: [RFC7228](https://tools.ietf.org/html/rfc7228#page-11).
      Enum:''E0, E1, E2, E9'''
    range: energyLimitationClass_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/energyLimitationClass
  documentation:
    description: Property. Model:'https://schema.org/URL'. A link to device's documentation
    range: uriorcurie
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/documentation
  brandName:
    description: Property. Model:'https://schema.org/Text'. Device's brand name
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/brandName
  modelName:
    description: Property. Model:'https://schema.org/Text. Device's model name
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/modelName
  manufacturerName:
    description: Property. Model:'https://schema.org/Text'. Device's manufacturer
      name
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataModel.Device/manufacturerName
