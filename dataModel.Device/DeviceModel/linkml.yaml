    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Device@eb22fd87a9d89cf68099b0eef1c796969eae5bbf
    slot_uri: https://smartdatamodels.org/dataProvider
