id: https://github.com/smart-data-models/dataModel.Environment/ElectroMagneticObserved
name: ElectroMagneticObserved
title: Smart - Data - Models. Electro Magnetic Observed schema
description: The Data Model is intended to measure excessive electric and magnetic
  fields (EMFs), or radiation in a work or public environment according to the level
  of exposure to electromagnetic fields on the air. The frequency of the hertzian
  waves is conventionally lower than 300 GHz, propagating in space without artificial
  guide. They are between 9 kHz and 300 GHz.
