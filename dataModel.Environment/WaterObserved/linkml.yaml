id: https://github.com/smart-data-models/dataModel.Environment/WaterObserved
name: WaterObserved
title: Water Observed schema
description: ' Water observation data model is intended to represent the parameters
  of flow, level and volume of water observed, as well as the swell information, over
  a fixed or variable area. This observation also includes the masses of floating
  objects on this area. The data collected is provided by Sensors, Cameras,Water stations
  positioned at specific or sensitive locations for rivers, streams, torrent, lakes,
  seas, etc.'
