id: https://github.com/smart-data-models/dataModel.PointOfInterest/Store
name: Store
title: Smart Data Models - Point of Interest Store schema
description: This entity Type models stores/shops in the city.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.PointOfInterest
  spec.source.path: Store/schema.json
  spec.source.commit: 7e5e24963a142b9bf6fd15b144a0e24588217608
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.PointOfInterest/master/context.jsonld"],
    "category": {"type": "Property", "value": "GroceryStore"}, "currenciesAccepted":
    {"type": "Property", "value": ["EUR"]}, "dataProvider": {"type": "Property", "value":
    "http://www.smartsantander.eu/"}, "description": {"type": "Property", "value":
    "Cosmetica natural fabricada en Santander."}, "email": {"type": "Property", "value":
    "email@example.com"}, "id": "urn:ngsi-ld:Store:santander:COM4111", "location":
    {"type": "GeoProperty", "value": {"coordinates": [-3.8077562, 43.4628255], "type":
    "Point"}}, "logo": {"type": "Property", "value": "http://www.comerciosantander.com/imagenes/Comercios/124F214A-CE55-5A33-A77D-679C0F848FFC_logo.jpg/resize/50/100"},
    "name": {"type": "Property", "value": "MARTA KAUFMANN"}, "openingHoursSpecification":
    {"type": "Property", "value": [{"closes": "23:59:00", "dayOfWeek": "Monday", "opens":
    "00:02:00"}, {"closes": "23:59:00", "dayOfWeek": "Tuesday", "opens": "00:01:00"},
    {"closes": "23:59:00", "dayOfWeek": "Wednesday", "opens": "00:01:00"}, {"closes":
    "23:59:00", "dayOfWeek": "Thursday", "opens": "00:01:00"}, {"closes": "23:59:00",
    "dayOfWeek": "Friday", "opens": "00:01:00"}]}, "paymentAccepted": {"type": "Property",
    "value": ["cash", "paypal"]}, "source": {"type": "Property", "value": "https://api.smartsantander.eu/"},
    "telephone": {"type": "Property", "value": "(+34) 942 123 123"}, "type": "Store",
    "url": {"type": "Property", "value": "https://exampleStoreUrl.com"}}'
classes:
  Store:
    class_uri: https://smartdatamodels.org/dataModel.PointOfInterest/Store
    description: This entity Type models stores/shops in the city.
    is_a: Entity
    slots:
    - address
    - alternateName
    - areaServed
    - category
    - currenciesAccepted
    - dataProvider
    - dateCreated
    - dateModified
    - description
    - email
    - endDate
    - logo
    - name
    - openingHours
    - openingHoursSpecification
    - owner
    - paymentAccepted
    - seeAlso
    - source
    - startDate
    - telephone
    - url
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
