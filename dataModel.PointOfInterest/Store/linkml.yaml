    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/areaServed
  openingHoursSpecification:
    description: Property. A structured value providing information about the opening
      hours of a place or a certain service inside a place. Model:'https://schema.org/openingHoursSpecification'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/openingHoursSpecification
  startDate:
    description: Property. Model:'https://schema.org/startDate'. The start date and
      time of the item (in ISO 8601 date format).
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/startDate
  endDate:
    description: Property. Model:'https://schema.org/endDate'. The end date and time
      of the item (in ISO 8601 date format).
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/endDate
  openingHours:
    description: 'Property. Model:''https://schema.org/openingHours''. The general
      opening hours for a business. Opening hours can be specified as a weekly time
      range, starting with days, then times per day. Multiple days can be listed with
      commas '','' separating each day. Day or time ranges are specified using a hyphen
      ''-''. Days are specified using the following two-letter combinations: Mo, Tu,
      We, Th, Fr, Sa, Su. Times are specified using 24:00 format. For example, 3pm
      is specified as 15:00, 10am as 10:00. Here is an example: <time itemprop=''openingHours''
      datetime=''Tu,Th 16:00-20:00''>Tuesdays and Thursdays 4-8pm</time>. If a business
      is open 7 days a week, then it can be specified as <time itemprop=''openingHours''
      datetime=''Mo-Su''>Monday through Sunday, all day</time>'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/openingHours
