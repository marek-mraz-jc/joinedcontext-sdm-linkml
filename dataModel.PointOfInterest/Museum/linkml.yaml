  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
slots:
  dateCreated:
    description: Property. Entity creation timestamp. This will usually be allocated
      by the storage platform
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dateCreated
  dateModified:
    description: Property. Timestamp of the last modification of the entity. This
      will usually be allocated by the storage platform
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dateModified
  source:
    description: Property. A sequence of characters giving the original source of
      the entity data as a URL. Recommended to be the fully qualified domain name
      of the source provider, or the URL to the source object
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/source
  name:
    description: Property. The name of this item
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/name
  alternateName:
    description: Property. An alternative name for this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/alternateName
  description:
    description: Property. A description of this item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: http://purl.org/dc/terms/description
  dataProvider:
    description: Property. A sequence of characters identifying the provider of the
      harmonised data entity
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataProvider
  owner:
    description: Property. A List containing a JSON encoded sequence of characters
      referencing the unique Ids of the owner(s)
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/owner
  seeAlso:
    description: Property. list of uri pointing to additional resources about the
      item
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/seeAlso
  address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    range: Address
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/areaServed
  museumType:
    description: Property. Model:'https://schema.org/Text'. Type of museum according
      to the exhibited content. Enum:'appliedArts, scienceAndTechnology, fineArts,music,
      history, sacredArt, archaeology, specials,decorativeArts, literature, medicineAndPharmacy,
      maritime,transports, military, wax, popularArtsAndTraditions,numismatic, unesco,
      ceramics, sumptuaryArts, naturalScience,prehistoric, ethnology, railway, mining,
      textile, sculpture,multiDisciplinar, painting, paleonthology, modernArt,thematic,
      architecture, museumHouse, cathedralMuseum,diocesanMuseum, universitary, contemporaryArt,
      bullfighting'. Other possible source for museum types not covered above is [Wikipedia](https://en.wikipedia.org/wiki/Category:Types_of_museum)
    range: museumType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/museumType
  facilities:
    description: Property. Model:'https://schema.org/Text'. Describes different facilities
      offered by this museum. Enum:'elevator, cafeteria, shop, auditory,conferenceRoom,
      audioguide, cloakRoom, forDisabled, forBabies,guidedTour, restaurant, ramp,
      reservation'. or any other value needed by an application
    range: facilities_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/facilities
  historicalPeriod:
    description: Property. Model:'https://schema.org/Text'. An ISO8601 time interval.
      For example 1920/1940. The second element of the interval can be left empty
      to denote 'till now'. A comma separated list of years, for instance 1620,1625,1718.       -   A
      century, represented by a year pattern, for instance 19xx would correspond to
      the twentieth century. And 196x would correspond to the sixties decade
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/historicalPeriod
  artPeriod:
    description: Property. Model:'https://schema.org/Text'.Corresponds to the art
      period(s) of the exhibitions made by this museum. Allowed values:-Those defined
      by [Wikipedia](https://en.wikipedia.org/wiki/Art_periods).- Any other extended
      value needed by an application and not described by the above resource
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/artPeriod
  buildingType:
    description: Property. Model:'https://schema.org/Text'. Type of building that
      hosts the museum. Enum:'prehistoricPlace, acropolis, alcazaba,aqueduct, alcazar,
      amphitheatre, arch, polularArchitecture,basilica, road, chapel, cartuja, nobleHouse,
      residence,castle, castro, catacombs, cathedral, cloister, convent,prehistoricCave,
      dolmen, officeBuilding, houseBuilding,industrialBuilding, militaryBuilding,
      hermitage, fortress,sculpturalGroups, church, garden, fishMarket, masia,masiaFortificada,
      minaret, monastery, monolith, walls,necropolis, menhir, mansion, palace, pantheon,
      pazo,pyramid, bridge, gate, arcade, walledArea, sanctuary,grave, synagogue,
      taulasTalayotsNavetas, theathre, temple,spring, tower, archeologicalSite, university,
      graveyard,fortifiedTemple, civilEngineering, square, seminar,bullfightingRing,
      publicBuilding, town, cavesAndTouristicMines,proCathedral, mosque, circus, burialMound'
    range: buildingType_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/buildingType
  featuredArtist:
    description: Property. Model:'https://schema.org/Person'. Main featured artist(s)
      at this museum
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/featuredArtist
  contactPoint:
    description: Property. Model:'https://schema.org/ContactPoint'. Contact point
      for the museum
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/contactPoint
  touristArea:
    description: Property. Model:'https://schema.org/Text'. Tourist area at which
      this museum is located. Precise semantics might depend on the application or
      target country or region. For instance `Costa del Sol`
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/touristArea
  openingHoursSpecification:
    description: Property. A structured value providing information about the opening
      hours of a place or a certain service inside a place. Model:'https://schema.org/openingHoursSpecification'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/openingHoursSpecification
  refSeeAlso:
    description: Property. Model:'https://schema.org/URL'. List of references to one
      or more related entities
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest@7e5e24963a142b9bf6fd15b144a0e24588217608
    slot_uri: https://smartdatamodels.org/dataModel.PointOfInterest/refSeeAlso
