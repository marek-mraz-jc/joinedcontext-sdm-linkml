  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.PointOfInterest/master/context.jsonld"],
    "address": {"type": "Property", "value": {"addressCountry": "ES", "addressLocality":
    "Barcelona", "streetAddress": "Plaza Dels \u00c0ngels, 1"}}, "alternateName":
    {"type": "Property", "value": "MACBA"}, "artPeriod": {"type": "Property", "value":
    ["contemporary"]}, "description": {"type": "Property", "value": "The MACBA was
    designed by the American architect Richard Meier and inaugurated in 1995."}, "facilities":
    {"type": "Property", "value": ["shop", "cloakRoom", "guidedTour"]}, "id": "urn:ngsi-ld:Museum:Museum-Barcelona-MACBA-1234",
    "location": {"type": "GeoProperty", "value": {"coordinates": [2.1668771521199393,
    41.38302235796602], "type": "Point"}}, "museumType": {"type": "Property", "value":
    ["fineArts"]}, "name": {"type": "Property", "value": "Museo de Arte Contemporaneo
    de Barcelona"}, "openingHoursSpecification": {"type": "Property", "value": [{"closes":
    "19:30:00", "dayOfWeek": "Monday", "opens": "11:00:00"}, {"closes": "19:30:00",
    "dayOfWeek": "Tuesday", "opens": "11:00:00"}, {"closes": "19:30:00", "dayOfWeek":
    "Wednesday", "opens": "11:00:00"}, {"closes": "19:30:00", "dayOfWeek": "Thursday",
    "opens": "11:00:00"}, {"closes": "19:30:00", "dayOfWeek": "Friday", "opens": "11:00:00"},
    {"closes": "21:00:00", "dayOfWeek": "Saturday", "opens": "10:00:00"}, {"closes":
    "15:00:00", "dayOfWeek": "Sunday", "opens": "10:00:00"}]}, "source": {"type":
    "Property", "value": "http://www.tourspain.es"}, "touristArea": {"type": "Property",
    "value": "Barcelona-Capital"}, "type": "Museum"}'
