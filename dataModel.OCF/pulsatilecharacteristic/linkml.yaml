    description: Property. This Property describes the current pulsatile characteristic
      measurement. The value is an integer bit mapped value. The following describes
      what each integer means. 0 - Quality of the detected pulse is nominal, in that
      there are no recognized abnormalities in the detected pulse. 1 - Perfusion or
      quality of the detected pulse is marginal. 2 - Perfusion or quality of the detected
      pulse is minimal. 3 - Perfusion or quality of the detected pulse is unacceptable
    range: integer
