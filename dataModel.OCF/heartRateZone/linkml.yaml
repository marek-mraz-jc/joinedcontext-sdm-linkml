title: Heart Rate Zone
description: 'Smart Data Models Program adaptation of the original IoTData data Models.
  This Resource describes a measured heart rate by the current Zone using the Zoladz
  method. The Zoladz method defines Zones based on maximum heart rate; Zone 1 is the
  lowest, Zone 5 is the highest. The heartRateZone is an enumeration containing one
  of: ''Zone1'', ''Zone2'', ''Zone3'', ''Zone4'', and ''Zone5''. '
