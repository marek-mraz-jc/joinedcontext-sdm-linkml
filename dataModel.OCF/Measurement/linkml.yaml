    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/unit
  measurement:
    description: Property. Measured value for this sensor, units depend on the specific
      type of sensor
    range: float
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/measurement
  precision:
    description: Property. When exposed the value in 'precision' provides a +/- tolerance
      against the Properties in the Resource. Thus if a Property is UPDATED to a value
      and that Property then RETRIEVED, the RETRIEVED value is valid if in the range
      of the set value +/- precision
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/precision
  n:
    description: Property. Friendly name of the Resource
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/n
  range:
    description: Property. The valid range for the Property in the Resource as a number.
      The first value in the array is the minimum value, the second value in the array
      is the maximum value
    range: float
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/range
  step:
    description: Property. Step value across the defined range an integer when the
      range is a number.  This is the increment for valid values across the range;
      so if range is 0.0..10.0 and step is 2.5 then valid values are 0.0,2.5,5.0,7.5,10.0
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/step
  if:
    description: Property. The OCF Interface set supported by this Resource
    range: if_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
    slot_uri: https://smartdatamodels.org/dataModel.OCF/if
