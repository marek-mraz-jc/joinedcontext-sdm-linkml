    slot_uri: https://smartdatamodels.org/areaServed
  rt:
    description: Property. The Resource Type.
    range: rt_options
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.OCF@645c2120dd789c25ce409fac086559a22a2abcc3
