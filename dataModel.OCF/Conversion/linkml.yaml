name: Conversion
title: Conversion Factor
description: 'Smart Data Models Program adaptation of the original IoTData data Models.
  This Resource describes Properties associated with the energy associated with the
  consumption of different fuels (including natural gas) The conversion factor is
  a number used as part of the calculation to convert gas volume to gas energy. The
  value used for this calculation is generally defined by local regulations and the
  conversion factor resource is therefore configurable. Provides the conversion factor
  used/required as part of the calculation to convert from fuel volume (m3) to fuel
  energy (kWh). '
