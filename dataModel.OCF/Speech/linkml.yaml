classes:
  Speech:
    class_uri: https://smartdatamodels.org/dataModel.OCF/Speech
    description: "Smart Data Models Program adaptation of the original IoTData data\
      \ Models. This Resource may be created on the OCF Server that is capable of\
      \ rendering speech by an OCF Client and allows the client to provide an SSML\
      \ document with text to render  or may be created on the OIC Server by some\
      \ resident application. The audio rendered is at this stage local to the Server\
