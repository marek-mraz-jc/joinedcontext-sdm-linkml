id: https://github.com/smart-data-models/dataModel.OCF/Speech
name: Speech
title: Speech Synthesis-TTS
description: "Smart Data Models Program adaptation of the original IoTData data Models.\
  \ This Resource may be created on the OCF Server that is capable of rendering speech\
  \ by an OCF Client and allows the client to provide an SSML document with text to\
  \ render  or may be created on the OIC Server by some resident application. The\
  \ audio rendered is at this stage local to the Server (i.e. not streamed). The utterance\
  \ is an SSML document. The supportedLanguages is an array of the RFC5646 defined\
  \ language tags that are supported. The supportedVoices is an SSML document fragment\
  \ indicating the voices that are supported. Utterance in the example shall be a\
  \ properly escaped (JSON rules) SSML document. An example:   '<?xml version='1.0'\
  \ encoding='ISO-8859-1'?> \r   <speak version='1.1' xmlns='http://www.w3.org/2001/10/synthesis'\
  \ \r   \txmlns:xsi='http://www.w3.org/2001/XMLSchema-instance' \r   \txsi:schemaLocation='http://www.w3.org/2001/10/synthesis\
  \ \r   \thttp://www.w3.org/TR/speech-synthesis11/synthesis.xsd' \r   \txml:lang='en-US'>\
  \ \r    \r   \tThe title of the movie is: \r   \t'Monty Pythons The Meaning of Life'\
  \ \r   \twhich is directed by Terry Jones. \r   </speak' "
