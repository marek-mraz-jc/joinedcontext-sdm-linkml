name: consumable
title: Consumable
description: Smart Data Models Program adaptation of the original IoTData data Models.
  This Resource specifies a thing that can be consumed such as filter material, printer
  toner etc The Propert 'typeofconsumable' is an enumeration defining the thing being
  consumed as defined by the Smart Home Device Specification The Property 'remaining'
  is an integer capturing the percentatge remaining life The Property 'orderpercentage'
  is an integer capturing the percentage life at which replacement or replenishment
  is recommended by the manufacturer The Property 'url' is a string containing a URL
  at which further information may be obtained with respect to the consumable.
