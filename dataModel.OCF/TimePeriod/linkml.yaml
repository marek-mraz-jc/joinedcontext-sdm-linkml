      no less than 0 minute.The intervalsecond is the interval of the time period
      in seconds, if present this value must be numerical zero or greater.The repeat
      is the number of the time period's iteration, which means how many times to
      repeat the time period. The Property 'repeat' accepts only negative one, numerical
      zero, and positive number. When this value is numerical zero, the time period
      will be repeated infinitely until a client makes it stop by inputting negative
      one for the value.The Property 'stoptime' and 'interval' are mutually exclusive;
      both Properties cannot be present in a Resource instance.The Property 'intervalsecond'
      cannot be presented with the Property 'stopTime'. In case of both the Property
      'interval' and 'intervalsecond' are presented together, the total time interval
      is the sum of 'interval' and 'intervalsecond'.The Property 'triggertiming' describes
      a specific time to execute an action. This property must have one of the values
      among 'startTime', 'stopTime', and 'totalInterval'. The totalInterval means
      the sum of the Property 'interval' and 'intervalsecond'. If one of the properties
      does not exist, the value of the unexpressed property is taken as a numerical
      zero.The Property 'state' describes a state of time interval. This property
      must have one of the values among 'preInterval', 'inInterval', and 'postInterval'.The
      Resource defines a time period for information retrieval, action or other behaviour.
