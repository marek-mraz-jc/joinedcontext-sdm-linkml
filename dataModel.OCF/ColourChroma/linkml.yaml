id: https://github.com/smart-data-models/dataModel.OCF/ColourChroma
name: ColourChroma
title: Colour Chroma
description: Smart Data Models Program adaptation of the original IoTData data Models.
  This Resource describes the colour using chroma conventions. Properties are 'hue',
  'saturation', 'csc', and 'ct'. The Property 'hue' is the hue angle, it is an integer
  value as defined by the CIECAM02 model definition (see reference [CIE CIE159:2004]).
  The Property 'saturation' is an integer value as defined by the CIECAM02 model definition
  (see reference [CIE CIE159:2004]). The Property 'maximumsaturation' is the upper
  bound on the saturation supported by the Device. If not present the maximum value
  for 'saturation' is 32767. The Property 'csc' is the colour space coordinates in
  CIE colour space.   The first item in the array is the X coordinate.   The second
  item in the array is the Y coordinate. The Property 'nct' is the Mired colour temperature.
  The Resource provides the colour using chroma conventions.
