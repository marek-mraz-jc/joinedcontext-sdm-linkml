id: https://github.com/smart-data-models/dataModel.OCF/WaterInfo
name: WaterInfo
title: Water Info
description: Smart Data Models Program adaptation of the original IoTData data Models.
  This Resource describes the water information to indicate type of water currently
  provided by the device. The water type can be read or set. The Property 'supportedwatertypes'
  is an array of the possible water types are defined by the enumeration ['cold',
  'hot', 'ambient', 'ice']. The Property 'supportedadditivetypes' is an array of the
  possible additive types for water. The additive types mean optional types that can
  be added to the specific water type according to Client's preference and are defined
  by the enumeration ['none', 'soda', 'mineral']. If absent, the default value is
  'none'.  The Property 'currentwatertype' is the currently desired water type.  The
  Property 'currentadditivetypes' is the currently desired additive type(s).  For
  example, if 'cold' is selected with the 'currentwatertype', 'soda' and 'mineral'
  or both can be selected as 'currentadditivetypes'. Note that if 'hot' is selected
  with the 'currentwatertype', 'soda' and 'mineral' may be restricted for the 'currentadditivetypes'.
