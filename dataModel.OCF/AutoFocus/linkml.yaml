title: Auto Focus
description: Smart Data Models Program adaptation of the original IoTData data Models.
  This Resource describes an auto focus on/off feature. The Property 'autoFocus' is
  a boolean. An 'autoFocus' value of 'true' means that the auto focus feature is on.
  An 'autoFocus' value of 'false' means that the auto focus feature is off. Note that
  when Pan Tilt Zoom (see 'Pan Tilt Zoom' Resource definition) is used the autofocus
  works only in the selected area.
