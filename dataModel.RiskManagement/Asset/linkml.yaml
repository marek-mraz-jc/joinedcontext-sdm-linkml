id: https://github.com/smart-data-models/dataModel.RiskManagement/Asset
name: Asset
title: Smart Data Models - Risk Assessment - Asset Entity
description: An item of value to stakeholders. An asset may be tangible (e.g., a physical
  item such as hardware, firmware, computing platform, network device, or other technology
  component) or intangible (e.g., humans, data, information, software, capability,
  function, service, trademark, copyright, patent, intellectual property, image, or
  reputation). The value of an asset is determined by stakeholders in consideration
  of loss concerns across the entire system life cycle. Such concerns include but
  are not limited to business or mission concerns.
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
