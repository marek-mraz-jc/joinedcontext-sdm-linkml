  spec.source.commit: fde381ce01bc30479a17e447577fd2401afdf45a
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"description": {"type": "Property", "value": "An asset-01
    description"}, "id": "urn:ngsi-ld:Asset:01", "location": {"type": "GeoProperty",
    "value": {"coordinates": [[[23.6627, 41.88768], [25.85598, 43.38622], [23.4899,
    43.78691], [22.35609, 42.28869], [23.6627, 41.88769]]], "type": "Polygon"}}, "name":
    {"type": "Property", "value": "Asset-01"}, "type": "Asset"}'
