id: https://github.com/smart-data-models/dataModel.RiskManagement/Mitigation
name: Mitigation
title: Smart Data Models - Risk Assessment - Mitigation Entity
description: The mitigation of consequences reduces the risk after an event has occurred.
  Therefore, this risk reduction measure is not suitable for the reduction of the
  likelihood of events but for the reduction of the negative consequences. Examples
  for consequence mitigation measures could be e.g. the construction of connection
  pipes to the neighbor water supplier(s) to get water from them in case of a breakdown
  of the own water supply, the construction of wells for an emergency supply or signing
  of contracts with organizations providing small mobile emergency water treatment
  plants.
