id: https://github.com/smart-data-models/dataModel.RiskManagement/Risk
name: Risk
title: Smart Data Models - Risk Assessment - Risk Entity
description: Effect of uncertainty on objectives. An effect is a deviation from the
  expected—positive and/or negative. Objectives can have different aspects (such as
  financial, health and safety, and environmental goals) and can apply at different
  levels (such as strategic, organization-wide, project, product and process). Risk
  is often characterized by reference to potential events and consequences, or a combination
  of these. Risk is often expressed in terms of a combination of the consequences
  of an event (including changes in circumstances) and the associated likelihood of
  occurrence. Uncertainty is the state, even partial, of deficiency of information
  related to, understanding or knowledge of, an event, its consequence, or likelihood.
