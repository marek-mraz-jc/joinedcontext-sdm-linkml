    service related to education, for example pre-school education, elementary school,
    higher education and university\u2026"}, "eventType": {"type": "Property", "value":
    ["Starting education"]}, "id": "urn:ngsi-ld:CPSV-AP:LifeEvent:4157c56b-754b-4f92-b4b1-0256b9a472a2",
    "identifier": {"type": "Property", "value": "http://cefat4cities.crosslang.com/content/LifeEvent0e1037aafacc4fc39ee14d3c4391cc78"},
