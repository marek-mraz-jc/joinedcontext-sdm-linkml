id: https://github.com/smart-data-models/dataModel.CPSV-AP/Evidence
name: Evidence
title: Smart Data models - Evidence schema
description: The Evidence class is defined in the Core Criterion and Core Evidence
  vocabulary (CCCEV) as any resource that can document or support a criterion response.
  It contains information that proves that a criterion requirement exists or is true,
  in particular evidences are used to prove that a specific criterion is met. Although
  the wording of the definition is different, the semantics are an exact match for
  CPSV's Input class which it replaces. Evidence can be any resource - document, artefact
  – anything needed for executing the Public Service. In the context of Public Services,
  Evidence is usually administrative documents or completed application forms. A specific
  Public Service may require the presence of certain Evidence or combinations of Evidence
  in order to be delivered. In some cases, the Output of one service will be Evidence
  for another service. Such relationships should be described in the associated Rule(s).
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.CPSV-AP
  spec.source.path: Evidence/schema.json
  spec.source.commit: a05d1663475fc0f79361bc9bc2550c3f24df1ba0
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smart-data-models.github.io/dataModel.CPSV-AP/context.jsonld",
    "https://raw.githubusercontent.com/smart-data-models/dataModel.CPSV-AP/master/context.jsonld"],
    "description": {"type": "Property", "value": "The application must include the
    applicant''s name or company name, domicile or registered office and address.
    A trademark can be applied for by either a company, an organization or a private
    person."}, "evidenceType": {"type": "Property", "value": "Declaration of Oath"},
    "id": "urn:ngsi-ld:CPSV-AP:Evidence:5eafa833-6dba-430d-b2f0-64379ee20b94", "identifier":
    {"type": "Property", "value": "https://www.prh.fi/input/form"}, "language": {"type":
    "Property", "value": ["http://publications.europa.eu/resource/authority/language/FIN",
    "http://publications.europa.eu/resource/authority/language/SWE"]}, "name": {"type":
    "Property", "value": "Form to apply for a trademark"}, "relatedDocumentation":
    {"type": "Property", "value": ["https://www.prh.fi/stc/forms/tavaramerkin_rekisterointihakemus.pdf"]},
    "type": "Evidence"}'
