  address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    range: AddressAddress
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/areaServed
  addressArea:
    description: Property. The name of a geographic area that groups Addresses. This
      would typically be part of a city, a neighbourhood or village, e.g. Montmartre.
      Address area is not an administrative unit. address ID Literal 0..*.. A globally
      unique identifier for each instance of an Address. The concept of adding a globally
      unique identifier for each instance of an address is a crucial part of the INSPIRE
      data spec. A number of EU countries have already implemented an ID (a UUID)
      in their Address Register/gazetteer, among them Denmark. OASIS xAL also includes
      an address identifier. It is the address Identifier that allows an address to
      be represented in a format other than INSPIRE whilst remaining conformant to
      the Core Vocabulary
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/addressArea
  addressID:
    description: Property. A globally unique identifier for each instance of an Address.
      A globally unique identifier for each instance of an Address. The INSPIRE method
      of representing addresses is very detailed, designed primarily for use in databases
      of addresses. Whilst data that is published in full conformance with the INSPIRE
      data structure can be made available using the Core Location Vocabulary the
      reverse is not true since the Core Vocabulary allows much greater flexibility.
      Many datasets that include address data as one piece of information about something
      else are likely to have that data in simpler formats. These might be tailored
      to the specific need of the dataset, follow a national norm, or make use of
      a standard like vCard
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/addressID
  adminUnitL1:
    description: Property. The name of the uppermost level of the address, almost
      always a country. Best practice is to use the ISO 3166-1 code but if this is
      inappropriate for the context, country names should be provided in a consistent
      manner to reduce ambiguity. For example, either write 'France' or 'FRA' consistently
      throughout the dataset and avoid mixing the two. The Country controlled vocabulary
      from the Publications Office can be reused for this
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/adminUnitL1
  adminUnitL2:
    description: Property. The name of a secondary level/region of the address, usually
      a county, state or other such area that typically encompasses several localities.
      Values could be a region or province, more granular than level 1
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/adminUnitL2
  fullAddress:
    description: 'Property. The complete address written as a string. Use of this
      property is not recommended as it will suffer any misunderstandings that might
      arise through the breaking up of an address into its component parts. This property
      is analogous to vCard''s label property but with two important differences:
      (1) formatting is not assumed so that, unlike vCard label, it may not be suitable
      to print this on an address label, (2) vCard''s label has a domain of vCard
      Address; the fullAddress property has no such restriction. An example of a full
      address is ''Champ de Mars, 5 Avenue Anatole France, 75007 Paris, France'''
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/fullAddress
  locatorName:
    description: Property. Proper noun(s) applied to the real world entity identified
      by the locator. The key difference between a locator and a locator name is that
      the latter is a proper name and is unlikely to include digits. For example,
      'Shumann, Berlaymont' is a meeting room within the European Commission headquarters
      for which locator name is more appropriate than locator.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/locatorName
  postCode:
    description: Property. The code created and maintained for postal purposes to
      identify a subdivision of addresses and postal delivery points. Post codes are
      common elements in many countries' postal address systems. One of the many post
      codes of Paris is for example '75000'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/postCode
  postName:
    description: Property. A name created and maintained for postal purposes to identify
      a subdivision of addresses and postal delivery points. Usually a city, for example
      'Paris'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/postName
  poBox:
    description: Property. A location designator for a postal delivery point at a
      post office, usually a number. INSPIRE's name for this is 'postalDeliveryIdentifier'
      for which it uses the locator designator property with a type attribute of that
      name. This vocabulary separates out the Post Office Box for greater independence
      of technology. An example post office box number is '9383'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/poBox
  thoroughfare:
    description: Property. The name of a passage or way through from one location
      to another.A thoroughfare is usually a street, but it might be a waterway or
      some other feature. For example, 'Avenue des Champs-Élysées'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP@a05d1663475fc0f79361bc9bc2550c3f24df1ba0
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/thoroughfare
