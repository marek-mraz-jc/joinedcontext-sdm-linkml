  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://smart-data-models.github.io/dataModel.CPSV-AP/context.jsonld",
    "https://raw.githubusercontent.com/smart-data-models/dataModel.CPSV-AP/master/context.jsonld"],
    "description": {"type": "Property", "value": "The mayor of the municipality or
    his/her authorised representative checks whether the signature to be legalised
    corresponds to that of the person whose identity is being established. A signature
    on a white sheet of paper can never be legalised."}, "id": "urn:ngsi-ld:CPSV-AP:Rule:7e331270-c97d-4ee9-ab29-693f9dc75a3c",
    "identifier": {"type": "Property", "value": "Rule7e331270c97d4ee9ab29693f9dc75a3c"},
    "implements": {"type": "Relationship", "value": ["urn:ngsi-ld:CPSV-AP:LegalResource:7e331270-8b9e-46d5-8371-81c8ad0cced5",
    "urn:ngsi-ld:CPSV-AP:LegalResource:7e331271-5a3e-2d9a-8371-81c8ad0cced5"]}, "language":
    {"type": "Property", "value": ["http://publications.europa.eu/resource/authority/language/ENG"]},
    "name": {"type": "Property", "value": "DEFAULT NAME"}, "type": "Rule"}'
