id: https://github.com/smart-data-models/dataModel.CPSV-AP/CriterionRequirement
name: CriterionRequirement
title: Smart Data models - CPSV-AP CriterionRequirement schema
description: Not all public services are needed or usable by everyone. For example,
  the visa service operated by European countries is not needed by European citizens
  but is needed by some citizens from elsewhere, or public services offering unemployment
  benefits and grants are targeting specific societal groups. The CPSV reuses the
  Core Criterion and Core Evidence Vocabulary (CCCEV - https://joinup.ec.europa.eu/release/core-criterion-and-core-evidence-vocabulary-v100)
  for this class. The CCCEV provides more details but the Criterion Requirement class
  has three mandatory properties.
