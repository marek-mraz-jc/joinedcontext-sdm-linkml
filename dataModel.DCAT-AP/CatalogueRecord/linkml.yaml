id: https://github.com/smart-data-models/dataModel.DCAT-AP/CatalogueRecord
name: CatalogueRecord
title: Smart Data models - DCAT-AP Catalogue Record
description: This is a Catalogue Record belonging to a dataset according to the DCAT-AP
  standard 2.1.1
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
default_range: string
imports:
- linkml:types
- ngsi-ld-core
annotations:
  spec.source.repository: https://github.com/smart-data-models/dataModel.DCAT-AP
  spec.source.path: CatalogueRecord/schema.json
  spec.source.commit: ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
  spec.source.commons: https://github.com/smart-data-models/data-models@325ea7069e4c3bd73d1000339ff0ecdf0310365b
  spec.source.example: '{"@context": ["https://raw.githubusercontent.com/smart-data-models/dataModel.DCAT-AP/master/context.jsonld"],
    "address": {"type": "Property", "value": {"addressCountry": "Luxembourg", "addressLocality":
    "Luxembourg", "addressRegion": "Luxembourg", "postOfficeBoxNumber": "", "postalCode":
    "2985", "streetAddress": "2, rue Mercier"}}, "id": "urn:ngsi-ld:CatalogueRecord:id:KFTL:88140679",
    "language": {"type": "Property", "value": ["EN", "ES"]}, "listingDate": {"type":
    "Property", "value": "2021-07-02T18:37:55Z"}, "location": {"type": "GeoProperty",
    "value": {"coordinates": [36.633152, -85.183315], "type": "Point"}}, "modified":
    {"type": "Property", "value": "2021-07-02T18:37:55Z"}, "primaryTopic": {"type":
    "Property", "value": "Public administration"}, "title": {"type": "Property", "value":
    ["Example of catalogue record", "Ejemplo de registro de cat\u00e1logo"]}, "type":
    "CatalogueRecord"}'
classes:
  CatalogueRecord:
    class_uri: https://smartdatamodels.org/dataModel.DCAT-AP/CatalogueRecord
    description: This is a Catalogue Record belonging to a dataset according to the
      DCAT-AP standard 2.1.1
    is_a: Entity
    slots:
    - address
    - areaServed
    - conformsTo
    - description
    - issued
    - language
    - modified
    - primaryTopic
    - source
    - status
    - title
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
  Address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    attributes:
      streetAddress:
        description: Property. The street address. Model:'https://schema.org/streetAddress'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      addressLocality:
        description: Property. The locality in which the street address is, and which
          is in the region. Model:'https://schema.org/addressLocality'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      addressRegion:
        description: Property. The region in which the locality is, and which is in
          the country. Model:'https://schema.org/addressRegion'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      addressCountry:
        description: Property. The country. For example, Spain. Model:'https://schema.org/addressCountry'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      postalCode:
        description: Property. The postal code. For example, 24004. Model:'https://schema.org/https://schema.org/postalCode'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      postOfficeBoxNumber:
        description: Property. The post office box number for PO box addresses. For
          example, 03578. Model:'https://schema.org/postOfficeBoxNumber'
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      streetNr:
        description: Property. Number identifying a specific property on a public
          street
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
      district:
        description: Property. A district is a type of administrative division that,
          in some countries, is managed by the local government
        annotations:
          ngsi_ld_kind: Property
          upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
slots:
  address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    range: Address
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/areaServed
  primaryTopic:
    description: Property. Model:'http://www.w3.org/ns/dcat#Dataset'. This property
      links the Catalogue Record to the Dataset, Data service or Catalog described
      in the record
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/primaryTopic
  modified:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property contains the most recent date on which the Catalogue entry was changed
      or modified
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/modified
  conformsTo:
    description: Property. Model:'http://purl.org/dc/terms/Standard'. This property
      refers to an Application Profile that the Dataset's metadata conforms to
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/conformsTo
  status:
    description: Property. Model:'http://www.w3.org/2004/02/skos/core#Concept'. This
      property refers to the type of the latest revision of a Dataset's entry in the
      Catalogue
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://uri.etsi.org/ngsi-ld/status
  issued:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property contains the date on which the description of the Dataset was included
      in the Catalogue
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/issued
  description:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property contains a free-text account of the record. This property can be repeated
      for parallel language versions of the description
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: http://purl.org/dc/terms/description
  language:
    description: Property. Model:'http://purl.org/dc/terms/LinguisticSystem'. This
      property refers to a language used in the textual metadata describing titles,
      descriptions, etc. of the Dataset. This property can be repeated if the metadata
      is provided in multiple languages
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/language
  source:
    description: Property. Model:'http://www.w3.org/ns/dcat#CatalogRecord'. This property
      refers to the original metadata that was used in creating metadata for the Dataset
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/source
  title:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property contains a name given to the Catalogue Record. This property can be
      repeated for parallel language versions of the name
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: http://purl.org/dc/terms/title
