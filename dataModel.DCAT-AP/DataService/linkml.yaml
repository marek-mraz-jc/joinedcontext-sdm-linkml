    annotations:
      ngsi_ld_kind: GeoProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://uri.etsi.org/ngsi-ld/operationSpace
  page:
    description: 'Property. Model:''http://xmlns.com/foaf/0.1/page''. A page or document
      about this Data Service. Cardinality: 0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/page
  provenance:
    description: Property. Model:'http://purl.org/dc/terms/ProvenanceStatement'. List
