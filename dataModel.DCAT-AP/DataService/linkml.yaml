slots:
  address:
    description: Property. The mailing address. Model:'https://schema.org/address'
    range: Address
    annotations:
      ngsi_ld_kind: JsonProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/address
  areaServed:
    description: Property. The geographic area where a service or offered item is
      provided. Model:'https://schema.org/Text'
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/areaServed
  accessRights:
    description: Property. Model:'http://purl.org/dc/terms/RightsStatement'. This
      property MAY include information regarding access or restrictions based on privacy,
      security, or other policies.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/accessRights
  applicableLegislation:
    description: 'Property. Model:''http://data.europa.eu/r5r/applicableLegislation''.
      The legislation that mandates the creation or management of the Data Service.
      Cardinality: 0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/applicableLegislation
  conformsTo:
    description: 'Property. Model:''http://purl.org/dc/terms/conformsTo''. An established
      (technical) standard to which the Data Service conforms. The standards referred
      here SHOULD describe the Data Service and not the data it serves. The latter
      is provided by the dataset with which this Data Service is connected. For instance
      the data service adheres to the OGC WFS API standard, while the associated dataset
      adheres to the INSPIRE (https://knowledge-base.inspire.ec.europa.eu/index_en)
      Address data model. Cardinality: 0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/conformsTo
  contactPoint:
    description: 'Property. Model:''http://www.w3.org/ns/dcat#contactPoint''. Contact
      information that can be used for sending comments about the Data Service. Cardinality:
      0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/contactPoint
  description:
    description: LanguageProperty. Model:'http://purl.org/dc/terms/description'. A
      free-text account of the Data Service.
    annotations:
      ngsi_ld_kind: LanguageProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: http://purl.org/dc/terms/description
  endpointDescription:
    description: Relationship. Model:'http://www.w3.org/2000/01/rdf-schema#Resource'.
      This property contains a description of the services available via the end-points,
      including their operations, parameters etc. The property gives specific details
      of the actual endpoint instances, while dct:conformsTo is used to indicate the
      general standard or specification that the endpoints implement.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/endpointDescription
  endpointURL:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Resource'.
      The root location or primary endpoint of the service (an IRI)
    required: true
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/endpointURL
  format:
    description: 'Property. Model:''http://purl.org/dc/terms/format''. The structure
      that can be returned by querying the endpointURL. Cardinality: 0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://uri.etsi.org/ngsi-ld/format
  keyword:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property contains a keyword or tag, describing the Data Service.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/keyword
  landingPage:
    description: Property. Model:'http://xmlns.com/foaf/0.1/Document'. This property
      refers to a web page that provides access to the Data Service and/or additional
      information. It is intended to point to a landing page at the original data
      service provider, not to a page on a site of a third party, such as an aggregator.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/landingPage
  lastUpdated:
    description: Property. Model:'https://schema.org/DateTime'. Last time at which
      the data service has been updated in a way that changes its behavior.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/lastUpdated
  license:
    description: Property. Model:'http://purl.org/dc/terms/LicenseDocument'. This
