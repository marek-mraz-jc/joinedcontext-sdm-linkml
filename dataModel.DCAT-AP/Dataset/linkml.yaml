  title:
    description: LanguageProperty. Model:'http://purl.org/dc/terms/title'. This property
      contains a name given to the Dataset. This property can be repeated for parallel
      language versions of the name.
    required: true
    annotations:
      ngsi_ld_kind: LanguageProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: http://purl.org/dc/terms/title
  Type:
    description: Property. Model:'http://www.w3.org/2004/02/skos/core#Concept'. This
      property refers to the type of the Dataset. A recommended controlled vocabulary
      data-type is foreseen. The value SHOULD be taken from a well governed and broadly
      recognised controlled vocabulary, such as DCMI Type vocabulary (https://www.dublincore.org/specifications/dublin-core/dcmi-terms/#section-7),
      [ISO-19115-1] scope codes (https://standards.iso.org/iso/19115/resources/Codelists/gml/MD_ScopeCode.xml),
      Datacite resource types [DataCite] (https://schema.datacite.org/meta/kernel-4.1/include/datacite-resourceType-v4.1.xsd),
      PARSE.Insight content-types used by re3data.org [RE3DATA-SCHEMA] (https://www.re3data.org/)
      (see item 15 contentType), MARC intellectual resource types (http://id.loc.gov/vocabulary/marcgt.html).
      Some members of these controlled vocabularies are not strictly suitable for
      datasets or data services (e.g., DCMI Type Event, PhysicalObject; [ISO-19115-1](https://www.w3.org/TR/vocab-dcat-3/#bib-iso-19115-1)
      CollectionHardware, CollectionSession, Initiative, Sample, Repository), but
      might be used in the context of other kinds of catalogs defined in DCAT profiles
      or applications.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/Type
  validationSchema:
    description: Property. Model:'https://schema.org/url'. URL to the technical validation
      schema for the dataset (JSON Schema) in the Smart Data Models program.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/validationSchema
  version:
