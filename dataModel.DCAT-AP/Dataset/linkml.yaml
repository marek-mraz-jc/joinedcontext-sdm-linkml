    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/license
  modified:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property contains the most recent date on which the Dataset was changed or modified.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/modified
  otherIdentifier:
    description: Relationship. Model:'http://www.w3.org/ns/adms#Identifier'. This
      property refers to a secondary identifier of the Dataset, such as MAST/ADS,
      DataCite, DOI, EZID or W3ID.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/otherIdentifier
  page:
    description: Relationship. Model:'http://xmlns.com/foaf/0.1/Document'. This property
      refers to a page or document about this Dataset.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/page
  provenance:
    description: Property. Model:'http://purl.org/dc/terms/ProvenanceStatement'. This
      property contains a statement about the lineage of a Dataset.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/provenance
  publisher:
    description: Property. Model:'http://xmlns.com/foaf/0.1/Agent'. This property
      refers to an entity (organisation) responsible for making the Dataset available.
    annotations:
      ngsi_ld_kind: Property
