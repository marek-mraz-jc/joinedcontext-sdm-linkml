    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/publisher
  qualifiedAttribution:
    description: Relationship. Model:'https://semiceu.github.io/DCAT-AP/releases/3.0.0/#Attribution'.
      This property refers to a link to an Agent having some form of responsibility
      for the resource.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/qualifiedAttribution
  qualifiedRelation:
    description: Relationship. Model:'http://www.w3.org/ns/dcat#Relationship'. This
      property provides a link to a description of a relationship with another resource.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/qualifiedRelation
  relation:
    description: Relationship. Model:'http://www.w3.org/2000/01/rdf-schema#Resource'.
      This property refers to a related resource.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/relation
  reputation:
    description: 'Property. Model:''https://schema.org/Text''. Reputation level according
      to MELODA5 reputation dimension: * Level1Reputation: no information about the
      reputation of the data source. * Level2Reputation: statistics or reports published
      on user’s opinions. * Level3Reputation: Indicators or rankings on reputation
      of the data source.'
    range: reputation_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/reputation
  reputationOrganization:
    description: Property. Model:'https://schema.org/url'. URI to the organization
      which is responsible for the publication of the dataset in terms of reputation.
      It matches the dimension reputation of MELODA5 and it allows to retrieve their
      prestige from the ranking.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/reputationOrganization
  sample:
    description: Relationship. Model:'http://www.w3.org/ns/dcat#Distribution'. This
      property refers to a sample distribution of the dataset.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/sample
  source:
    description: Relationship. Model:'http://www.w3.org/ns/dcat#Dataset'. This property
      refers to a related Dataset from which the described Dataset is derived.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/source
  spatial:
    description: GeoProperty. Model:'http://purl.org/dc/terms/Location'. This property
      refers to a geographic region that is covered by the Dataset.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/spatial
  spatialResolution:
    description: Property. Model:'http://www.w3.org/2000/01/rdf-schema#Literal'. This
      property refers to the minimum spatial separation resolvable in a dataset, measured
      in meters.
    range: float
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/spatialResolution
  standardization:
    description: 'Property. Model:''https://schema.org/Text''. The type of data model
      standardization followed by the dataset. This is an enumeration with three (4)
      possible values: * Level1Standardization: data model standardized by the publisher
      without releasing the documentation. * Level2Standardization: data model standardized
      by the published releasing the documentation. * Level3Standardization: data
      model using a local standard (national or smaller regional scope). * Level4Standardization:
      data model using an international standard.'
    range: standardization_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/standardization
  standardizationSource:
    description: Property. Model:'https://schema.org/url'. URI to the source where
      the definitions of the attributes can be read. It is associated with the standardization
      property. It can be empty in case of Level1 and Level2 or link to an existing
      standardization body (e.g., DIN, UNE, etc.) for Level3 or (e.g., ISO, W3C, etc.)
      for Level4.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/standardizationSource
  temporal:
    description: Property. Model:'http://purl.org/dc/terms/PeriodOfTime'. This property
      refers to a temporal period that the Dataset covers.
