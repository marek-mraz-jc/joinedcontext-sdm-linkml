    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/distribution
  geolocation:
    description: Property. Model:'https://schema.org/Boolean'. Defines if the data
