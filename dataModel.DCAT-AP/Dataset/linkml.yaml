slots:
  accessMechanism:
    description: 'Property. Model:''https://schema.org/Text''. Access level according
      to the 3 levels of MELODA5 metric. The expected values are: * Level1AccessMechanism:
      Web access or unique URL parameters to dataset. * Level2AccessMechanism: Web
      Access unique with parameters to single data. * Level3AccessMechanism: API or
      query language.'
    range: accessMechanism_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/accessMechanism
  accessRights:
    description: Property. Model:'http://purl.org/dc/terms/RightsStatement'. This
      property refers to information that indicates whether the Dataset is open data,
      has access restrictions or is not public.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/accessRights
  accuralPeriodicity:
    description: Property. Model:'http://purl.org/dc/terms/Frequency'. This property
      refers to the frequency at which the Dataset is updated.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/accuralPeriodicity
  addressesAvailable:
    description: Property. Model:'https://schema.org/Boolean'. Defines if the data
      stream has postal addresses to identify the elements in the dataset.
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/addressesAvailable
  applicableLegislation:
    description: 'Property. Model:''http://data.europa.eu/r5r/applicableLegislation''.
      The legislation that mandates the creation or management of the Dataset. Cardinality:
      0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/applicableLegislation
  belongsToCatalogue:
    description: 'Relationship. It links the Dataset to its parent Catalogue. Model:''https://www.w3.org/ns/dcat#Catalogue''.
      Note: this attribute does not belong to the current version of DCAT-AP, 2.1.1.'
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/belongsToCatalogue
  conformsTo:
    description: Property. Model:'http://purl.org/dc/terms/conformsTo'. This property
      refers to an implementing rule or other specification.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/conformsTo
  contactPoint:
    description: 'Property. Model:''http://www.w3.org/ns/dcat#contactPoint''. Contact
      information that can be used for sending comments about the Dataset. Cardinality:
      0..n.'
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/contactPoint
  creator:
    description: Property. Model:'http://xmlns.com/foaf/0.1/Agent'. This property
      refers to the entity primarily responsible for producing the dataset.
    annotations:
      ngsi_ld_kind: ListProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/creator
  description:
    description: LanguageProperty. Model:'http://purl.org/dc/terms/description'. This
      property contains a free-text account of the Dataset. This property can be repeated
      for parallel language versions of the description.
    required: true
    annotations:
      ngsi_ld_kind: LanguageProperty
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: http://purl.org/dc/terms/description
  dissemination:
    description: 'Property. Model:''https://schema.org/Text''. Dissemination level
      according to MELODA5 communication dimension: * Level1Dissemination: communication/dissemination
      not systematic. * Level2Dissemination: available resources on updates (i.e.,
      RSS feed). * Level3Dissemination: proactive dissemination/push dissemination
      (information automatic and timely).'
    range: dissemination_options
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/dissemination
  disseminationOrganization:
    description: Property. Model:'https://schema.org/url'. URI to the organization
      which is responsible for dissemination activities related to the dataset. It
      matches the dimension/communication of MELODA5.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.DCAT-AP@ba0a8cef86460ec008c5bc961fdb07f8c8d164ff
    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/disseminationOrganization
  distribution:
    description: Relationship. Model:'http://www.w3.org/ns/dcat#Distribution'. This
