    slot_uri: https://smartdatamodels.org/dataModel.DCAT-AP/language
  license:
    description: Property. Model:'http://purl.org/dc/terms#LicenseDocument'. This
      property refers to the license under which the Dataset is made available. Id
      of the license according to the enumerated values. It is extracted from the
      id of the SPDX standard (https://spdx.org/licenses).
