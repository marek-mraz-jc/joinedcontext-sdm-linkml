id: https://github.com/smart-data-models/dataModel.DCAT-AP/Distribution
name: Distribution
title: Smart Data models DCAT-AP distribution of a Dataset, according to DCAT-AP 2.1.1
description: This is a distribution belonging ot a dataset according to the DCAT-AP
